<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>État de Paie Mensuel</title>
    <style>
      @page { size: A4 landscape; margin: 0; }
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        background-color: #f0f0f0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        padding: 20px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .print-btn {
        position: fixed;
        top: 10px;
        right: 10px;
        background: #7c3aed;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        z-index: 999;
        box-shadow: 0 2px 8px rgba(0,0,0,0.2);
      }
      .print-btn:hover { background: #6d28d9; }

      .print-page {
        background: white;
        width: 297mm;
        margin: 20px auto;
        padding: 8mm;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        position: relative;
        min-height: 210mm;
        page-break-after: always;
      }
      .print-page:last-child { page-break-after: auto; }

      .page-number {
        position: absolute;
        bottom: 5mm;
        right: 8mm;
        font-size: 8px;
        color: #999;
      }

      .editable-date { cursor: pointer; border-bottom: 1px dashed #999; padding: 0 2px; min-width: 80px; display: inline-block; }
      .editable-date:hover { background: #e8f0fe; }
      .editable-date:focus { outline: 2px solid #1976d2; background: #fff; border-bottom: none; }
      @media print {
        body { background: none; padding: 0; }
        .print-page {
          box-shadow: none;
          width: 100%;
          padding: 5mm;
          margin: 0;
          min-height: 100vh;
        }
        .print-btn { display: none !important; }
        .editable-date { border-bottom: none; }
      }

      /* EN-TÊTE */
      .header { display: flex; align-items: flex-start; justify-content: space-between; border-bottom: 3px double #000; padding-bottom: 5px; margin-bottom: 8px; }
      .header-left { font-size: 10px; line-height: 1.7; }
      .header-left .republique { font-weight: bold; font-size: 11px; text-transform: uppercase; }
      .header-left .devise { font-style: italic; font-size: 9px; color: #555; }
      .header-left .mairie { font-weight: 900; font-size: 13px; text-transform: uppercase; margin-top: 2px; }
      .header-center { text-align: center; flex: 1; padding: 0 15px; }
      .header-center .titre { font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: 2px; border: 2px solid #000; padding: 5px 14px; display: inline-block; }
      .header-center .sous-titre { font-size: 11px; font-weight: bold; margin-top: 4px; color: #333; }
      .header-right { text-align: right; font-size: 10px; line-height: 1.7; }
      .header-right .periode { font-size: 16px; font-weight: 900; letter-spacing: 2px; display: block; }

      /* RÉSUMÉ */
      .resume-section { display: flex; gap: 6px; margin-bottom: 8px; }
      .resume-card { flex: 1; border: 1px solid #000; padding: 4px 8px; text-align: center; }
      .resume-card .card-label { font-size: 8px; text-transform: uppercase; font-weight: bold; color: #555; }
      .resume-card .card-value { font-size: 13px; font-weight: 900; margin-top: 1px; font-family: 'Courier New', monospace; }
      .resume-card.brut .card-value { color: #1d4ed8; }
      .resume-card.retenues .card-value { color: #c00; }
      .resume-card.net .card-value { color: #15803d; }
      .resume-card.agents .card-value { color: #7c3aed; }

      /* TABLEAU */
      table.main-table { width: 100%; border-collapse: collapse; font-size: 10px; table-layout: fixed; }
      table.main-table th { background: #374151; color: white; border: 1px solid #000; padding: 4px 4px; text-align: center; font-size: 9px; line-height: 1.3; }
      table.main-table th.left { text-align: left; }
      table.main-table td { border: 1px solid #aaa; padding: 3px 4px; vertical-align: middle; }
      table.main-table td.right { text-align: right; font-family: 'Courier New', monospace; font-size: 9px; }
      table.main-table td.center { text-align: center; }
      table.main-table tr:nth-child(even) td { background: #f9fafb; }
      table.main-table tfoot td { background: #1e3a5f; color: white; font-weight: bold; border: 1px solid #000; padding: 4px; font-size: 10px; }
      table.main-table tfoot td.right { text-align: right; font-family: 'Courier New', monospace; }
      tr.report-row td { background: #fef3c7 !important; font-weight: bold; font-style: italic; }
      tr.total-row td { background: #dbeafe !important; font-weight: bold; border: 1px solid #000; }

      .no-data { text-align: center; padding: 20px; color: #888; font-style: italic; }

      .signatures { display: flex; justify-content: space-between; margin-top: 14px; font-size: 9px; }
      .sig-block { text-align: center; width: 28%; border: 1px solid #ccc; padding: 6px; }
      .sig-block .sig-title { font-weight: bold; text-transform: uppercase; font-size: 9px; border-bottom: 1px solid #ccc; padding-bottom: 3px; margin-bottom: 25px; }
      .sig-line { border-top: 1px solid #000; padding-top: 2px; font-size: 8px; color: #555; }
      .footer-doc { text-align: right; font-size: 7px; color: #999; margin-top: 6px; border-top: 1px dashed #ccc; padding-top: 3px; }
    </style>
  </head>
  <body>
    <button class="print-btn" onclick="window.print()">Imprimer</button>
    <div id="content">
      <div class="print-page" style="display:flex;align-items:center;justify-content:center;color:#888">Chargement...</div>
    </div>

    <script src="dexie.min.js"></script>
    <script>
      const MOIS_LABELS = ['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre'];
      const ROWS_PER_PAGE = 10;

      function fmt(n) { return Number(n||0).toLocaleString('fr-FR'); }

      function buildHeader(maisVille, maisCode, moisLabel, annee, totalBrut, totalRetenues, totalNet, nbAgents) {
        return `
          <div class="header">
            <div class="header-left">
              <div class="republique">REPUBLIQUE DE CÔTE D'IVOIRE</div>
              <div class="devise">Union – Discipline – Travail</div>
              <div class="mairie">COMMUNE DE ${maisVille}</div>
              ${maisCode ? `<div style="font-size:9px;margin-top:2px">Code : <strong>${maisCode}</strong></div>` : ''}
            </div>
            <div class="header-center">
              <div class="titre">ÉTAT DE PAIE</div>
              <div class="sous-titre">Récapitulatif des rémunérations — ${moisLabel} ${annee}</div>
            </div>
            <div class="header-right">
              <span class="periode">${moisLabel.toUpperCase()}<br>${annee}</span>
            </div>
          </div>
          <div class="resume-section">
            <div class="resume-card agents"><div class="card-label">Agents payés</div><div class="card-value">${nbAgents}</div></div>
            <div class="resume-card brut"><div class="card-label">Total brut</div><div class="card-value">${fmt(totalBrut)}</div></div>
            <div class="resume-card retenues"><div class="card-label">Total retenues</div><div class="card-value">${fmt(totalRetenues)}</div></div>
            <div class="resume-card net"><div class="card-label">Total net à payer</div><div class="card-value">${fmt(totalNet)}</div></div>
          </div>`;
      }

      function buildTableHead() {
        return `<thead><tr>
          <th style="width:3%">N°</th>
          <th class="left" style="width:7%">Matricule</th>
          <th class="left" style="width:17%">Nom & Prénom</th>
          <th class="left" style="width:10%">Poste</th>
          <th class="left" style="width:7%">Grade</th>
          <th class="left" style="width:9%">Service</th>
          <th style="width:9%">Salaire Base</th>
          <th style="width:8%">Indemnités</th>
          <th style="width:9%">Montant Brut</th>
          <th style="width:8%">Retenues</th>
          <th style="width:9%">Net à Payer</th>
          <th style="width:6%">Statut</th>
        </tr></thead>`;
      }

      document.addEventListener('DOMContentLoaded', async () => {
        let db;
        try {
          db = new Dexie('TresorOfflineDB');
          await db.open();
        } catch (_e) {
          db = new Dexie('TresorDatabase');
          await db.open();
        }

        const params = new URLSearchParams(window.location.search);
        const mois = parseInt(params.get('mois'),10)||new Date().getMonth()+1;
        const annee = parseInt(params.get('annee'),10)||new Date().getFullYear();
        const shouldPrint = params.get('print')==='true';

        try {
          const [mairie, employes, toutesLesFiches] = await Promise.all([
            db.table('mairies').toCollection().first(), db.table('employes').toArray(), db.table('fichesPaie').toArray(),
          ]);

          const fiches = toutesLesFiches.filter(f=>f.mois===mois&&f.annee===annee);
          const empMap = new Map(employes.map(e=>[e.id,e]));
          const maisVille = mairie ? mairie.ville.toUpperCase() : 'VAVOUA';
          const maisCode = mairie ? mairie.code : '';
          const moisLabel = MOIS_LABELS[mois-1]||'';
          const dateAujourdhui = new Date().toLocaleDateString('fr-FR',{day:'numeric',month:'long',year:'numeric'});

          let totalBrut=0, totalRetenues=0, totalNet=0;
          fiches.forEach(f => {
            totalBrut += f.montantBrut||0;
            totalRetenues += (f.cotisationCNPS||0)+(f.impotSurSalaire||0)+(f.autresRetenues||0);
            totalNet += f.montantNet||0;
          });

          if(fiches.length===0){
            document.getElementById('content').innerHTML=`<div class="print-page">${buildHeader(maisVille,maisCode,moisLabel,annee,0,0,0,0)}<p class="no-data">Aucun bulletin de paie pour ${moisLabel} ${annee}</p></div>`;
            if(shouldPrint) setTimeout(()=>window.print(),600);
            return;
          }

          const allData = fiches.map((f,i) => {
            const emp = empMap.get(f.employeId);
            const retenues = (f.cotisationCNPS||0)+(f.impotSurSalaire||0)+(f.autresRetenues||0);
            const indemnites = (f.indemniteLogement||0)+(f.indemniteTransport||0)+(f.autresIndemnites||0);
            const statutLabel = f.statut==='paye'?'Payé':f.statut==='valide'?'Validé':'Brouillon';
            const statutCls = f.statut==='paye'?'color:#15803d;font-weight:bold':f.statut==='valide'?'color:#1d4ed8':'color:#6b7280';
            return { idx:i+1, matricule:emp?emp.matricule:'-', nom:emp?`${emp.nom} ${emp.prenom}`:'-', poste:emp?emp.poste||'-':'-', grade:emp?emp.grade||'-':'-', service:emp?emp.service||'-':'-', base:f.salaireBase||0, indemnites, brut:f.montantBrut||0, retenues, net:f.montantNet||0, statutLabel, statutCls };
          });

          const pages = [];
          for(let i=0; i<allData.length; i+=ROWS_PER_PAGE) pages.push(allData.slice(i, i+ROWS_PER_PAGE));
          const totalPages = pages.length;
          let cBrut=0, cRetenues=0, cNet=0;
          let html = '';

          pages.forEach((pageData, idx) => {
            const isLast = idx === totalPages - 1;
            const rBrut=cBrut, rRetenues=cRetenues, rNet=cNet;
            pageData.forEach(d => { cBrut+=d.brut; cRetenues+=d.retenues; cNet+=d.net; });

            const reportRow = idx > 0 ? `<tr class="report-row"><td colspan="8" style="text-align:left;padding-left:8px">REPORT</td><td class="right">${fmt(rBrut)}</td><td class="right">${fmt(rRetenues)}</td><td class="right">${fmt(rNet)}</td><td></td></tr>` : '';
            const dataRows = pageData.map(d => `<tr>
              <td class="center">${d.idx}</td>
              <td><strong>${d.matricule}</strong></td>
              <td>${d.nom}</td>
              <td>${d.poste}</td>
              <td>${d.grade}</td>
              <td>${d.service}</td>
              <td class="right">${fmt(d.base)}</td>
              <td class="right">${fmt(d.indemnites)}</td>
              <td class="right" style="font-weight:bold;color:#1d4ed8">${fmt(d.brut)}</td>
              <td class="right" style="color:#c00">${fmt(d.retenues)}</td>
              <td class="right" style="font-weight:bold;color:#15803d">${fmt(d.net)}</td>
              <td class="center" style="${d.statutCls};font-size:9px">${d.statutLabel}</td>
            </tr>`).join('');
            const totalRow = `<tr class="total-row"><td colspan="8" style="text-align:right;padding-right:8px"><strong>${isLast?'TOTAUX GÉNÉRAUX ('+fiches.length+' agents)':'TOTAL'}</strong></td><td class="right"><strong>${fmt(cBrut)}</strong></td><td class="right"><strong>${fmt(cRetenues)}</strong></td><td class="right"><strong>${fmt(cNet)}</strong></td><td></td></tr>`;

            html += `<div class="print-page">
              ${buildHeader(maisVille, maisCode, moisLabel, annee, totalBrut, totalRetenues, totalNet, fiches.length)}
              <table class="main-table">
                <colgroup>
                  <col style="width:3%"/><col style="width:7%"/><col style="width:17%"/><col style="width:10%"/>
                  <col style="width:7%"/><col style="width:9%"/><col style="width:9%"/><col style="width:8%"/>
                  <col style="width:9%"/><col style="width:8%"/><col style="width:9%"/><col style="width:6%"/>
                </colgroup>
                ${buildTableHead()}
                <tbody>${reportRow}${dataRows}${totalRow}</tbody>
              </table>
              ${isLast ? `
                <div class="signatures">
                  <div class="sig-block"><div class="sig-title">L'Ordonnateur</div><div class="sig-line">Nom, Signature & Date</div></div>
                  <div class="sig-block"><div class="sig-title">Le Comptable Municipal</div><div class="sig-line">Nom, Signature & Cachet</div></div>
                  <div class="sig-block"><div class="sig-title">Le Maire</div><div class="sig-line">Nom, Signature & Cachet officiel</div></div>
                </div>
                <div class="footer-doc">Édité le <span class="editable-date" contenteditable="true">${dateAujourdhui}</span> — SIGOBC Mairie de ${mairie?mairie.ville:'Vavoua'} — Document officiel</div>
              ` : ''}
              <div class="page-number">Page ${idx+1}/${totalPages}</div>
            </div>`;
          });

          document.getElementById('content').innerHTML = html;
          if(shouldPrint) setTimeout(()=>window.print(),600);
        } catch(err) {
          document.getElementById('content').innerHTML=`<div class="print-page"><p style="color:red;padding:20px">Erreur: ${err.message}</p></div>`;
        }
      });
    </script>
  </body>
</html>
