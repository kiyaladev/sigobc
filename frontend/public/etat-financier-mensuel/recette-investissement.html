<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>État Mensuel d'Exécution des Recettes d'Investissement</title>
    <!-- Charger Dexie pour accéder à IndexedDB -->
    <script src="../dexie.min.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 12px;
        margin: 0;
        padding: 10px;
      }
      .container {
        width: 100%;
      }
      .header {
        text-align: center;
        font-weight: bold;
        margin-bottom: 10px;
        position: relative;
        height: 70px;
      }
      .main-title {
        text-decoration: underline;
        font-size: 14px;
        margin: 5px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 3px 4px;
      }
      th {
        background-color: #f0f0f0;
        text-align: center;
        vertical-align: middle;
        font-size: 9px;
      }
      .col-code {
        width: 6%;
        text-align: center;
      }
      .col-libelle {
        width: 18%;
        text-align: left;
      }
      .col-num {
        width: 6.5%;
        text-align: right;
        white-space: nowrap;
      }
      .col-percent {
        width: 4%;
        text-align: center;
      }

      .section-header {
        background-color: #e3f2fd;
        font-weight: bold;
      }
      .chap-header {
        font-weight: bold;
        background-color: #e1f5fe;
      }
      .sous-total {
        background-color: #e1f5fe;
        font-weight: bold;
        font-style: italic;
      }
      .total-section {
        background-color: #bbdefb;
        font-weight: bold;
        border-top: 2px solid #000;
      }
      .footer-text {
        margin-top: 15px;
        font-style: italic;
        border-top: 1px solid #000;
        padding-top: 5px;
      }
      .signatures {
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
        padding: 0 50px;
      }
      .signature-box {
        text-align: center;
        width: 200px;
      }
      .loading {
        text-align: center;
        padding: 50px;
        font-size: 16px;
        color: #666;
      }

      .doc-header-cell {
        padding: 0 !important;
        background: #fff !important;
      }

      .doc-header-grid {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
      }
      .doc-header-block {
        padding: 4px 6px;
        min-height: 70px;
      }
      .doc-header-block + .doc-header-block {
        border-left: 1px solid #000;
      }
      .doc-header-left {
        text-align: left;
        font-weight: bold;
      }
      .doc-header-center {
        text-align: center;
        font-weight: bold;
      }
      .doc-header-right {
        text-align: right;
        font-weight: bold;
      }
      .doc-header-center .main-title {
        margin: 0 0 4px 0;
      }

      .print-footer {
        break-inside: avoid;
        page-break-inside: avoid;
      }

      /* Bouton imprimer */
      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 24px;
        background-color: #1976d2;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }
      .print-button:hover {
        background-color: #1565c0;
      }

      .options-bar {
        position: fixed;
        top: 20px;
        right: 180px;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 8px;
        background: #fff;
        border: 1px solid #ccc;
        border-radius: 4px;
        padding: 6px 12px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.15);
        font-size: 13px;
      }
      .options-bar label {
        font-weight: bold;
        white-space: nowrap;
      }
      .options-bar input {
        width: 60px;
        padding: 4px 6px;
        border: 1px solid #aaa;
        border-radius: 3px;
        font-size: 13px;
        text-align: center;
      }

      /* Editable date */
      .editable-date {
        cursor: pointer;
        border-bottom: 1px dashed #999;
        padding: 0 2px;
        min-width: 80px;
        display: inline-block;
      }
      .editable-date:hover {
        background: #e8f0fe;
      }
      .editable-date:focus {
        outline: 2px solid #1976d2;
        background: #fff;
        border-bottom: none;
      }

      @media print {
        .editable-date {
          border-bottom: none;
        }
        body {
          padding: 0;
        }
        .no-print {
          display: none;
        }

        thead {
          display: table-header-group;
        }

        .footer-text,
        .signatures,
        .print-footer {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <div class="options-bar no-print">
      <label for="inputNumero">N° Page Début :</label>
      <input
        type="text"
        id="inputNumero"
        placeholder="Ex: 5"
        oninput="rerenderWithPageNumber(this.value)"
      />
    </div>
    <button class="print-button no-print" onclick="window.print()">🖨️ Imprimer</button>
    <div class="container">
      <div id="content">
        <!-- Les pages seront générées ici par JS -->
      </div>
    </div>

    <!-- Templates cachés pour la génération -->
    <template id="tableHeaderTemplate">
      <thead>
        <tr>
          <th colspan="12" class="doc-header-cell">
            <div class="doc-header-grid">
              <div class="doc-header-block doc-header-left">
                <span class="tpl-departement">DÉPARTEMENT</span><br />
                <span class="tpl-commune">COMMUNE</span><br />
                CODE : <span class="tpl-codeCommune">---</span>
              </div>
              <div class="doc-header-block doc-header-center">
                <div class="main-title">ÉTAT MENSUEL D'EXÉCUTION DES RECETTES</div>
                <div style="color: #1565c0; font-size: 11px">TITRE II - INVESTISSEMENT</div>
                ARTICLE 4 DE LA LOI 81-1129 DU 30/12/1981<br />
                MOIS DE : <strong class="tpl-moisNom">---</strong>
              </div>
              <div class="doc-header-block doc-header-right">
                ANNÉE : <strong class="tpl-annee">----</strong><br />
                N° <span class="tpl-numeroPage"></span>
              </div>
            </div>
          </th>
        </tr>
        <tr>
          <th rowspan="2" class="col-code">COMPTES</th>
          <th rowspan="2" class="col-libelle">RUBRIQUES BUDGÉTAIRES</th>
          <th rowspan="2" class="col-num">PRÉVISIONS</th>
          <th colspan="4">E M I S S I O N S</th>
          <th colspan="4">R E C O U V R E M E N T S</th>
          <th rowspan="2" class="col-percent">%<br />TR/P</th>
        </tr>
        <tr>
          <th class="col-num">ANT.</th>
          <th class="col-num">MOIS</th>
          <th class="col-num">TOTAL</th>
          <th class="col-num">RESTE À<br />ÉMETTRE</th>
          <th class="col-num">ANT.</th>
          <th class="col-num">MOIS</th>
          <th class="col-num">TOTAL</th>
          <th class="col-num">RESTE À<br />RECOUVRER</th>
        </tr>
      </thead>
    </template>

    <template id="footerTemplate">
      <div class="print-footer">
        <div class="footer-text tpl-footerText">
          Arrêté le présent état à la somme de : [SOMME EN LETTRES] FRANCS CFA.
        </div>

        <div class="signatures">
          <div class="signature-box">
            <span class="tpl-lieuSignature">---</span>, le
            <span class="editable-date" contenteditable="true"
              ><span class="tpl-dateSignature">---</span></span
            ><br />
            <strong>Le Trésorier Principal</strong>
          </div>
          <div class="signature-box">
            <br />
            <strong>Le Maire</strong>
          </div>
        </div>
      </div>
    </template>

    <script>
      // Formater un nombre en format monétaire
      function formatNumber(num) {
        if (num === 0 || num === undefined || num === null) return '0';
        return Math.round(num).toLocaleString('fr-FR');
      }

      // Calculer le pourcentage
      function calculatePercent(total, prevision) {
        if (!prevision || prevision === 0) return '0.00';
        return ((total / prevision) * 100).toFixed(2);
      }

      // Libellés des sections (recettes investissement - 02, 04, 06, etc.)
      function getSectionLibelle(code) {
        const libelles = {
          '02': "PRÉLÈVEMENT SUR FONDS D'INVESTISSEMENT",
          '04': "AIDE DE L'ÉTAT - FONDS DE CONCOURS - AIDES EXTÉRIEURES",
          '06': 'RECETTES DIVERSES AU TITRE II',
          '08': 'EMPRUNTS',
        };
        return libelles[code] || `SECTION ${code}`;
      }

      // Libellés des chapitres investissement
      function getChapitreLibelle(code) {
        const libelles = {
          '020': "PRÉLÈVEMENT SUR FONDS D'INVESTISSEMENT",
          '040': "AIDE ET CONCOURS DE L'ÉTAT",
          '041': 'FONDS DE CONCOURS',
          '042': 'AIDES EXTÉRIEURES',
          '060': 'RECETTES DIVERSES TITRE II',
          '066': 'AUTRES RECETTES DIVERSES AU TITRE II',
        };
        return libelles[code] || `CHAP. ${code}`;
      }

      // Générer toutes les lignes du tableau sous forme d'éléments DOM
      function generateRowsFromData(data) {
        const rows = [];

        // Grouper les données par section (02, 04, 06, etc.) puis chapitre
        const hierarchy = {};

        for (const ligne of data.lignes) {
          const code = (ligne.code || '').trim();
          if (!code || code.length < 2) continue;

          // Déterminer la section (premiers 2 chiffres)
          const sectionCode = code.substring(0, 2);
          // Déterminer le chapitre (premiers 3 chiffres) si le code est assez long
          const chapitreCode = code.length >= 3 ? code.substring(0, 3) : sectionCode + '0';

          // Créer la section si nécessaire
          if (!hierarchy[sectionCode]) {
            hierarchy[sectionCode] = {
              code: sectionCode,
              libelle: getSectionLibelle(sectionCode),
              chapitres: {},
              totaux: {
                prevision: 0,
                emissionAnt: 0,
                emissionMois: 0,
                emissionTotal: 0,
                antecedent: 0,
                recetteMois: 0,
                total: 0,
              },
            };
          }

          // Créer le chapitre si nécessaire
          if (!hierarchy[sectionCode].chapitres[chapitreCode]) {
            hierarchy[sectionCode].chapitres[chapitreCode] = {
              code: chapitreCode,
              libelle: getChapitreLibelle(chapitreCode),
              lignes: [],
              totaux: {
                prevision: 0,
                emissionAnt: 0,
                emissionMois: 0,
                emissionTotal: 0,
                antecedent: 0,
                recetteMois: 0,
                total: 0,
              },
            };
          }

          // Ajouter la ligne
          hierarchy[sectionCode].chapitres[chapitreCode].lignes.push(ligne);

          // Valeurs des émissions (utiliser les mêmes valeurs que recouvrements si non fournies)
          const emissionAnt = ligne.emissionAnt || ligne.antecedent || 0;
          const emissionMois = ligne.emissionMois || ligne.recetteMois || 0;
          const emissionTotal = ligne.emissionTotal || ligne.total || 0;

          // Mettre à jour les totaux du chapitre
          hierarchy[sectionCode].chapitres[chapitreCode].totaux.prevision += ligne.prevision || 0;
          hierarchy[sectionCode].chapitres[chapitreCode].totaux.emissionAnt += emissionAnt;
          hierarchy[sectionCode].chapitres[chapitreCode].totaux.emissionMois += emissionMois;
          hierarchy[sectionCode].chapitres[chapitreCode].totaux.emissionTotal += emissionTotal;
          hierarchy[sectionCode].chapitres[chapitreCode].totaux.antecedent += ligne.antecedent || 0;
          hierarchy[sectionCode].chapitres[chapitreCode].totaux.recetteMois +=
            ligne.recetteMois || 0;
          hierarchy[sectionCode].chapitres[chapitreCode].totaux.total += ligne.total || 0;

          // Mettre à jour les totaux de la section
          hierarchy[sectionCode].totaux.prevision += ligne.prevision || 0;
          hierarchy[sectionCode].totaux.emissionAnt += emissionAnt;
          hierarchy[sectionCode].totaux.emissionMois += emissionMois;
          hierarchy[sectionCode].totaux.emissionTotal += emissionTotal;
          hierarchy[sectionCode].totaux.antecedent += ligne.antecedent || 0;
          hierarchy[sectionCode].totaux.recetteMois += ligne.recetteMois || 0;
          hierarchy[sectionCode].totaux.total += ligne.total || 0;
        }

        // Trier et rendre la hiérarchie
        const sortedSections = Object.keys(hierarchy).sort((a, b) => parseInt(a) - parseInt(b));

        for (const sectionCode of sortedSections) {
          const section = hierarchy[sectionCode];

          // Entête de section
          const sectionRow = document.createElement('tr');
          sectionRow.className = 'section-header';
          sectionRow.innerHTML = `
            <td>${section.code}</td>
            <td colspan="12">SECTION ${section.code} - ${section.libelle}</td>
          `;
          rows.push(sectionRow);

          // Trier les chapitres
          const sortedChapitres = Object.keys(section.chapitres).sort(
            (a, b) => parseInt(a) - parseInt(b),
          );

          for (const chapCode of sortedChapitres) {
            const chapitre = section.chapitres[chapCode];

            // Entête de chapitre
            const chapRow = document.createElement('tr');
            chapRow.className = 'chap-header';
            chapRow.innerHTML = `
              <td>${chapitre.code}</td>
              <td colspan="12">CHAP. ${chapitre.libelle}</td>
            `;
            rows.push(chapRow);

            // Lignes du chapitre
            const sortedLignes = chapitre.lignes.sort((a, b) => {
              const aNum = parseInt(a.code, 10);
              const bNum = parseInt(b.code, 10);
              if (!isNaN(aNum) && !isNaN(bNum)) return aNum - bNum;
              return a.code.localeCompare(b.code);
            });

            for (const ligne of sortedLignes) {
              const row = document.createElement('tr');
              const percent = calculatePercent(ligne.total, ligne.prevision);

              // Emissions (utiliser les mêmes valeurs que recouvrements si non fournies)
              const emissionAnt = ligne.emissionAnt || ligne.antecedent || 0;
              const emissionMois = ligne.emissionMois || ligne.recetteMois || 0;
              const emissionTotal = ligne.emissionTotal || ligne.total || 0;
              // RESTE A EMETTRE = 0, sa valeur va dans RESTE A RECOUVRER
              const resteAEmettre = 0;
              const resteARecouvrer = (ligne.prevision || 0) - (ligne.total || 0);

              row.innerHTML = `
                <td class="col-code">${ligne.code}</td>
                <td class="col-libelle">${ligne.libelle}</td>
                <td class="col-num">${formatNumber(ligne.prevision)}</td>
                <td class="col-num">${formatNumber(emissionAnt)}</td>
                <td class="col-num">${formatNumber(emissionMois)}</td>
                <td class="col-num">${formatNumber(emissionTotal)}</td>
                <td class="col-num">${formatNumber(resteAEmettre)}</td>
                <td class="col-num">${formatNumber(ligne.antecedent)}</td>
                <td class="col-num">${formatNumber(ligne.recetteMois)}</td>
                <td class="col-num">${formatNumber(ligne.total)}</td>
                <td class="col-num">${formatNumber(resteARecouvrer)}</td>
                <td class="col-percent">${percent}</td>
              `;
              rows.push(row);
            }

            // Sous-total du chapitre
            const chapTotalRow = document.createElement('tr');
            chapTotalRow.className = 'sous-total';
            const chapPercent = calculatePercent(chapitre.totaux.total, chapitre.totaux.prevision);
            // RESTE A EMETTRE = 0, sa valeur va dans RESTE A RECOUVRER
            const chapResteAEmettre = 0;
            const chapResteARecouvrer = chapitre.totaux.prevision - chapitre.totaux.total;
            chapTotalRow.innerHTML = `
              <td>S/T ${chapitre.code}</td>
              <td>SOUS TOTAL CHAP. ${chapitre.code}</td>
              <td class="col-num">${formatNumber(chapitre.totaux.prevision)}</td>
              <td class="col-num">${formatNumber(chapitre.totaux.emissionAnt)}</td>
              <td class="col-num">${formatNumber(chapitre.totaux.emissionMois)}</td>
              <td class="col-num">${formatNumber(chapitre.totaux.emissionTotal)}</td>
              <td class="col-num">${formatNumber(chapResteAEmettre)}</td>
              <td class="col-num">${formatNumber(chapitre.totaux.antecedent)}</td>
              <td class="col-num">${formatNumber(chapitre.totaux.recetteMois)}</td>
              <td class="col-num">${formatNumber(chapitre.totaux.total)}</td>
              <td class="col-num">${formatNumber(chapResteARecouvrer)}</td>
              <td class="col-percent">${chapPercent}</td>
            `;
            rows.push(chapTotalRow);
          }

          // Arrêté de compte de la section
          const sectionTotalRow = document.createElement('tr');
          sectionTotalRow.className = 'total-section';
          const sectionPercent = calculatePercent(section.totaux.total, section.totaux.prevision);
          // RESTE A EMETTRE = 0, sa valeur va dans RESTE A RECOUVRER
          const sectionResteAEmettre = 0;
          const sectionResteARecouvrer = section.totaux.prevision - section.totaux.total;
          sectionTotalRow.innerHTML = `
            <td>S/${section.code}</td>
            <td>ARRÊTÉ DE COMPTE SECTION ${section.code}</td>
            <td class="col-num">${formatNumber(section.totaux.prevision)}</td>
            <td class="col-num">${formatNumber(section.totaux.emissionAnt)}</td>
            <td class="col-num">${formatNumber(section.totaux.emissionMois)}</td>
            <td class="col-num">${formatNumber(section.totaux.emissionTotal)}</td>
            <td class="col-num">${formatNumber(sectionResteAEmettre)}</td>
            <td class="col-num">${formatNumber(section.totaux.antecedent)}</td>
            <td class="col-num">${formatNumber(section.totaux.recetteMois)}</td>
            <td class="col-num">${formatNumber(section.totaux.total)}</td>
            <td class="col-num">${formatNumber(sectionResteARecouvrer)}</td>
            <td class="col-percent">${sectionPercent}</td>
          `;
          rows.push(sectionTotalRow);
        }

        // Total général
        const totalRow = document.createElement('tr');
        totalRow.className = 'total-section';
        const totalPercent = calculatePercent(data.totaux.total, data.totaux.prevision);
        // RESTE A EMETTRE = 0, sa valeur va dans RESTE A RECOUVRER
        const totalResteAEmettre = 0;
        const totalResteARecouvrer = data.totaux.prevision - data.totaux.total;
        totalRow.innerHTML = `
          <td>TOTAL</td>
          <td>TOTAL GÉNÉRAL DES RECETTES TITRE II</td>
          <td class="col-num">${formatNumber(data.totaux.prevision)}</td>
          <td class="col-num">${formatNumber(data.totaux.emissionAnt || data.totaux.antecedent)}</td>
          <td class="col-num">${formatNumber(data.totaux.emissionMois || data.totaux.recetteMois)}</td>
          <td class="col-num">${formatNumber(data.totaux.emissionTotal || data.totaux.total)}</td>
          <td class="col-num">${formatNumber(totalResteAEmettre)}</td>
          <td class="col-num">${formatNumber(data.totaux.antecedent)}</td>
          <td class="col-num">${formatNumber(data.totaux.recetteMois)}</td>
          <td class="col-num">${formatNumber(data.totaux.total)}</td>
          <td class="col-num">${formatNumber(totalResteARecouvrer)}</td>
          <td class="col-percent">${totalPercent}</td>
        `;
        rows.push(totalRow);

        return rows;
      }

      // Global state
      let currentData = null;
      let generatedRows = [];
      let currentPageStart = 1;

      // Fonction principale appelée quand les données arrivent
      function processEtatData(messageData) {
        if (messageData && messageData.type === 'FILL_ETAT_RECETTE_DATA') {
          currentData = messageData.data;

          // Initialiser le numéro de page par défaut à 1 si l'input est vide
          const input = document.getElementById('inputNumero');
          if (!input.value) {
            input.value = '1';
          }

          currentPageStart = parseInt(input.value, 10) || 1;

          // Générer les lignes (une seule fois)
          generatedRows = generateRowsFromData(currentData);

          // Rendre les pages
          renderPages();

          // Titre du document
          document.title = `État Mensuel des Recettes Investissement - ${currentData.moisNom} ${currentData.annee}`;
        }
      }

      function rerenderWithPageNumber(val) {
        currentPageStart = parseInt(val, 10) || 1;
        if (currentData && generatedRows.length > 0) {
          renderPages();
        }
      }

      function renderPages() {
        const content = document.getElementById('content');
        content.innerHTML = '';

        const ROWS_PER_PAGE = 30;
        let currentRowIndex = 0;
        let pageIndex = 0;

        while (currentRowIndex < generatedRows.length) {
          const pageNum = currentPageStart + pageIndex;
          pageIndex++;

          const pageDiv = document.createElement('div');
          pageDiv.className = 'print-page';
          pageDiv.style.position = 'relative';
          pageDiv.style.pageBreakAfter = 'always';
          pageDiv.style.minHeight = '180mm';

          const table = document.createElement('table');
          const tableHeaderTpl = document.getElementById('tableHeaderTemplate');
          const theadClone = tableHeaderTpl.content.cloneNode(true);
          fillHeader(theadClone, currentData, pageNum);
          table.appendChild(theadClone);

          const tbody = document.createElement('tbody');
          const rowsForThisPage = generatedRows.slice(
            currentRowIndex,
            currentRowIndex + ROWS_PER_PAGE,
          );

          rowsForThisPage.forEach((row) => tbody.appendChild(row.cloneNode(true)));
          table.appendChild(tbody);
          pageDiv.appendChild(table);

          currentRowIndex += ROWS_PER_PAGE;

          if (currentRowIndex >= generatedRows.length) {
            const footerTpl = document.getElementById('footerTemplate');
            const footerNode = footerTpl.content.cloneNode(true);
            fillFooter(footerNode, currentData);
            pageDiv.appendChild(footerNode);
          }

          content.appendChild(pageDiv);
        }
      }

      function fillHeader(node, data, pageNum) {
        const setText = (cls, val) => {
          const el = node.querySelector('.' + cls);
          if (el) el.textContent = val;
        };

        setText('tpl-annee', data.annee);
        setText('tpl-moisNom', (data.moisNom || '').toUpperCase());
        setText('tpl-numeroPage', String(pageNum).padStart(2, '0'));

        if (data.mairie) {
          setText(
            'tpl-departement',
            'DÉPARTEMENT DE ' + (data.mairie.departement || '').toUpperCase(),
          );
          setText(
            'tpl-commune',
            'COMMUNE DE ' + (data.mairie.nom || '').replace(/^mairie de /i, '').toUpperCase(),
          );
          setText('tpl-codeCommune', data.mairie.code || '---');
        }
      }

      function fillFooter(node, data) {
        const setText = (cls, val) => {
          const el = node.querySelector('.' + cls);
          if (el) el.textContent = val;
        };

        const montantLettres = NumberToLettres(data.totaux.total).toUpperCase();
        setText(
          'tpl-footerText',
          `Arrêté le présent état à la somme de : ${montantLettres} FRANCS CFA.`,
        );

        if (data.mairie) {
          setText('tpl-lieuSignature', data.mairie.nom || '---');
        }

        const today = new Date();
        const dateOptions = { day: 'numeric', month: 'long', year: 'numeric' };
        setText('tpl-dateSignature', today.toLocaleDateString('fr-FR', dateOptions));
      }

      // Variable pour éviter de traiter les données plusieurs fois
      var dataProcessed = false;

      // Variable pour stocker les données reçues avant que le DOM soit prêt
      let pendingData = null;

      // Écouter les messages de l'application Vue via postMessage
      window.addEventListener('message', function (event) {
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          processEtatData(event.data);
        } else {
          pendingData = event.data;
        }
      });

      // Fallback: Vérifier IndexedDB pour Electron
      window.addEventListener('DOMContentLoaded', async function () {
        console.log('[RecetteInvestissement] DOMContentLoaded fired');

        if (pendingData && !dataProcessed) {
          console.log('[RecetteInvestissement] Processing pending data from postMessage');
          processEtatData(pendingData);
          return;
        }

        await new Promise((resolve) => setTimeout(resolve, 500));

        if (!dataProcessed) {
          try {
            var db = new Dexie('TresorDatabase');
            db.version(24).stores({
              printData: '++id, type, createdAt',
            });

            var printDataRecords = await db
              .table('printData')
              .where('type')
              .equals('FILL_ETAT_RECETTE_DATA')
              .toArray();

            if (printDataRecords.length > 0) {
              var latestRecord = printDataRecords.sort(function (a, b) {
                return new Date(b.createdAt) - new Date(a.createdAt);
              })[0];

              console.log('[RecetteInvestissement] Data loaded from IndexedDB:', latestRecord);
              processEtatData(latestRecord.data);
              await db.table('printData').delete(latestRecord.id);
            }
          } catch (e) {
            console.warn('Erreur lors de la lecture de IndexedDB:', e);
          }
        }
      });

      // Fonction de conversion nombre en lettres
      function NumberToLettres(nombre) {
        if (nombre === 0) return 'zéro';

        const unites = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf'];
        const dizaines = [
          '',
          '',
          'vingt',
          'trente',
          'quarante',
          'cinquante',
          'soixante',
          'soixante',
          'quatre-vingt',
          'quatre-vingt',
        ];
        const dizainesSpeciales = [
          'dix',
          'onze',
          'douze',
          'treize',
          'quatorze',
          'quinze',
          'seize',
          'dix-sept',
          'dix-huit',
          'dix-neuf',
        ];

        function convertirMoinsDeMillions(n) {
          if (n === 0) return '';
          if (n < 10) return unites[n];
          if (n < 20) return dizainesSpeciales[n - 10];
          if (n < 100) {
            const d = Math.floor(n / 10);
            const u = n % 10;
            if (d === 7 || d === 9) {
              return dizaines[d] + (u === 0 ? (d === 9 ? 's' : '') : '-' + dizainesSpeciales[u]);
            }
            return (
              dizaines[d] +
              (u === 0 ? (d === 8 ? 's' : '') : u === 1 && d < 8 ? ' et un' : '-' + unites[u])
            );
          }
          if (n < 1000) {
            const c = Math.floor(n / 100);
            const r = n % 100;
            return (
              (c === 1 ? 'cent' : unites[c] + ' cent') +
              (r === 0 ? (c > 1 ? 's' : '') : ' ' + convertirMoinsDeMillions(r))
            );
          }
          if (n < 1000000) {
            const m = Math.floor(n / 1000);
            const r = n % 1000;
            return (
              (m === 1 ? 'mille' : convertirMoinsDeMillions(m) + ' mille') +
              (r === 0 ? '' : ' ' + convertirMoinsDeMillions(r))
            );
          }
          const millions = Math.floor(n / 1000000);
          const reste = n % 1000000;
          return (
            (millions === 1 ? 'un million' : convertirMoinsDeMillions(millions) + ' millions') +
            (reste === 0 ? '' : ' ' + convertirMoinsDeMillions(reste))
          );
        }

        function convertir(n) {
          if (n >= 1000000000) {
            const milliards = Math.floor(n / 1000000000);
            const reste = n % 1000000000;
            return (
              (milliards === 1
                ? 'un milliard'
                : convertirMoinsDeMillions(milliards) + ' milliards') +
              (reste === 0 ? '' : ' ' + convertir(reste))
            );
          }
          return convertirMoinsDeMillions(n);
        }

        return convertir(Math.floor(nombre));
      }
    </script>
