<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>État des Décomptes</title>
    <script src="../tailwindcss.js"></script>
    <script src="../constanteInfo.js"></script>
    <script>
      document.title = 'État des Décomptes - Mairie de ' + MAIRIE_INFO.ville;
    </script>
    <script src="../dexie.min.js"></script>
    <style>
      body {
        font-family: 'Times New Roman', Times, serif;
        background-color: #e5e7eb;
        color: #111;
      }
      .print-btn {
        position: fixed;
        top: 10px;
        right: 10px;
        background: #1976d2;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        z-index: 999;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }
      .print-btn:hover {
        background: #1565c0;
      }
      .print-page {
        width: 297mm;
        min-height: 210mm;
        background: #fff;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        margin: 20px auto;
        padding: 0.8cm 1.2cm;
        position: relative;
        page-break-after: always;
      }
      .print-page:last-child {
        page-break-after: auto;
      }
      .page-number {
        position: absolute;
        bottom: 6mm;
        right: 10mm;
        font-size: 9px;
        color: #999;
      }
      table.data-table {
        border-collapse: collapse;
        width: 100%;
        font-size: 11px;
        margin-top: 10px;
      }
      table.data-table th,
      table.data-table td {
        border: 1px solid black;
        padding: 4px 6px;
        text-align: center;
      }
      table.data-table th {
        font-weight: bold;
        vertical-align: middle;
      }
      .text-left-col {
        text-align: left !important;
      }
      .text-right-col {
        text-align: right !important;
      }
      tr.report-row td {
        background: #fef3c7 !important;
        font-weight: bold;
        font-style: italic;
      }
      tr.total-row td {
        background: #dbeafe !important;
        font-weight: bold;
      }
      .editable-date {
        cursor: pointer;
        border-bottom: 1px dashed #999;
        padding: 0 2px;
        min-width: 80px;
        display: inline-block;
      }
      .editable-date:hover {
        background: #e8f0fe;
      }
      .editable-date:focus {
        outline: 2px solid #1976d2;
        background: #fff;
        border-bottom: none;
      }
      @media print {
        @page {
          size: A4 landscape;
          margin: 0;
        }
        body {
          background: white;
          padding: 0;
          margin: 0;
        }
        .print-btn {
          display: none !important;
        }
        .editable-date {
          border-bottom: none;
        }
        .print-page {
          box-shadow: none;
          margin: 0;
          width: 100%;
          min-height: 100vh;
          padding: 6mm 8mm;
        }
      }
    </style>
  </head>
  <body>
    <button class="print-btn" onclick="window.print()">Imprimer</button>
    <div id="content">
      <div
        class="print-page"
        style="display: flex; align-items: center; justify-content: center; color: #888"
      >
        Chargement...
      </div>
    </div>
    <script>
      const MOIS_LABELS = [
        'Janvier',
        'Février',
        'Mars',
        'Avril',
        'Mai',
        'Juin',
        'Juillet',
        'Août',
        'Septembre',
        'Octobre',
        'Novembre',
        'Décembre',
      ];
      const ROWS_PER_PAGE = 10;
      function fmt(n) {
        return Number(n || 0).toLocaleString('fr-FR');
      }
      function numberToWords(num) {
        // Conversion en toutes lettres (français). Implémentation unique et vérifiée.
        var __n = Math.floor(Math.abs(Number(num) || 0));
        var __neg = (Number(num) || 0) < 0;
        var U = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf'];
        var T = ['dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
        var D = ['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
        var SEP = " ";
        function sub100(n) {
          if (n < 10) return U[n];
          if (n < 20) return T[n - 10];
          var d = Math.floor(n / 10), u = n % 10;
          if (d === 7 || d === 9) {
            var r = n - (d === 7 ? 60 : 80); // 10..19
            // 71 = "soixante et onze" ; 91 = "quatre-vingt-onze" (sans "et")
            return D[d] + (d === 7 && r === 11 ? '-et-' : '-') + T[r - 10];
          }
          if (u === 0) return D[d] + (d === 8 ? 's' : ''); // quatre-vingts
          if (u === 1 && d < 8) return D[d] + '-et-un';    // vingt-et-un ... soixante-et-un
          return D[d] + '-' + U[u];
        }
        function sub1000(n) {
          if (n < 100) return sub100(n);
          var c = Math.floor(n / 100), r = n % 100;
          var s = (c === 1 ? 'cent' : U[c] + '-cent');
          if (r === 0) { if (c > 1) s += 's'; } else { s += '-' + sub100(r); }
          return s;
        }
        // "vingt" et "cent" sont invariables devant "mille"
        function invariable(s) { return s.replace(/(vingt|cent)s$/, '$1'); }
        function convert(n) {
          if (n === 0) return '';
          if (n >= 1e9) {
            var qb = Math.floor(n / 1e9), rb = n % 1e9;
            var sb = (qb === 1 ? 'un' + SEP + 'milliard' : convert(qb) + SEP + 'milliards');
            return rb ? sb + SEP + convert(rb) : sb;
          }
          if (n >= 1e6) {
            var qm = Math.floor(n / 1e6), rm = n % 1e6;
            var sm = (qm === 1 ? 'un' + SEP + 'million' : convert(qm) + SEP + 'millions');
            return rm ? sm + SEP + convert(rm) : sm;
          }
          if (n >= 1000) {
            var qk = Math.floor(n / 1000), rk = n % 1000;
            var sk = (qk === 1 ? 'mille' : invariable(sub1000(qk)) + SEP + 'mille');
            return rk ? sk + SEP + sub1000(rk) : sk;
          }
          return sub1000(n);
        }
        var __r = (__n === 0 ? 'zéro' : convert(__n));
        if (__neg) __r = 'moins ' + __r;
        __r = __r + " FRANCS CFA";
        return __r.toUpperCase();
      }
      function buildHeader(annee, periodeText, chapitre, compte) {
        return `<div class="flex justify-between items-start text-sm">
            <div class="leading-tight font-bold text-center"><p>DÉPARTEMENT DE ${MAIRIE_INFO.departement.toUpperCase()}</p><div class="w-10 h-[1px] bg-black mx-auto my-1"></div><p>COMMUNE DE ${MAIRIE_INFO.ville.toUpperCase()}</p><p>Code: ${MAIRIE_INFO.code}</p></div>
            <div class="text-center leading-tight font-bold"><p>RÉPUBLIQUE DE COTE D'IVOIRE</p><p class="italic font-normal">Union – Discipline – Travail</p></div>
          </div>
          <div class="text-center mt-3">
            <h1 class="font-bold text-base tracking-wide">ÉTAT DES DÉCOMPTES DE LA PART PATRONALE</h1>
            <h2 class="font-bold text-sm">BUDGET COMMUNAL</h2>
            <p class="font-bold text-xs">EXERCICE: ${annee} &nbsp;&nbsp; CHAPITRE: ${chapitre || '600'} &nbsp;&nbsp; ARTICLE: ${compte || '6002'} &nbsp;&nbsp; PARAGRAPHE: ${compte || '6002'}/2</p>
            <p class="text-xs">État nominatif pour servir au paiement de la somme acquise par :</p>
            <p class="text-xs font-bold">${periodeText}</p>
          </div>`;
      }
      function buildTableHead(TAUX_PF, TAUX_AT, TAUX_RG, TAUX_TOTAL) {
        return `<thead>
          <tr><th rowspan="2" style="width:5%">N°</th><th rowspan="2" style="width:25%">NOM ET PRÉNOMS</th><th rowspan="2" style="width:14%">Salaires Brut<br/>soumis à cotisation</th><th colspan="3">DIFFÉRENTS TAUX DE PRÉLÈVEMENT</th><th rowspan="2" style="width:14%" class="font-bold">Total cotisation<br/>à reverser<br/>${TAUX_TOTAL.toLocaleString('fr-FR')}%</th></tr>
          <tr><th style="width:14%;padding:0"><div class="font-bold" style="border-bottom:1px solid black;padding:2px">Prestation familiale<br/>${(TAUX_PF * 100).toLocaleString('fr-FR')}%</div><div style="padding:2px">Plafond imposable<br/>70 000 F CFA</div></th><th style="width:14%;padding:0"><div class="font-bold" style="border-bottom:1px solid black;padding:2px">Accident de travail<br/>${(TAUX_AT * 100).toLocaleString('fr-FR')}%</div><div style="padding:2px">Plafond imposable<br/>70 000 F CFA</div></th><th style="width:14%;padding:0"><div class="font-bold" style="border-bottom:1px solid black;padding:2px">Régime général de<br/>retraite ${(TAUX_RG * 100).toLocaleString('fr-FR')}%</div><div style="padding:2px">Salaire brut<br/>imposable</div></th></tr>
        </thead>`;
      }

      document.addEventListener('DOMContentLoaded', async () => {
        let db;
        try {
          db = new Dexie('TresorOfflineDB');
          await db.open();
        } catch (_e) {
          db = new Dexie('TresorDatabase');
          await db.open();
        }

        const p = new URLSearchParams(window.location.search);
        const mois = parseInt(p.get('mois') || String(new Date().getMonth() + 1), 10);
        const annee = parseInt(p.get('annee') || String(new Date().getFullYear()), 10);
        const premierJour = `01/${String(mois).padStart(2, '0')}/${annee}`;
        const dernierJour = `${new Date(annee, mois, 0).getDate()}/${String(mois).padStart(2, '0')}/${annee}`;
        const periodeText = `Les Agents de l'État Civil et population du ${premierJour} au ${dernierJour}`;
        const dateSig = `À ${MAIRIE_INFO.ville}, le ${new Date().toLocaleDateString('fr-FR')}`;
        const compteParam = p.get('compte') || '';
        const chapitreParam = p.get('chapitre') || '';

        let fiches = await db
          .table('fichesPaie')
          .filter((f) => f.mois === mois && f.annee === annee && f.statut !== 'brouillon')
          .toArray();
        const sf = p.get('service'),
          tf = p.get('typeEmploye');
        if (sf || tf) {
          const fl = [];
          for (const f of fiches) {
            const e = await db.table('employes').get(f.employeId);
            if (e) {
              if (sf && e.service !== sf) continue;
              if (tf && !e.typeEmploye?.startsWith(tf)) continue;
              fl.push(f);
            }
          }
          fiches = fl;
        }

        if (!fiches.length) {
          document.getElementById('content').innerHTML =
            `<div class="print-page"><p style="padding:40px;text-align:center;color:#888">Aucun bulletin pour cette période</p></div>`;
          return;
        }

        const paramsDb = await db.table('parametresPaie').toCollection().first();
        const TAUX_PF = paramsDb ? paramsDb.tauxCnpsPatronalPrestationFamiliale / 100 : 0.0575;
        const TAUX_AT = paramsDb ? paramsDb.tauxCnpsPatronalAccidentTravail / 100 : 0.02;
        const TAUX_RG = paramsDb ? paramsDb.tauxCnpsPatronalRetraite / 100 : 0.077;
        const TAUX_TOTAL = (TAUX_PF + TAUX_AT + TAUX_RG) * 100;
        const PLAFOND_PF_AT = 70000;

        const data = await Promise.all(
          fiches.map(async (f, i) => {
            const emp = await db.table('employes').get(f.employeId);
            const nom = emp ? `${emp.nom} ${emp.prenom}` : `Agent #${f.employeId}`;
            const base = f.salaireBase || 0;
            const log = f.indemniteLogement || 0;
            const brut = base + log;
            const basePfAt = Math.min(brut, PLAFOND_PF_AT);
            const pf = Math.round(basePfAt * TAUX_PF),
              at = Math.round(basePfAt * TAUX_AT),
              rg = Math.round(brut * TAUX_RG);
            return { idx: i + 1, nom, brut, pf, at, rg, total: pf + at + rg };
          }),
        );

        const pages = [];
        for (let i = 0; i < data.length; i += ROWS_PER_PAGE)
          pages.push(data.slice(i, i + ROWS_PER_PAGE));
        const totalPages = pages.length;
        let cBrut = 0,
          cPf = 0,
          cAt = 0,
          cRg = 0,
          cTotal = 0;
        let html = '';

        pages.forEach((pageData, idx) => {
          const isLast = idx === totalPages - 1;
          const rBrut = cBrut,
            rPf = cPf,
            rAt = cAt,
            rRg = cRg,
            rTotal = cTotal;

          pageData.forEach((d) => {
            cBrut += d.brut;
            cPf += d.pf;
            cAt += d.at;
            cRg += d.rg;
            cTotal += d.total;
          });

          const reportRow =
            idx > 0
              ? `<tr class="report-row"><td colspan="2" class="text-left-col" style="padding-left:12px">REPORT</td><td>${fmt(rBrut)}</td><td>${fmt(rPf)}</td><td>${fmt(rAt)}</td><td>${fmt(rRg)}</td><td>${fmt(rTotal)}</td></tr>`
              : '';
          const dataRows = pageData
            .map(
              (d) =>
                `<tr><td>${String(d.idx).padStart(2, '0')}</td><td class="text-left-col font-semibold">${d.nom}</td><td>${fmt(d.brut)}</td><td>${fmt(d.pf)}</td><td>${fmt(d.at)}</td><td>${fmt(d.rg)}</td><td class="font-bold">${fmt(d.total)}</td></tr>`,
            )
            .join('');
          const totalRow = `<tr class="total-row"><td colspan="2" class="text-left-col" style="padding-left:12px"><strong>${isLast ? 'TOTAL GÉNÉRAL' : 'TOTAL'}</strong></td><td><strong>${fmt(cBrut)}</strong></td><td><strong>${fmt(cPf)}</strong></td><td><strong>${fmt(cAt)}</strong></td><td><strong>${fmt(cRg)}</strong></td><td><strong>${fmt(cTotal)}</strong></td></tr>`;

          html += `<div class="print-page">
            ${buildHeader(annee, periodeText, chapitreParam, compteParam)}
            <table class="data-table">${buildTableHead(TAUX_PF, TAUX_AT, TAUX_RG, TAUX_TOTAL)}<tbody>${reportRow}${dataRows}${totalRow}</tbody></table>
            <div class="flex justify-between items-start text-sm mt-4">
              <div style="width:70%"><p>Arrêté le présent état à la somme de : <span class="font-bold underline uppercase" contenteditable="true">${numberToWords(cTotal)}</span></p><p class="mt-1">Payé et enregistré sous le n°07/${annee}</p><p>Pour acquis global</p><p class="font-bold underline mt-3" contenteditable="true">Chef des Services Financiers</p></div>
              <div class="text-center" style="width:30%"><p class="font-bold underline">Certifié le service fait</p><p class="font-bold underline">Vu, vérifié et liquidé</p><p class="mt-2">À ${MAIRIE_INFO.ville}, le <span class="editable-date" contenteditable="true">${new Date().toLocaleDateString('fr-FR')}</span></p><p class="font-bold underline mt-1" contenteditable="true">P/Le Maire & P.D.</p></div>
            </div>
            <div class="page-number">Page ${idx + 1}/${totalPages}</div>
          </div>`;
        });

        document.getElementById('content').innerHTML = html;
        setTimeout(() => {
          if (p.get('print') === 'true') window.print();
        }, 500);
      });
    </script>
  </body>
</html>
