<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>État de Paiement ITS</title>
    <script src="../tailwindcss.js"></script>
    <script src="../constanteInfo.js"></script>
    <script>
      document.title = 'État de Paiement ITS - ' + MAIRIE_INFO.ville;
    </script>
    <script src="../dexie.min.js"></script>
    <style>
      body {
        font-family: 'Times New Roman', Times, serif;
      }
      .print-btn {
        position: fixed;
        top: 10px;
        right: 10px;
        background: #1976d2;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        z-index: 999;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }
      .print-btn:hover {
        background: #1565c0;
      }
      .print-page {
        width: 297mm;
        min-height: 210mm;
        background: #fff;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.12);
        margin: 20px auto;
        padding: 1cm 1.2cm;
        position: relative;
        page-break-after: always;
      }
      .print-page:last-child {
        page-break-after: auto;
      }
      .page-number {
        position: absolute;
        bottom: 8mm;
        right: 10mm;
        font-size: 9px;
        color: #999;
      }
      table.data-table {
        border-collapse: collapse;
        width: 100%;
      }
      table.data-table th,
      table.data-table td {
        border: 1px solid #000;
        padding: 3px 5px;
        font-size: 11px;
      }
      table.data-table th {
        text-align: center;
        font-weight: bold;
      }
      tr.report-row td {
        background: #fef3c7 !important;
        font-weight: bold;
        font-style: italic;
      }
      tr.total-row td {
        background: #dbeafe !important;
        font-weight: bold;
      }
      .editable-date {
        cursor: pointer;
        border-bottom: 1px dashed #999;
        padding: 0 2px;
        min-width: 80px;
        display: inline-block;
      }
      .editable-date:hover {
        background: #e8f0fe;
      }
      .editable-date:focus {
        outline: 2px solid #1976d2;
        background: #fff;
        border-bottom: none;
      }
      @media print {
        @page {
          size: A4 landscape;
          margin: 0;
        }
        body {
          background: white;
          padding: 0;
          margin: 0;
        }
        .print-btn {
          display: none !important;
        }
        .editable-date {
          border-bottom: none;
        }
        .print-page {
          box-shadow: none;
          margin: 0;
          width: 100%;
          min-height: 100vh;
          padding: 8mm 10mm;
        }
      }
    </style>
  </head>
  <body class="bg-gray-200">
    <button class="print-btn" onclick="window.print()">Imprimer</button>
    <div id="content">
      <div
        class="print-page"
        style="display: flex; align-items: center; justify-content: center; color: #888"
      >
        Chargement...
      </div>
    </div>
    <script>
      const MOIS_LABELS = [
        'Janvier',
        'Février',
        'Mars',
        'Avril',
        'Mai',
        'Juin',
        'Juillet',
        'Août',
        'Septembre',
        'Octobre',
        'Novembre',
        'Décembre',
      ];
      const ROWS_PER_PAGE = 10;
      function fmt(n) {
        return Number(n || 0).toLocaleString('fr-FR');
      }
      function numberToWords(num) {
        // Conversion en toutes lettres (français). Implémentation unique et vérifiée.
        var __n = Math.floor(Math.abs(Number(num) || 0));
        var __neg = (Number(num) || 0) < 0;
        var U = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf'];
        var T = ['dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
        var D = ['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
        var SEP = " ";
        function sub100(n) {
          if (n < 10) return U[n];
          if (n < 20) return T[n - 10];
          var d = Math.floor(n / 10), u = n % 10;
          if (d === 7 || d === 9) {
            var r = n - (d === 7 ? 60 : 80); // 10..19
            // 71 = "soixante et onze" ; 91 = "quatre-vingt-onze" (sans "et")
            return D[d] + (d === 7 && r === 11 ? '-et-' : '-') + T[r - 10];
          }
          if (u === 0) return D[d] + (d === 8 ? 's' : ''); // quatre-vingts
          if (u === 1 && d < 8) return D[d] + '-et-un';    // vingt-et-un ... soixante-et-un
          return D[d] + '-' + U[u];
        }
        function sub1000(n) {
          if (n < 100) return sub100(n);
          var c = Math.floor(n / 100), r = n % 100;
          var s = (c === 1 ? 'cent' : U[c] + '-cent');
          if (r === 0) { if (c > 1) s += 's'; } else { s += '-' + sub100(r); }
          return s;
        }
        // "vingt" et "cent" sont invariables devant "mille"
        function invariable(s) { return s.replace(/(vingt|cent)s$/, '$1'); }
        function convert(n) {
          if (n === 0) return '';
          if (n >= 1e9) {
            var qb = Math.floor(n / 1e9), rb = n % 1e9;
            var sb = (qb === 1 ? 'un' + SEP + 'milliard' : convert(qb) + SEP + 'milliards');
            return rb ? sb + SEP + convert(rb) : sb;
          }
          if (n >= 1e6) {
            var qm = Math.floor(n / 1e6), rm = n % 1e6;
            var sm = (qm === 1 ? 'un' + SEP + 'million' : convert(qm) + SEP + 'millions');
            return rm ? sm + SEP + convert(rm) : sm;
          }
          if (n >= 1000) {
            var qk = Math.floor(n / 1000), rk = n % 1000;
            var sk = (qk === 1 ? 'mille' : invariable(sub1000(qk)) + SEP + 'mille');
            return rk ? sk + SEP + sub1000(rk) : sk;
          }
          return sub1000(n);
        }
        var __r = (__n === 0 ? 'zéro' : convert(__n));
        if (__neg) __r = 'moins ' + __r;
        __r = __r + " FRANCS CFA";
        return __r.toUpperCase();
      }
      function buildHeader(moisLabel, annee, chapitre, compte) {
        return `<div class="flex justify-between items-start mb-4 text-[13px] font-bold">
            <div class="text-left leading-snug"><p>DEPARTEMENT DE ${MAIRIE_INFO.departement.toUpperCase()}</p><p>COMMUNE DE ${MAIRIE_INFO.ville.toUpperCase()}</p><p>CODE: ${MAIRIE_INFO.code}</p></div>
            <div class="text-center leading-snug"><p>REPUBLIQUE DE COTE D'IVOIRE</p><p class="font-normal italic text-sm mt-1">Union – Discipline – Travail</p><div class="w-16 h-[1.5px] bg-black mx-auto mt-1"></div></div>
          </div>
          <h1 class="text-center font-bold text-xl mb-4">ETAT DE PAIEMENT DE L'IMPOT SUR SALAIRE (ITS)</h1>
          <div class="mb-4 font-bold text-[13px]"><p>PERIODE: ${moisLabel} ${annee}</p>${chapitre ? `<p>CHAPITRE: ${chapitre}</p>` : ''}<p>IMPUTATION BUDGETAIRE: ${compte || '6002'}/1</p></div>`;
      }
      function buildTableHead(tIts) {
        return `<thead><tr class="text-center font-bold">
          <th class="p-1" style="width:4%">N°</th><th class="p-1 text-left" style="width:26%">NOM ET PRENOMS</th>
          <th class="p-1" style="width:7%">NBRE DE<br/>MOIS</th><th class="p-1" style="width:16%">SALAIRE DE<br/>BASE</th>
          <th class="p-1" style="width:16%">INDEMNITE<br/>DE RESIDENCE</th><th class="p-1" style="width:16%">IMPOSABLE<br/>SALAIRE BRUT</th>
          <th class="p-1" style="width:15%">${tIts.toLocaleString('fr-FR')}%<br/>ITS</th></tr></thead>`;
      }

      document.addEventListener('DOMContentLoaded', async () => {
        let db;
        try {
          db = new Dexie('TresorOfflineDB');
          await db.open();
        } catch (_e) {
          db = new Dexie('TresorDatabase');
          await db.open();
        }

        const p = new URLSearchParams(window.location.search);
        const mois = parseInt(p.get('mois') || String(new Date().getMonth() + 1), 10);
        const annee = parseInt(p.get('annee') || String(new Date().getFullYear()), 10);
        const moisLabel = MOIS_LABELS[mois - 1] || '';
        const dateSig = new Date()
          .toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' })
          .toUpperCase();
        const compteParam = p.get('compte') || '';
        const chapitreParam = p.get('chapitre') || '';
        const paramsDb = await db.table('parametresPaie').toCollection().first();
        const tIts = paramsDb ? paramsDb.tauxIts : 1.6;

        let fiches = await db
          .table('fichesPaie')
          .filter((f) => f.mois === mois && f.annee === annee && f.statut !== 'brouillon')
          .toArray();
        const sf = p.get('service'),
          tf = p.get('typeEmploye');
        if (sf || tf) {
          const fl = [];
          for (const f of fiches) {
            const e = await db.table('employes').get(f.employeId);
            if (e) {
              if (sf && e.service !== sf) continue;
              if (tf && !e.typeEmploye?.startsWith(tf)) continue;
              fl.push(f);
            }
          }
          fiches = fl;
        }

        if (!fiches.length) {
          document.getElementById('content').innerHTML =
            `<div class="print-page"><p style="padding:40px;text-align:center;color:#888">Aucun bulletin pour ${moisLabel} ${annee}</p></div>`;
          return;
        }

        // Build data with running totals
        const data = await Promise.all(
          fiches.map(async (f, i) => {
            const emp = await db.table('employes').get(f.employeId);
            // Brut imposable = base + logement (= montantBrut)
            return {
              idx: i + 1,
              nom: emp ? `${emp.nom} ${emp.prenom}` : `Agent #${f.employeId}`,
              base: f.salaireBase || 0,
              log: f.indemniteLogement || 0,
              brut: f.montantBrut || 0,
              its: f.impotSurSalaire || 0,
            };
          }),
        );

        const pages = [];
        for (let i = 0; i < data.length; i += ROWS_PER_PAGE)
          pages.push(data.slice(i, i + ROWS_PER_PAGE));

        const totalPages = pages.length;
        let cBase = 0,
          cLog = 0,
          cBrut = 0,
          cIts = 0;
        let html = '';

        pages.forEach((pageData, idx) => {
          const isLast = idx === totalPages - 1;
          const rBase = cBase,
            rLog = cLog,
            rBrut = cBrut,
            rIts = cIts;

          pageData.forEach((d) => {
            cBase += d.base;
            cLog += d.log;
            cBrut += d.brut;
            cIts += d.its;
          });

          const reportRow =
            idx > 0
              ? `<tr class="report-row"><td class="p-1 text-center" colspan="3">REPORT</td><td class="p-1 text-center">${fmt(rBase)}</td><td class="p-1 text-center">${fmt(rLog)}</td><td class="p-1 text-center">${fmt(rBrut)}</td><td class="p-1 text-center">${fmt(rIts)}</td></tr>`
              : '';
          const dataRows = pageData
            .map(
              (d) =>
                `<tr><td class="p-1 text-center">${d.idx}</td><td class="p-1 pl-3">${d.nom}</td><td class="p-1 text-center">1</td><td class="p-1 text-center">${fmt(d.base)}</td><td class="p-1 text-center">${fmt(d.log)}</td><td class="p-1 text-center">${fmt(d.brut)}</td><td class="p-1 text-center">${fmt(d.its)}</td></tr>`,
            )
            .join('');
          const totalRow = `<tr class="total-row"><td class="p-1 text-center" colspan="3"><strong>${isLast ? 'TOTAL GÉNÉRAL' : 'TOTAL'}</strong></td><td class="p-1 text-center"><strong>${fmt(cBase)}</strong></td><td class="p-1 text-center"><strong>${fmt(cLog)}</strong></td><td class="p-1 text-center"><strong>${fmt(cBrut)}</strong></td><td class="p-1 text-center"><strong>${fmt(cIts)}</strong></td></tr>`;

          html += `<div class="print-page">
            ${buildHeader(moisLabel, annee, chapitreParam, compteParam)}
            <table class="data-table">
              ${buildTableHead(tIts)}
              <tbody>${reportRow}${dataRows}${totalRow}</tbody>
            </table>
            <div class="mt-6 text-[13px]"><p>Arrêté le présent état à la somme de: <span class="font-bold" contenteditable="true">${numberToWords(cIts)}</span></p></div>
            <div class="flex justify-end items-end mt-8 text-[13px]"><div class="text-center mr-8"><p>${MAIRIE_INFO.ville.toUpperCase()}, le <span class="editable-date" contenteditable="true">${new Date().toLocaleDateString('fr-FR')}</span></p><p class="font-bold underline mt-2" contenteditable="true">P/Le Maire & P.D</p></div></div>
            <div class="page-number">Page ${idx + 1}/${totalPages}</div>
          </div>`;
        });

        document.getElementById('content').innerHTML = html;
      });
    </script>
  </body>
</html>
