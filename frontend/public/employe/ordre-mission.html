<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ordre de Mission - Commune de Vavoua</title>
    <!-- Vue 3 -->
    <script src="../vue.global.js"></script>
    <!-- Dexie JS -->
    <script src="../dexie.min.js"></script>
    <!-- Format date JS -->
    <script src="../dayjs.min.js"></script>
    <script src="../dayjs-locale-fr.js"></script>

    <script src="../tailwindcss.js"></script>
    <style>
      /* Fonts: use system serif fallbacks for offline support */

      body {
        font-family: 'Crimson Pro', 'Georgia', serif;
        background: #e8e4df;
      }

      .garamond {
        font-family: 'EB Garamond', serif;
      }

      .page {
        width: 210mm;
        min-height: 297mm;
        background: white;
        box-shadow:
          0 4px 24px rgba(0, 0, 0, 0.12),
          0 1px 4px rgba(0, 0, 0, 0.08);
        position: relative;
        margin-bottom: 2rem;
      }

      .seal {
        width: 90px;
        height: 90px;
        border: 3px solid #1a3a7a;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
      }

      .seal::before {
        content: '';
        width: 80px;
        height: 80px;
        border: 1.5px solid #1a3a7a;
        border-radius: 50%;
        position: absolute;
      }

      .seal-text-top {
        position: absolute;
        top: 6px;
        font-size: 7px;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #1a3a7a;
        text-transform: uppercase;
      }

      .seal-text-bottom {
        position: absolute;
        bottom: 6px;
        font-size: 7px;
        font-weight: 700;
        letter-spacing: 1.5px;
        color: #1a3a7a;
        text-transform: uppercase;
      }

      .seal-star {
        font-size: 14px;
        color: #1a3a7a;
        position: absolute;
        left: 8px;
        top: 50%;
        transform: translateY(-50%);
      }

      .stamp-box {
        border: 3px solid #1a3a7a;
        padding: 4px 12px;
        display: inline-block;
      }

      .stamp-box span {
        color: #1a3a7a;
        font-weight: 700;
      }

      .dotted-line {
        border-bottom: 1px dotted #999;
        flex: 1;
        margin: 0 4px;
      }

      .title-decoration {
        display: inline-block;
        border-top: 2px solid #111;
        border-bottom: 2px solid #111;
        padding: 6px 0;
      }

      [v-cloak] {
        display: none;
      }

      /* Editable date */
      .editable-date {
        cursor: pointer;
        border-bottom: 1px dashed #999;
        padding: 0 2px;
        min-width: 80px;
        display: inline-block;
      }
      .editable-date:hover {
        background: #e8f0fe;
      }
      .editable-date:focus {
        outline: 2px solid #1976d2;
        background: #fff;
        border-bottom: none;
      }

      @media print {
        .editable-date {
          border-bottom: none;
        }
        body {
          background: white;
        }
        .page {
          box-shadow: none !important;
          margin: 0 !important;
        }
        .page-break {
          page-break-before: always;
        }
        .print-controls {
          display: none !important;
        }
      }
    </style>
  </head>
  <body class="flex items-start justify-center min-h-screen py-5">
    <div id="app" v-cloak class="w-full flex justify-center flex-col items-center">
      <!-- print controls -->
      <div class="print-controls text-center mb-6">
        <button
          onclick="window.print()"
          class="px-6 py-2.5 text-base cursor-pointer bg-blue-600 hover:bg-blue-700 text-white border-none rounded shadow-sm transition-colors"
        >
          Imprimer l'Ordre de Mission
        </button>
        <div v-if="loading" class="mt-3 text-gray-600">Chargement des données...</div>
        <div v-if="error" class="mt-3 text-red-600 font-medium">{{ error }}</div>
      </div>

      <template v-if="data">
        <div class="page px-14 py-1 garamond text-[15px] leading-relaxed text-gray-900">
          <!-- En-tête -->
          <div class="flex justify-between items-start mb-1">
            <div class="text-center text-[13px] leading-tight">
              <p class="font-semibold tracking-wide uppercase">District Autonome du</p>
              <p class="font-semibold tracking-wide uppercase">Sassandra-Marahoué</p>
              <p class="mt-1 text-[10px] tracking-[3px] text-gray-400">
                ...............................
              </p>
            </div>
            <div class="text-center text-[13px] leading-tight">
              <p class="font-bold tracking-wide uppercase" style="font-variant: small-caps">
                République de Côte d'Ivoire
              </p>
              <p class="italic text-[13px]">Union – Discipline – Travail</p>
              <p class="mt-1 text-[10px] tracking-[3px] text-gray-400">
                ...............................
              </p>
            </div>
          </div>

          <!-- Sous-en-tête gauche -->
          <div class="text-[13px] leading-tight mt-2">
            <p class="font-semibold uppercase">Région du Haut Sassandra</p>
            <p class="text-[10px] tracking-[3px] text-gray-400">
              .................................
            </p>
            <p class="font-semibold uppercase mt-0.5">Commune de Vavoua</p>
            <p class="text-[10px] tracking-[3px] text-gray-400">
              .................................
            </p>
          </div>

          <!-- Blason / Logo placeholder -->
          <div class="mt-3 mb-1">
            <div class="w-[100px] h-[80px] flex items-center justify-center overflow-hidden">
              <img
                src="../commune-de-vavoua.png"
                alt="Logo Commune de Vavoua"
                class="max-w-full max-h-full object-contain"
                onerror="this.style.display='none'"
              />
            </div>
          </div>

          <div class="text-[13px] leading-tight mt-2">
            <p class="font-bold uppercase tracking-wide">Secrétariat Général</p>
            <p class="text-[10px] tracking-[3px] text-gray-400">--------------</p>
            <p class="font-semibold uppercase">Services Administratifs</p>
          </div>

          <p class="mt-2 text-[14px]">
            N°{{ data.exercice }}-<span class="italic">{{ data.numero }}</span> /CV/SG/SA
          </p>

          <!-- Titre -->
          <div class="text-center mt-6 mb-6">
            <h1
              class="inline-block text-[22px] font-extrabold uppercase tracking-[2px] title-decoration"
            >
              Ordre de Mission
            </h1>
          </div>

          <!-- Corps -->
          <div class="space-y-2 text-[15px]">
            <p class="font-bold uppercase">Le Maire de la Commune de Vavoua</p>

            <!-- Ligne DONNE ORDRE A -->
            <div class="flex items-baseline gap-2">
              <span class="font-bold uppercase whitespace-nowrap min-w-[200px]">Donne Ordre A</span>
              <span>: {{ agentNom }}.</span>
            </div>

            <!-- FONCTION -->
            <div class="flex items-baseline gap-2">
              <span class="font-bold uppercase whitespace-nowrap min-w-[200px]">Fonction</span>
              <span>: {{ data.agentPoste || '-' }}.</span>
            </div>

            <!-- MATRICULE -->
            <div class="flex items-baseline gap-2">
              <span class="font-bold uppercase whitespace-nowrap min-w-[200px]">Matricule</span>
              <span>: {{ data.agentMatricule || '-' }}</span>
            </div>

            <!-- DE SE RENDRE A -->
            <div class="flex items-baseline gap-2">
              <span class="font-bold uppercase whitespace-nowrap min-w-[200px]"
                >De se Rendre A</span
              >
              <span>: {{ data.destination }}.</span>
            </div>

            <!-- OBJET DE LA MISSION -->
            <div class="flex items-start gap-2 mt-2">
              <span class="font-bold uppercase whitespace-nowrap min-w-[200px]"
                >Objet de la Mission</span
              >
              <div>
                <span>: {{ data.objet }}</span>
                <p class="font-bold uppercase underline mt-2 mb-2 text-center text-[16px]">
                  {{ (data.destination || '').toUpperCase() }}
                </p>
              </div>
            </div>

            <div class="h-2"></div>

            <!-- DATE DE DEPART -->
            <div class="flex items-baseline gap-2">
              <span class="font-bold uppercase whitespace-nowrap min-w-[200px]"
                >Date de Départ</span
              >
              <span
                >:
                <span class="editable-date" contenteditable="true"
                  >{{ formatDate(data.dateDebut) }}</span
                >.</span
              >
            </div>

            <!-- DATE DE RETOUR -->
            <div class="flex items-baseline gap-2">
              <span class="font-bold italic whitespace-nowrap min-w-[200px] uppercase"
                >Date de Retour</span
              >
              <span class="italic"
                >:
                <span class="editable-date" contenteditable="true"
                  >{{ formatDate(data.dateFin) }}</span
                >.</span
              >
            </div>

            <div class="h-1"></div>

            <!-- HEBERGEMENT -->
            <div class="flex items-baseline gap-2">
              <span class="font-bold uppercase whitespace-nowrap min-w-[200px]"
                >Hébergement Assuré</span
              >
              <span>: {{ data.hebergementAssure ? 'Oui.' : 'Non.' }}</span>
            </div>

            <!-- NOURRITURE -->
            <div class="flex items-baseline gap-2">
              <span class="font-bold uppercase whitespace-nowrap min-w-[200px]">Nourriture</span>
              <span>: {{ data.nourritureAssuree ? 'Oui.' : 'Non.' }}</span>
            </div>

            <!-- MOYEN DE TRANSPORT -->
            <div class="flex items-baseline gap-2">
              <span class="font-bold uppercase whitespace-nowrap min-w-[200px]"
                >Moyen de Transport</span
              >
              <span>: {{ data.moyenTransport || 'Transport en commun de voyageurs.' }}</span>
            </div>
          </div>

          <!-- Signature -->
          <div class="mt-10 flex justify-end">
            <div class="text-center">
              <p class="font-bold text-[15px]">
                Vavoua, le <span class="editable-date" contenteditable="true">{{ todayStr }}</span>
              </p>
              <p class="font-bold text-[15px] mt-1">P/Le Maire &amp; P.D</p>
            </div>
          </div>
        </div>
      </template>
    </div>

    <script>
      dayjs.locale('fr');
      const { createApp, ref, computed, onMounted } = Vue;

      createApp({
        setup() {
          const data = ref(null);
          const loading = ref(true);
          const error = ref(null);

          const agentNom = computed(() => {
            if (!data.value) return '';
            const titre = data.value.agentSexe === 'F' ? 'Madame' : 'Monsieur';
            return `${titre} ${data.value.agentNom} ${data.value.agentPrenom}`;
          });

          const todayStr = computed(() => {
            return dayjs().format('DD MMMM YYYY');
          });

          function formatDate(date) {
            if (!date) return '';
            return dayjs(date).format('DD/MM/YYYY');
          }

          function formatAmount(amount) {
            if (amount == null) return '0 CFA';
            return new Intl.NumberFormat('fr-FR').format(amount) + ' CFA';
          }

          async function loadData() {
            loading.value = true;
            error.value = null;
            try {
              const urlParams = new URLSearchParams(window.location.search);
              const id = urlParams.get('id');

              // En environnement Electron, on peut aussi lire depuis printData
              const printId = urlParams.get('printId');

              let db;
              try {
                db = new Dexie('TresorOfflineDB');
                await db.open();
              } catch (_e) {
                db = new Dexie('TresorDatabase');
                await db.open();
              }

              let missionData = null;

              if (printId) {
                // Lecture via la table temporaire pour Electron
                const pd = await db.table('printData').get(parseInt(printId));
                if (pd && pd.data) {
                  missionData = JSON.parse(pd.data);
                } else {
                  throw new Error("Données d'impression introuvables.");
                }
              } else if (id) {
                // Lecture directe en DB web (mode dev/web)
                const mission = await db.table('ordresMission').get(parseInt(id));
                if (!mission) throw new Error('Ordre de mission introuvable.');

                const employe = await db.table('employes').get(mission.employeId);
                if (!employe) throw new Error('Employé introuvable.');

                missionData = {
                  ...mission,
                  agentNom: employe.nom,
                  agentPrenom: employe.prenom,
                  agentSexe: employe.sexe,
                  agentMatricule: employe.matricule,
                  agentPoste: employe.poste,
                  agentService: employe.service,
                };
              } else {
                // Mode test : on prend le dernier ordre de mission
                const missions = await db.table('ordresMission').toArray();
                if (missions.length === 0) {
                  throw new Error('Aucun ordre de mission dans la base (Test).');
                }
                const mission = missions[missions.length - 1];
                const employe = await db.table('employes').get(mission.employeId);

                missionData = {
                  ...mission,
                  agentNom: employe?.nom || 'Test',
                  agentPrenom: employe?.prenom || 'Agent',
                  agentSexe: employe?.sexe || 'M',
                  agentMatricule: employe?.matricule || '123456',
                  agentPoste: employe?.poste || 'Employé',
                  agentService: employe?.service || 'Service',
                };
              }

              data.value = missionData;

              // Lancer l'impression auto si demandé (+ timeout pour Vue render)
              if (urlParams.get('print') === 'true' || printId) {
                setTimeout(() => {
                  window.print();
                  // Optionnel : if (printId) window.close();
                }, 500);
              }
            } catch (e) {
              console.error(e);
              error.value = e.message;
            } finally {
              loading.value = false;
            }
          }

          onMounted(() => {
            loadData();
          });

          return { data, loading, error, agentNom, todayStr, formatDate, formatAmount };
        },
      }).mount('#app');
    </script>
  </body>
</html>
