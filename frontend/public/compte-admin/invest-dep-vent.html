<!doctype html>
<html lang="fr">

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Administratif - Depenses Investissement Ventilees</title>
    <script src="../dexie.min.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 9px;
        margin: 0;
        padding: 10px;
      }
      .container {
        width: 100%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 3px 5px;
        color: #000;
      }
      th {
        font-weight: bold;
        text-align: center;
        vertical-align: middle;
      }
      .col-num {
        text-align: right;
        white-space: nowrap;
        font-size: 9px;
      }
      .bold {
        font-weight: bold;
      }
      .underline {
        text-decoration: underline;
      }
      .align-center {
        text-align: center;
      }
      .align-right {
        text-align: right;
      }
      .align-left {
        text-align: left;
      }
      .uppercase {
        text-transform: uppercase;
      }
      .padding-left-md {
        padding-left: 20px;
      }
      .padding-left-sm {
        padding-left: 10px;
      }
      .total-row {
        font-weight: bold;
      }
      .signatures {
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
        padding: 0 50px;
        font-size: 10px;
      }
      .signature-box {
        text-align: center;
        width: 200px;
      }
      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 24px;
        background-color: #1976d2;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }
      .print-button:hover {
        background-color: #1565c0;
      }
      .loading {
        text-align: center;
        padding: 50px;
        font-size: 16px;
        color: #666;
      }
      .print-footer {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      @media print {
        body {
          padding: 0;
        }
        .no-print {
          display: none;
        }
        .print-footer {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <button class="print-button no-print" onclick="window.print()">Imprimer</button>
    <div class="container">
      <div id="content">
        <div class="loading">Chargement des donnees...</div>
      </div>
    </div>

    <script>
      function fmt(v) {
        return v ? new Intl.NumberFormat('fr-FR').format(Math.round(v)) : '0';
      }
      function fmtOrDash(v) {
        return v ? new Intl.NumberFormat('fr-FR').format(Math.round(v)) : '-';
      }
      function fmtCredits(prevu, mandat) {
        var c = prevu - mandat;
        return c > 0 ? new Intl.NumberFormat('fr-FR').format(Math.round(c)) : '-';
      }

      var SECTION_LABELS = {
        90: 'EQUIPEMENT DES SERVICES GENERAUX',
        91: 'EQUIPEMENT DES SERVICES DE COLLECTIVITE',
        92: 'URBANISME ET ASSAINISSEMENT',
        93: 'INVESTISSEMENTS FINANCIERS',
        94: 'REMBOURSEMENT EMPRUNTS',
        95: 'DEPENSES DIVERSES',
      };

      function renderPage(data) {
        var exercice = data.exercice || new Date().getFullYear();
        var mairie = data.mairie || {};
        var articles = data.articles || [];

        var content = document.getElementById('content');
        content.innerHTML = '';

        var table = document.createElement('table');
        table.style.tableLayout = 'fixed';
        table.innerHTML =
          '<colgroup>' +
          '<col style="width:28%">' +
          '<col style="width:10%">' +
          '<col style="width:10%">' +
          '<col style="width:10%">' +
          '<col style="width:12%">' +
          '<col style="width:12%">' +
          '<col style="width:12%">' +
          '<col style="width:6%">' +
          '</colgroup>' +
          '<thead>' +
          '<tr>' +
          '<th rowspan="2" class="align-center bold uppercase" style="font-size: 10px;">COMPTES ET RUBRIQUES BUDGETAIRES</th>' +
          '<th rowspan="2" class="align-center uppercase" style="font-size: 8px;">PREVISIONS</th>' +
          '<th rowspan="2" class="align-center uppercase" style="font-size: 8px;">MANDATS</th>' +
          '<th rowspan="2" class="align-center uppercase" style="font-size: 8px;">CREDITS<br>SANS EMPLOI</th>' +
          '<th colspan="3" class="align-center bold uppercase" style="font-size: 9px;">VENTILATION DES DEPENSES PAR TYPE DE BIEN</th>' +
          '<th rowspan="2" class="align-center bold uppercase" style="font-size: 9px;">TOTAL</th>' +
          '</tr>' +
          '<tr>' +
          '<th class="align-center bold uppercase" style="font-size: 8px;">IMMOBILIER</th>' +
          '<th class="align-center bold uppercase" style="font-size: 8px;">MOBILIER</th>' +
          '<th class="align-center bold uppercase" style="font-size: 8px;">INCORPOREL</th>' +
          '</tr>' +
          '</thead>' +
          '<tbody></tbody>';

        var tbody = table.querySelector('tbody');

        var sectionOrder = ['90', '91', '92', '93', '94', '95'];
        var sections = {};
        sectionOrder.forEach(function (s) {
          sections[s] = [];
        });

        articles.forEach(function (art) {
          var prefix = (art.code || '').substring(0, 2);
          if (sections[prefix]) {
            sections[prefix].push(art);
          }
        });

        var grandPrevu = 0;
        var grandTotal = 0;
        var grandImmo = 0;
        var grandMob = 0;
        var grandIncorp = 0;

        sectionOrder.forEach(function (secCode) {
          var items = sections[secCode];
          if (items.length === 0) return;

          items.sort(function (a, b) {
            return (a.code || '').localeCompare(b.code || '', undefined, { numeric: true });
          });

          // Section header
          var secRow = document.createElement('tr');
          secRow.style.backgroundColor = '#e3f2fd';
          secRow.innerHTML =
            '<td colspan="8" class="bold underline padding-left-sm uppercase" style="font-size: 9px;">SECTION ' +
            secCode +
            ' - ' +
            (SECTION_LABELS[secCode] || '') +
            '</td>';
          tbody.appendChild(secRow);

          var secPrevu = 0;
          var secTotal = 0;
          var secImmo = 0;
          var secMob = 0;
          var secIncorp = 0;

          items.forEach(function (art) {
            var row = document.createElement('tr');
            var html =
              '<td class="padding-left-md" style="font-size: 9px;">' +
              art.code +
              ' - ' +
              (art.libelle || '') +
              '</td>';
            html += '<td class="col-num">' + fmt(art.montantPrevu) + '</td>';
            html += '<td class="col-num">' + fmtOrDash(art.total) + '</td>';
            html += '<td class="col-num">' + fmtCredits(art.montantPrevu, art.total) + '</td>';
            html += '<td class="col-num">' + fmtOrDash(art.immobilier) + '</td>';
            html += '<td class="col-num">' + fmtOrDash(art.mobilier) + '</td>';
            html += '<td class="col-num">' + fmtOrDash(art.incorporel) + '</td>';
            html += '<td class="col-num">' + fmtOrDash(art.total) + '</td>';
            row.innerHTML = html;
            tbody.appendChild(row);

            secPrevu += art.montantPrevu;
            secTotal += art.total;
            secImmo += art.immobilier;
            secMob += art.mobilier;
            secIncorp += art.incorporel;
          });

          // TOTAL SECTION
          var secTotalRow = document.createElement('tr');
          secTotalRow.className = 'total-row';
          secTotalRow.style.backgroundColor = '#e0e0e0';
          var secHtml =
            '<td class="bold align-right uppercase" style="font-size: 8px;">TOTAL SECTION ' +
            secCode +
            '</td>';
          secHtml += '<td class="col-num">' + fmt(secPrevu) + '</td>';
          secHtml += '<td class="col-num">' + fmtOrDash(secTotal) + '</td>';
          secHtml += '<td class="col-num">' + fmtCredits(secPrevu, secTotal) + '</td>';
          secHtml += '<td class="col-num">' + fmtOrDash(secImmo) + '</td>';
          secHtml += '<td class="col-num">' + fmtOrDash(secMob) + '</td>';
          secHtml += '<td class="col-num">' + fmtOrDash(secIncorp) + '</td>';
          secHtml += '<td class="col-num">' + fmtOrDash(secTotal) + '</td>';
          secTotalRow.innerHTML = secHtml;
          tbody.appendChild(secTotalRow);

          grandPrevu += secPrevu;
          grandTotal += secTotal;
          grandImmo += secImmo;
          grandMob += secMob;
          grandIncorp += secIncorp;
        });

        // TOTAL GENERAL
        var totalRow = document.createElement('tr');
        totalRow.className = 'total-row';
        totalRow.style.backgroundColor = '#bdbdbd';
        var tHtml =
          '<td class="bold align-right uppercase" style="font-size: 9px;">TOTAL GENERAL DES DEPENSES AU TITRE II</td>';
        tHtml += '<td class="col-num">' + fmt(grandPrevu) + '</td>';
        tHtml += '<td class="col-num">' + fmtOrDash(grandTotal) + '</td>';
        tHtml += '<td class="col-num">' + fmtCredits(grandPrevu, grandTotal) + '</td>';
        tHtml += '<td class="col-num">' + fmtOrDash(grandImmo) + '</td>';
        tHtml += '<td class="col-num">' + fmtOrDash(grandMob) + '</td>';
        tHtml += '<td class="col-num">' + fmtOrDash(grandIncorp) + '</td>';
        tHtml += '<td class="col-num">' + fmtOrDash(grandTotal) + '</td>';
        totalRow.innerHTML = tHtml;
        tbody.appendChild(totalRow);

        table.appendChild(tbody);
        content.appendChild(table);

        // Signatures
        var sigs = document.createElement('div');
        sigs.className = 'signatures print-footer';
        var today = new Date();
        var dateStr = today.toLocaleDateString('fr-FR', {
          day: 'numeric',
          month: 'long',
          year: 'numeric',
        });
        sigs.innerHTML =
          '<div class="signature-box">' +
          (mairie.nom || '---') +
          ', le ' +
          dateStr +
          '<br/>' +
          '<strong>Le Tresorier Principal</strong>' +
          '</div>' +
          '<div class="signature-box">' +
          '<br/>' +
          '<strong>Le Maire</strong>' +
          '</div>';
        content.appendChild(sigs);

        document.title = 'Compte Administratif - Depenses Investissement Ventilees - ' + exercice;
      }

      // Load data directly from IndexedDB
      async function loadAndRender() {
        try {
          let db;
          try {
            db = new Dexie('TresorOfflineDB');
            await db.open();
          } catch (_e) {
            db = new Dexie('TresorDatabase');
            await db.open();
          }

          var exercice = new Date().getFullYear();

          // Check printData for exercice override
          try {
            var pd = await db.table('printData').toArray();
            var latest = pd
              .filter(function (p) {
                return p.type === 'FILL_COMPTE_ADMIN_DATA';
              })
              .sort(function (a, b) {
                return b.createdAt - a.createdAt;
              })[0];
            if (latest && latest.data && latest.data.exercice) exercice = latest.data.exercice;
          } catch (e) {}

          var params = new URLSearchParams(window.location.search);
          if (params.get('exercice')) exercice = parseInt(params.get('exercice'));

          var mairie = (await db.table('mairies').toCollection().first()) || {};
          var allSousChapitres = await db.table('sousChapitres').toArray();
          var allPrevisions = await db.table('previsions').toArray();
          var previsions = allPrevisions.filter(function (p) {
            return p.exercice === exercice;
          });
          var allMandats = await db.table('mandats').toArray();
          var mandats = allMandats.filter(function (m) {
            return m.exercice === exercice && m.statut === 'paye';
          });

          // Filter sous-chapitres starting with '9' (investment)
          var investSC = allSousChapitres.filter(function (sc) {
            return (sc.code || '').startsWith('9');
          });

          // Build prevision totals per sous-chapitre
          var prevMap = {};
          previsions.forEach(function (p) {
            if (!p.sousChapitreId) return;
            prevMap[p.sousChapitreId] = (prevMap[p.sousChapitreId] || 0) + (p.montantPrevu || 0);
          });

          // Build ventilation map: group mandats by (sousChapitreId, typeBien)
          var ventMap = {};
          mandats.forEach(function (m) {
            if (!m.sousChapitreId || !m.typeBien) return;
            var key = m.sousChapitreId + '-' + m.typeBien;
            ventMap[key] = (ventMap[key] || 0) + (m.montant || 0);
          });

          // Build article list with immobilier/mobilier/incorporel
          var articlesList = [];
          investSC.forEach(function (sc) {
            var montantPrevu = prevMap[sc.id] || 0;
            var immobilier = ventMap[sc.id + '-immobilier'] || 0;
            var mobilier = ventMap[sc.id + '-mobilier'] || 0;
            var incorporel = ventMap[sc.id + '-incorporel'] || 0;
            var total = immobilier + mobilier + incorporel;

            if (montantPrevu > 0 || total > 0) {
              articlesList.push({
                code: sc.code,
                libelle: sc.libelle,
                montantPrevu: montantPrevu,
                immobilier: immobilier,
                mobilier: mobilier,
                incorporel: incorporel,
                total: total,
              });
            }
          });

          renderPage({
            exercice: exercice,
            mairie: mairie,
            articles: articlesList,
          });
        } catch (e) {
          console.error('[InvestDepVent] Erreur:', e);
          document.getElementById('content').innerHTML =
            '<div style="color:red;padding:20px">Erreur: ' + e.message + '</div>';
        }
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'FILL_COMPTE_ADMIN_DATA') {
          loadAndRender();
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(loadAndRender, 500);
      });
    </script>
  </body>
</html>

      // Load data directly from IndexedDB
      async function loadAndRender() {
        try {
          let db;
          try {
            db = new Dexie('TresorOfflineDB');
            await db.open();
          } catch (_e) {
            db = new Dexie('TresorDatabase');
            await db.open();
          }

          var exercice = new Date().getFullYear();

          // Check printData for exercice override
          try {
            var pd = await db.table('printData').toArray();
            var latest = pd
              .filter(function (p) {
                return p.type === 'FILL_COMPTE_ADMIN_DATA';
              })
              .sort(function (a, b) {
                return b.createdAt - a.createdAt;
              })[0];
            if (latest && latest.data && latest.data.exercice) exercice = latest.data.exercice;
          } catch (e) {}

          var params = new URLSearchParams(window.location.search);
          if (params.get('exercice')) exercice = parseInt(params.get('exercice'));

          var mairie = (await db.table('mairies').toCollection().first()) || {};
          var allSousChapitres = await db.table('sousChapitres').toArray();
          var allChapitres = await db.table('chapitres').toArray();
          var allPrevisions = await db.table('previsions').toArray();
          var previsions = allPrevisions.filter(function (p) {
            return p.exercice === exercice;
          });
          var allMandats = await db.table('mandats').toArray();
          var mandats = allMandats.filter(function (m) {
            return m.exercice === exercice && m.statut === 'paye';
          });

          // Build chapitre code map: chapitreId -> code
          var chapCodeMap = {};
          allChapitres.forEach(function (ch) {
            chapCodeMap[ch.id] = ch.code || '';
          });

          // Filter sous-chapitres starting with '9' (investment)
          var investSC = allSousChapitres.filter(function (sc) {
            return (sc.code || '').startsWith('9');
          });

          // Build prevision totals per sous-chapitre
          var prevMap = {};
          previsions.forEach(function (p) {
            if (!p.sousChapitreId) return;
            prevMap[p.sousChapitreId] = (prevMap[p.sousChapitreId] || 0) + (p.montantPrevu || 0);
          });

          // Build ventilation map: group mandats by (sousChapitreId, chapitreCode 1-6)
          var ventMap = {};
          mandats.forEach(function (m) {
            if (!m.sousChapitreId) return;
            var chapCode = chapCodeMap[m.chapitreId] || '';
            var chapNum = parseInt(chapCode, 10) || 0;
            if (chapNum < 1 || chapNum > 6) return;
            var key = m.sousChapitreId + '-' + chapNum;
            ventMap[key] = (ventMap[key] || 0) + (m.montant || 0);
          });

          // Build article list with chap1-chap6
          var articlesList = [];
          investSC.forEach(function (sc) {
            var montantPrevu = prevMap[sc.id] || 0;
            var chap1 = ventMap[sc.id + '-1'] || 0;
            var chap2 = ventMap[sc.id + '-2'] || 0;
            var chap3 = ventMap[sc.id + '-3'] || 0;
            var chap4 = ventMap[sc.id + '-4'] || 0;
            var chap5 = ventMap[sc.id + '-5'] || 0;
            var chap6 = ventMap[sc.id + '-6'] || 0;
            var total = chap1 + chap2 + chap3 + chap4 + chap5 + chap6;

            if (montantPrevu > 0 || total > 0) {
              articlesList.push({
                code: sc.code,
                libelle: sc.libelle,
                montantPrevu: montantPrevu,
                chap1: chap1,
                chap2: chap2,
                chap3: chap3,
                chap4: chap4,
                chap5: chap5,
                chap6: chap6,
                total: total,
              });
            }
          });

          renderPage({
            exercice: exercice,
            mairie: mairie,
            articles: articlesList,
          });
        } catch (e) {
          console.error('[InvestDepVent] Erreur:', e);
          document.getElementById('content').innerHTML =
            '<div style="color:red;padding:20px">Erreur: ' + e.message + '</div>';
        }
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'FILL_COMPTE_ADMIN_DATA') {
          loadAndRender();
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(loadAndRender, 500);
      });

          investSC.forEach(function (sc) {
            scAggregation[sc.id] = {
              code: sc.code,
              libelle: sc.libelle,
              prevByPara: {},
              ventilation: {},
            };
          });

          // Build prevision per paragraph: group previsions by (sousChapitreId, chapitreId)
          // The chapitre code is the paragraph number (1-8)
          previsions.forEach(function (p) {
            if (!scAggregation[p.sousChapitreId]) return;
            var chapitre = chapMap[p.chapitreId];
            var chapCode = chapitre ? chapitre.code || '' : '';
            var paraNum = parseInt(chapCode, 10) || 0;
            if (paraNum < 1 || paraNum > 8) return;
            if (!scAggregation[p.sousChapitreId].prevByPara[paraNum]) {
              scAggregation[p.sousChapitreId].prevByPara[paraNum] = 0;
            }
            scAggregation[p.sousChapitreId].prevByPara[paraNum] += p.montantPrevu || 0;
          });

          // Build ventilation map: group mandats by (sousChapitreId, chapitreId)
          mandats.forEach(function (m) {
            if (!scAggregation[m.sousChapitreId]) return;
            var chapitre = chapMap[m.chapitreId];
            var chapCode = chapitre ? chapitre.code || '' : '';
            var paraNum = parseInt(chapCode, 10) || 0;
            if (paraNum < 1 || paraNum > 8) return;
            if (!scAggregation[m.sousChapitreId].ventilation[paraNum]) {
              scAggregation[m.sousChapitreId].ventilation[paraNum] = 0;
            }
            scAggregation[m.sousChapitreId].ventilation[paraNum] += m.montant || 0;
          });

          // Filter out articles that have no data at all
          var articlesList = Object.values(scAggregation).filter(function (art) {
            var hasPrev = Object.values(art.prevByPara).some(function (v) {
              return v > 0;
            });
            var hasMand = Object.values(art.ventilation).some(function (v) {
              return v > 0;
            });
            return hasPrev || hasMand;
          });

          renderPage({
            exercice: exercice,
            mairie: mairie,
            articles: articlesList,
          });
        } catch (e) {
          console.error('[InvestDepVent] Erreur:', e);
          document.getElementById('content').innerHTML =
            '<div style="color:red;padding:20px">Erreur: ' + e.message + '</div>';
        }
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'FILL_COMPTE_ADMIN_DATA') {
          loadAndRender();
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(loadAndRender, 500);
      });
    </script>
  </body>
</html>
