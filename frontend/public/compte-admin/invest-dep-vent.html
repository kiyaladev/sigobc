<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Administratif - Depenses Investissement Ventilees</title>
    <script src="../dexie.min.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 9px;
        margin: 0;
        padding: 10px;
      }
      .container {
        width: 100%;
      }
      .main-title {
        font-size: 12px;
        font-weight: bold;
        text-align: center;
        margin-bottom: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0;
        table-layout: fixed;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 2px 4px;
      }
      th {
        background-color: #fff;
        text-align: center;
        vertical-align: middle;
        font-size: 8px;
        font-weight: bold;
      }
      .col-rubrique {
        width: 25%;
        text-align: left;
      }
      .col-num {
        text-align: right;
        white-space: nowrap;
        width: 7%;
      }
      .section-header {
        font-weight: bold;
        text-transform: uppercase;
      }
      .chapitre-header {
        font-weight: bold;
        text-decoration: underline;
        padding-left: 10px;
      }
      .article-header {
        font-weight: bold;
        padding-left: 20px;
      }
      .sous-total {
        font-weight: bold;
        text-align: center;
      }
      .total-section {
        font-weight: bold;
        text-align: center;
      }
      .grand-total {
        font-weight: bold;
        text-align: center;
      }
      .category-title {
        text-decoration: underline;
        text-align: center;
        margin: 2px 0;
      }
      .detail-row td:first-child {
        padding-left: 30px;
      }
      .header-table {
        width: 100%;
        border: none;
        margin-bottom: 5px;
      }
      .header-table td {
        border: none;
        padding: 0;
      }
      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 20px;
        background: #009688;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        z-index: 1000;
      }
      .print-button:hover {
        background: #00796b;
      }
      .loading {
        text-align: center;
        padding: 50px;
        font-size: 16px;
        color: #666;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <button class="print-button no-print" onclick="window.print()">Imprimer</button>
    <div class="container">
      <div id="content">
        <div class="loading" id="loading">Chargement des donnees...</div>
      </div>
    </div>

    <script>
      function fmt(v) {
        return v ? new Intl.NumberFormat('fr-FR').format(v) : '-';
      }

      const SECTIONS = {
        90: 'EQUIPEMENT DES SERVICES GENERAUX',
        91: 'EQUIPEMENT DES SERVICES DE COLLECTIVITE',
        92: 'EQUIPEMENT DES SERVICES SOCIAUX',
        93: 'EQUIPEMENT DES SERVICES ECONOMIQUES',
        94: 'REMBOURSEMENT EMPRUNTS',
        95: 'AUTRES DEPENSES INVESTISSEMENT',
      };

      async function loadData() {
        const db = new Dexie('TresorDatabase');
        await db.open();

        const exercice = new Date().getFullYear();

        const [sousChapitres, chapitres, allPrevisions, allMandats, mairie] = await Promise.all([
          db.table('sousChapitres').toArray(),
          db.table('chapitres').toArray(),
          db.table('previsions').toArray(),
          db.table('mandats').toArray(),
          db.table('mairies').toCollection().first(),
        ]);
        const previsions = allPrevisions.filter(p => p.exercice === exercice);
        const mandats = allMandats.filter(m => m.exercice === exercice);

        // Filter sous-chapitres with code starting with '9'
        const investSC = sousChapitres.filter((sc) => sc.code && sc.code.startsWith('9'));

        // Build prevision map by sousChapitreId
        const prevMap = {};
        previsions.forEach((p) => {
          if (p.sousChapitreId) {
            if (!prevMap[p.sousChapitreId]) prevMap[p.sousChapitreId] = 0;
            prevMap[p.sousChapitreId] += p.montantPrevu || 0;
          }
        });

        // Build engagements map by sousChapitreId
        const engMap = {};
        mandats.forEach((m) => {
          if (m.statut === 'annule') return;
          const scId = m.sousChapitreId;
          if (!engMap[scId]) engMap[scId] = 0;
          engMap[scId] += m.montant || 0;
        });

        return { investSC, chapitres, prevMap, engMap, exercice, mairie };
      }

      function render(data) {
        const { investSC, chapitres, prevMap, engMap, exercice, mairie } = data;
        const communeNom = ((mairie && mairie.nom) || 'COMMUNE').replace(/^mairie de /i, '').toUpperCase();

        // Group by Section (2 digits), Chapitre (3 digits), Article (4 digits)
        const hierarchy = {};

        investSC.forEach((sc) => {
          const code = sc.code;
          if (!code || code.length < 2) return;

          const secCode = code.substring(0, 2);
          const chapCode = code.length >= 3 ? code.substring(0, 3) : code;

          if (!hierarchy[secCode]) hierarchy[secCode] = { chapitres: {} };
          if (!hierarchy[secCode].chapitres[chapCode]) {
            // Find chapitre libelle
            const chapObj = chapitres.find((c) => c.code === chapCode);
            hierarchy[secCode].chapitres[chapCode] = {
              libelle: chapObj ? chapObj.libelle : '',
              articles: [],
            };
          }

          hierarchy[secCode].chapitres[chapCode].articles.push(sc);
        });

        let grandPrev = 0,
          grandMandats = 0,
          grandCredits = 0;
        let grandImmTrav = 0,
          grandImmInterv = 0;
        let grandMobTrav = 0,
          grandMobInterv = 0;
        let grandIncTrav = 0,
          grandIncInterv = 0;
        let grandTotalVentil = 0;

        let rows = '';
        const sectionCodes = Object.keys(hierarchy).sort();

        sectionCodes.forEach((secCode) => {
          const secLabel = SECTIONS[secCode] || '';

          rows +=
            '<tr class="section-header"><td colspan="11">SECTION ' +
            secCode +
            ' - ' +
            secLabel +
            '</td></tr>';

          let secPrev = 0,
            secMandats = 0,
            secCredits = 0;
          let secImmTrav = 0,
            secImmInterv = 0;
          let secMobTrav = 0,
            secMobInterv = 0;
          let secIncTrav = 0,
            secIncInterv = 0;
          let secTotalVentil = 0;

          const chapCodes = Object.keys(hierarchy[secCode].chapitres).sort();

          chapCodes.forEach((chapCode) => {
            const chapData = hierarchy[secCode].chapitres[chapCode];

            rows +=
              '<tr><td colspan="11" class="chapitre-header">CHAPITRE ' +
              chapCode +
              ' - ' +
              chapData.libelle +
              '</td></tr>';

            let chapPrev = 0,
              chapMandats = 0,
              chapCredits = 0;
            let chapImmTrav = 0,
              chapImmInterv = 0;
            let chapMobTrav = 0,
              chapMobInterv = 0;
            let chapIncTrav = 0,
              chapIncInterv = 0;
            let chapTotalVentil = 0;

            // Sort articles
            const articles = chapData.articles.sort((a, b) => a.code.localeCompare(b.code));

            articles.forEach((art) => {
              const prev = prevMap[art.id] || 0;
              const mandats = engMap[art.id] || 0;
              const credits = prev - mandats;

              // For demonstration, we put all mandats in "IMMOBILIERS - Travaux"
              // In a real app, this would be ventilated based on other criteria
              const immTrav = mandats;
              const immInterv = 0;
              const mobTrav = 0;
              const mobInterv = 0;
              const incTrav = 0;
              const incInterv = 0;
              const totalVentil = immTrav + immInterv + mobTrav + mobInterv + incTrav + incInterv;

              chapPrev += prev;
              chapMandats += mandats;
              chapCredits += credits;
              chapImmTrav += immTrav;
              chapTotalVentil += totalVentil;

              // Article header
              rows +=
                '<tr><td colspan="11" class="article-header">' +
                art.code +
                ' - ' +
                (art.libelle || '') +
                '</td></tr>';

              // Category: IMMOBILIERS
              rows +=
                '<tr><td colspan="11"><div class="category-title">IMMOBILIERS</div></td></tr>';

              // Detail rows
              rows +=
                '<tr class="detail-row">' +
                "<td>Travaux et services à l'entreprise</td>" +
                '<td class="col-num">' +
                fmt(prev) +
                '</td>' +
                '<td class="col-num">' +
                fmt(mandats) +
                '</td>' +
                '<td class="col-num">' +
                fmt(credits) +
                '</td>' +
                '<td class="col-num">' +
                fmt(immTrav) +
                '</td>' +
                '<td class="col-num">' +
                fmt(immInterv) +
                '</td>' +
                '<td class="col-num">' +
                fmt(mobTrav) +
                '</td>' +
                '<td class="col-num">' +
                fmt(mobInterv) +
                '</td>' +
                '<td class="col-num">' +
                fmt(incTrav) +
                '</td>' +
                '<td class="col-num">' +
                fmt(incInterv) +
                '</td>' +
                '<td class="col-num">' +
                fmt(totalVentil) +
                '</td>' +
                '</tr>';

              rows +=
                '<tr class="detail-row">' +
                '<td>Interventions et transferts</td>' +
                '<td class="col-num">-</td>' +
                '<td class="col-num">-</td>' +
                '<td class="col-num">-</td>' +
                '<td class="col-num">-</td>' +
                '<td class="col-num">-</td>' +
                '<td class="col-num">-</td>' +
                '<td class="col-num">-</td>' +
                '<td class="col-num">-</td>' +
                '<td class="col-num">-</td>' +
                '<td class="col-num">-</td>' +
                '</tr>';

              // Sous total article
              rows +=
                '<tr>' +
                '<td class="sous-total">SOUS TOTAL ARTICLE ' +
                art.code +
                '</td>' +
                '<td class="col-num">' +
                fmt(prev) +
                '</td>' +
                '<td class="col-num">' +
                fmt(mandats) +
                '</td>' +
                '<td class="col-num">' +
                fmt(credits) +
                '</td>' +
                '<td class="col-num">' +
                fmt(immTrav) +
                '</td>' +
                '<td class="col-num">' +
                fmt(immInterv) +
                '</td>' +
                '<td class="col-num">' +
                fmt(mobTrav) +
                '</td>' +
                '<td class="col-num">' +
                fmt(mobInterv) +
                '</td>' +
                '<td class="col-num">' +
                fmt(incTrav) +
                '</td>' +
                '<td class="col-num">' +
                fmt(incInterv) +
                '</td>' +
                '<td class="col-num">' +
                fmt(totalVentil) +
                '</td>' +
                '</tr>';
            });

            // Sous total chapitre
            rows +=
              '<tr>' +
              '<td class="sous-total">SOUS TOTAL CHAPITRE ' +
              chapCode +
              '</td>' +
              '<td class="col-num">' +
              fmt(chapPrev) +
              '</td>' +
              '<td class="col-num">' +
              fmt(chapMandats) +
              '</td>' +
              '<td class="col-num">' +
              fmt(chapCredits) +
              '</td>' +
              '<td class="col-num">' +
              fmt(chapImmTrav) +
              '</td>' +
              '<td class="col-num">' +
              fmt(chapImmInterv) +
              '</td>' +
              '<td class="col-num">' +
              fmt(chapMobTrav) +
              '</td>' +
              '<td class="col-num">' +
              fmt(chapMobInterv) +
              '</td>' +
              '<td class="col-num">' +
              fmt(chapIncTrav) +
              '</td>' +
              '<td class="col-num">' +
              fmt(chapIncInterv) +
              '</td>' +
              '<td class="col-num">' +
              fmt(chapTotalVentil) +
              '</td>' +
              '</tr>';

            secPrev += chapPrev;
            secMandats += chapMandats;
            secCredits += chapCredits;
            secImmTrav += chapImmTrav;
            secTotalVentil += chapTotalVentil;
          });

          // Total section
          rows +=
            '<tr class="total-section">' +
            '<td>TOTAL SECTION ' +
            secCode +
            '</td>' +
            '<td class="col-num">' +
            fmt(secPrev) +
            '</td>' +
            '<td class="col-num">' +
            fmt(secMandats) +
            '</td>' +
            '<td class="col-num">' +
            fmt(secCredits) +
            '</td>' +
            '<td class="col-num">' +
            fmt(secImmTrav) +
            '</td>' +
            '<td class="col-num">' +
            fmt(secImmInterv) +
            '</td>' +
            '<td class="col-num">' +
            fmt(secMobTrav) +
            '</td>' +
            '<td class="col-num">' +
            fmt(secMobInterv) +
            '</td>' +
            '<td class="col-num">' +
            fmt(secIncTrav) +
            '</td>' +
            '<td class="col-num">' +
            fmt(secIncInterv) +
            '</td>' +
            '<td class="col-num">' +
            fmt(secTotalVentil) +
            '</td>' +
            '</tr>';

          grandPrev += secPrev;
          grandMandats += secMandats;
          grandCredits += secCredits;
          grandImmTrav += secImmTrav;
          grandTotalVentil += secTotalVentil;
        });

        // Grand total
        rows +=
          '<tr class="grand-total">' +
          '<td>TOTAL GENERAL DES DEPENSES AU TITRE II</td>' +
          '<td class="col-num">' +
          fmt(grandPrev) +
          '</td>' +
          '<td class="col-num">' +
          fmt(grandMandats) +
          '</td>' +
          '<td class="col-num">' +
          fmt(grandCredits) +
          '</td>' +
          '<td class="col-num">' +
          fmt(grandImmTrav) +
          '</td>' +
          '<td class="col-num">' +
          fmt(grandImmInterv) +
          '</td>' +
          '<td class="col-num">' +
          fmt(grandMobTrav) +
          '</td>' +
          '<td class="col-num">' +
          fmt(grandMobInterv) +
          '</td>' +
          '<td class="col-num">' +
          fmt(grandIncTrav) +
          '</td>' +
          '<td class="col-num">' +
          fmt(grandIncInterv) +
          '</td>' +
          '<td class="col-num">' +
          fmt(grandTotalVentil) +
          '</td>' +
          '</tr>';

        document.getElementById('content').innerHTML =
          '<table>' +
          '<colgroup>' +
          '<col style="width:22%">' +
          '<col style="width:7%"><col style="width:7%"><col style="width:7%">' +
          '<col style="width:7%"><col style="width:7%"><col style="width:7%"><col style="width:7%">' +
          '<col style="width:7%"><col style="width:7%"><col style="width:8%">' +
          '</colgroup>' +
          '<thead>' +
          // Document header row
          '<tr>' +
          '<th style="text-align:center; font-size:9px">COMMUNE DE ' + communeNom + '</th>' +
          '<th colspan="8" style="font-size:12px">COMPTE ADMINISTRATIF DEPENSES D\'INVESTISSEMENT</th>' +
          '<th style="font-size:8px">ANNEE<br><b>' + exercice + '</b></th>' +
          '<th style="font-size:8px">N&deg;<br><b>28</b></th>' +
          '</tr>' +
          // Column headers row 1
          '<tr>' +
          '<th rowspan="2" style="vertical-align:middle; font-size:8px">COMPTES ET RUBRIQUES BUDGETAIRES</th>' +
          '<th rowspan="2" style="vertical-align:middle; font-size:8px">PREVISIONS</th>' +
          '<th rowspan="2" style="vertical-align:middle; font-size:8px">MANDATS</th>' +
          '<th rowspan="2" style="vertical-align:middle; font-size:8px">CREDITS<br>SANS<br>EMPLOI</th>' +
          '<th colspan="6" style="font-size:8px">VENTILATION DES DEPENSES PAR PARAGRAPHE</th>' +
          '<th rowspan="2" style="vertical-align:middle; font-size:8px">TOTAL</th>' +
          '</tr>' +
          // Column headers row 2 (sub-headers under VENTILATION)
          '<tr>' +
          '<th colspan="2" style="font-size:8px">IMMOBILIERS</th>' +
          '<th colspan="2" style="font-size:8px">MOBILIERS</th>' +
          '<th colspan="2" style="font-size:8px">INCORPOREL</th>' +
          '</tr>' +
          // Column numbers row
          '<tr>' +
          '<th style="font-size:7px">1</th>' +
          '<th style="font-size:7px">2</th>' +
          '<th style="font-size:7px">3</th>' +
          '<th style="font-size:7px">4</th>' +
          "<th style=\"font-size:7px\">Travaux et services &agrave; l'entreprise<br>5</th>" +
          '<th style="font-size:7px">Intervention et transfert<br>6</th>' +
          "<th style=\"font-size:7px\">Travaux et services &agrave; l'entreprise<br>7</th>" +
          '<th style="font-size:7px">Intervention et transfert<br>8</th>' +
          "<th style=\"font-size:7px\">Travaux et services &agrave; l'entreprise<br>9</th>" +
          '<th style="font-size:7px">Intervention et transfert<br>10</th>' +
          '<th style="font-size:7px">11</th>' +
          '</tr>' +
          '</thead>' +
          '<tbody>' +
          rows +
          '</tbody>' +
          '</table>';
      }

      async function loadAndRender() {
        try {
          const result = await loadData();
          render(result);
        } catch (e) {
          console.error('Erreur chargement:', e);
          document.getElementById('content').innerHTML =
            '<div style="color:red;padding:20px;font-size:14px">Erreur: ' + e.message + '<br><pre>' + e.stack + '</pre></div>';
        }
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'FILL_COMPTE_ADMIN_DATA') {
          loadAndRender();
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(loadAndRender, 500);
      });
    </script>
  </body>
</html>
