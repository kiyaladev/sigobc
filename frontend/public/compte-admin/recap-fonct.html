<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Administratif - Récapitulatif Fonctionnement</title>
    <script src="../dexie.min.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        margin: 0;
        padding: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 3px 4px;
      }
      th {
        background-color: #f0f0f0;
        text-align: center;
        vertical-align: middle;
        font-size: 9px;
      }
      .text-right {
        text-align: right;
      }
      .text-center {
        text-align: center;
      }
      .section-title {
        text-align: center;
        font-weight: bold;
        font-size: 14px;
        margin: 15px 0 8px 0;
      }
      .sub-title {
        text-align: center;
        font-weight: bold;
        font-size: 11px;
        margin: 10px 0 5px 0;
      }
      .total-row {
        background-color: #e8e8e8;
        font-weight: bold;
      }
      .col-num-row td {
        text-align: center;
        font-size: 8px;
        font-style: italic;
        background-color: #fafafa;
      }
      .doc-header-cell {
        padding: 0 !important;
        background: #fff !important;
      }
      .doc-header-grid {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
      }
      .doc-header-block {
        padding: 4px 6px;
        min-height: 40px;
      }
      .doc-header-block + .doc-header-block {
        border-left: 1px solid #000;
      }
      .doc-header-left {
        text-align: left;
        font-weight: bold;
      }
      .doc-header-center {
        text-align: center;
        font-weight: bold;
      }
      .doc-header-right {
        text-align: right;
        font-weight: bold;
      }
      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 20px;
        background: #009688;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        z-index: 1000;
      }
      .print-button:hover {
        background: #00796b;
      }
      @media print {
        .no-print {
          display: none !important;
        }
      }
      .loading {
        text-align: center;
        padding: 50px;
        font-size: 16px;
        color: #666;
      }
    </style>
  </head>
  <body>
    <button class="print-button no-print" onclick="window.print()">Imprimer</button>
    <div id="content"><div class="loading">Chargement des données...</div></div>
    <script>
      function fmt(v) {
        return v && v !== 0 ? new Intl.NumberFormat('fr-FR').format(v) : '-';
      }

      var exercice = new Date().getFullYear();
      var params = new URLSearchParams(window.location.search);
      if (params.get('exercice')) exercice = parseInt(params.get('exercice'));

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'FILL_COMPTE_ADMIN_DATA') {
          if (e.data.exercice) exercice = e.data.exercice;
          loadAndRender();
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(loadAndRender, 500);
      });

      async function loadAndRender() {
        try {
          let db;
          try {
            db = new Dexie('TresorOfflineDB');
            await db.open();
          } catch (_e) {
            db = new Dexie('TresorDatabase');
            await db.open();
          }

          // Try to get exercice from printData
          try {
            var pd = await db.table('printData').toArray();
            var latest = pd
              .filter(function (p) {
                return p.type === 'FILL_COMPTE_ADMIN_DATA';
              })
              .sort(function (a, b) {
                return b.createdAt - a.createdAt;
              })[0];
            if (latest && latest.data && latest.data.exercice) exercice = latest.data.exercice;
          } catch (e) {}

          var mairie = (await db.table('mairies').toCollection().first()) || {};
          var allMandats = await db.table('mandats').toArray();
          var mandats = allMandats.filter(function (m) {
            return m.exercice === exercice && m.statut === 'paye';
          });
          var allPrevisions = await db.table('previsions').toArray();
          var previsions = allPrevisions.filter(function (p) {
            return p.exercice === exercice;
          });
          var sousChapitres = await db.table('sousChapitres').toArray();
          var taxes = await db.table('taxes').toArray();
          var allDeclarations = await db.table('declarations').toArray();
          var declarations = allDeclarations.filter(function (d) {
            return d.exercice === exercice && d.statut === 'validee';
          });
          var allPrevRec = await db.table('previsionsRecettes').toArray();
          var previsionsRecettes = allPrevRec.filter(function (p) {
            return p.exercice === exercice;
          });

          // Build maps
          var prevMap = {};
          previsions.forEach(function (p) {
            if (p.sousChapitreId)
              prevMap[p.sousChapitreId] = (prevMap[p.sousChapitreId] || 0) + p.montantPrevu;
          });

          var engageMap = {};
          mandats.forEach(function (m) {
            engageMap[m.sousChapitreId] = (engageMap[m.sousChapitreId] || 0) + m.montant;
          });

          var prevRecMap = {};
          previsionsRecettes.forEach(function (p) {
            prevRecMap[p.taxeId] = (prevRecMap[p.taxeId] || 0) + p.montantPrevu;
          });

          var emisMap = {};
          var recouvreMap = {};
          declarations.forEach(function (d) {
            var mt = d.montant || d.montantRecette || 0;
            emisMap[d.taxeId] = (emisMap[d.taxeId] || 0) + mt;
            if (d.dateEncaissement)
              recouvreMap[d.taxeId] = (recouvreMap[d.taxeId] || 0) + mt;
          });

          // Recettes sections
          var recSections = [
            { code: '70', libelle: '70 - Recettes fiscales' },
            { code: '71', libelle: '71 - Recettes des prestations et services' },
            { code: '72', libelle: '72 - Revenus du patrimoine et du portefeuille' },
            { code: '73', libelle: "73 - Aide de l'etat, fonds de concours, aides exterieures" },
            { code: '74', libelle: '74 - Recettes divers au titre I' },
          ];

          var recData = recSections.map(function (s) {
            var prevu = 0, em = 0, rec = 0;
            taxes.forEach(function (tx) {
              if (tx.code && tx.code.startsWith(s.code)) {
                prevu += prevRecMap[tx.id] || 0;
                em += emisMap[tx.id] || 0;
                rec += recouvreMap[tx.id] || 0;
              }
            });
            return {
              libelle: s.libelle,
              prevu: prevu,
              emissions: em,
              recouvrement: rec,
              ecart: prevu - em,
              taux: prevu > 0 ? ((em / prevu) * 100).toFixed(2) + '%' : '-',
            };
          });

          var tRP = recData.reduce(function (s, r) { return s + r.prevu; }, 0);
          var tRE = recData.reduce(function (s, r) { return s + r.emissions; }, 0);
          var tRR = recData.reduce(function (s, r) { return s + r.recouvrement; }, 0);

          // Depenses sections
          var depSections = [
            { code: '60', libelle: '60 - Depenses des services generaux' },
            { code: '61', libelle: '61 - Depenses des services de collectivite' },
            { code: '62', libelle: '62 - Depenses des services socioculturels et de prom. Hum.' },
            { code: '63', libelle: '63 - Depenses des services economiques' },
            { code: '64', libelle: '64 - Depenses diverses au titre I' },
          ];

          var depData = depSections.map(function (s) {
            var prevu = 0, m = 0;
            sousChapitres.forEach(function (sc) {
              if (sc.code && sc.code.startsWith(s.code)) {
                prevu += prevMap[sc.id] || 0;
                m += engageMap[sc.id] || 0;
              }
            });
            return {
              libelle: s.libelle,
              prevu: prevu,
              pct: prevu > 0 ? ((m / prevu) * 100).toFixed(2) : '0.00',
              mandatees: m,
            };
          });

          var tDP = depData.reduce(function (s, r) { return s + r.prevu; }, 0);
          var tDM = depData.reduce(function (s, r) { return s + r.mandatees; }, 0);

          // Build recettes rows
          var recRows = recData.map(function (r) {
            return '<tr>'
              + '<td style="padding:4px; border:1px solid #000">' + r.libelle + '</td>'
              + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(r.prevu) + '</td>'
              + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(r.emissions) + '</td>'
              + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(r.recouvrement) + '</td>'
              + '<td class="text-center" style="padding:4px; border:1px solid #000">-</td>'
              + '<td class="text-center" style="padding:4px; border:1px solid #000">' + fmt(Math.max(0, r.prevu - r.recouvrement)) + '</td>'
              + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(r.ecart) + '</td>'
              + '<td class="text-right" style="padding:4px; border:1px solid #000">' + r.taux + '</td>'
              + '</tr>';
          }).join('');

          // Build depenses rows
          var depRows = depData.map(function (r) {
            return '<tr>'
              + '<td style="padding:4px; border:1px solid #000">' + r.libelle + '</td>'
              + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(r.prevu) + '</td>'
              + '<td class="text-right" style="padding:4px; border:1px solid #000">' + r.pct + '</td>'
              + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(r.mandatees) + '</td>'
              + '<td class="text-center" style="padding:4px; border:1px solid #000">-</td>'
              + '<td class="text-center" style="padding:4px; border:1px solid #000">-</td>'
              + '<td class="text-center" style="padding:4px; border:1px solid #000">-</td>'
              + '<td class="text-center" style="padding:4px; border:1px solid #000">-</td>'
              + '</tr>';
          }).join('');

          var communeNom = (mairie.nom || 'VAVOUA').replace(/^mairie de /i, '').toUpperCase();

          var contentHtml = '<table style="width:100%; border-collapse:collapse; table-layout:fixed">'
            + '<colgroup>'
            + '<col style="width:28%"><col style="width:11%"><col style="width:11%"><col style="width:12%">'
            + '<col style="width:8%"><col style="width:8%"><col style="width:13%"><col style="width:9%">'
            + '</colgroup>'
            // Document header
            + '<tr>'
            + '<td style="text-align:center; font-weight:bold; padding:6px; border:1px solid #000">COMMUNE DE ' + communeNom + '</td>'
            + '<td colspan="5" style="text-align:center; font-weight:bold; font-size:14px; padding:6px; border:1px solid #000">COMPTE ADMINISTRATIF &nbsp;-&nbsp; RECAPITULATIF</td>'
            + '<td style="text-align:center; padding:4px; border:1px solid #000; font-size:9px">ANNEE<br><b>' + exercice + '</b></td>'
            + '<td style="text-align:center; padding:4px; border:1px solid #000; font-size:9px">N&deg;<br><b>&nbsp;</b></td>'
            + '</tr>'
            // Titre
            + '<tr><td colspan="8" style="text-align:center; font-weight:bold; font-size:16px; padding:12px 0; border:1px solid #000; letter-spacing:2px">TITRE &nbsp;I &nbsp;- &nbsp;BUDGET DE FONCTIONNEMENT</td></tr>'
            // RECETTES title
            + '<tr><td colspan="8" style="text-align:center; font-weight:bold; font-size:11px; padding:6px; border:1px solid #000; letter-spacing:4px">RECETTES &nbsp;&nbsp;DE &nbsp;&nbsp;FONCTIONNEMENT</td></tr>'
            // Recettes header row 1
            + '<tr>'
            + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px; background:#f0f0f0">SECTIONS BUDGETAIRES</th>'
            + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px; background:#f0f0f0">PREVISIONS</th>'
            + '<th colspan="4" style="border:1px solid #000; padding:3px; text-align:center; font-size:9px; background:#f0f0f0">EXECUTION DU BUDGET</th>'
            + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px; background:#f0f0f0">ECART PREVISION<br>EMISSION</th>'
            + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px; background:#f0f0f0">E / P &nbsp;&nbsp;%</th>'
            + '</tr>'
            // Recettes header row 2
            + '<tr>'
            + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:9px; background:#f0f0f0">EMISSIONS</th>'
            + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:9px; background:#f0f0f0">RECOUVREMENT</th>'
            + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:9px; background:#f0f0f0">NON VALEUR</th>'
            + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:9px; background:#f0f0f0">RESTE A<br>RECOUVRER</th>'
            + '</tr>'
            // Blank spacer row
            + '<tr><td colspan="8" style="border-left:1px solid #000; border-right:1px solid #000; padding:4px; border-top:none; border-bottom:none">&nbsp;</td></tr>'
            // Recettes data
            + recRows
            // Total recettes
            + '<tr style="font-weight:bold">'
            + '<td style="text-align:center; padding:4px; border:1px solid #000; font-size:10px">TOTAL DES RECETTES AU TITRE I</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(tRP) + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(tRE) + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(tRR) + '</td>'
            + '<td style="padding:4px; border:1px solid #000; font-size:10px"></td>'
            + '<td style="padding:4px; border:1px solid #000; font-size:10px"></td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(tRP - tRE) + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + (tRP > 0 ? ((tRE / tRP) * 100).toFixed(2) + '%' : '-') + '</td>'
            + '</tr>'
            // DEPENSES title
            + '<tr><td colspan="8" style="text-align:center; font-weight:bold; font-size:11px; padding:6px; border:1px solid #000; letter-spacing:4px">DEPENSES &nbsp;&nbsp;DE &nbsp;&nbsp;FONCTIONNEMENT</td></tr>'
            // Depenses header row 1
            + '<tr>'
            + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px; background:#f0f0f0">SECTIONS BUDGETAIRES</th>'
            + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px; background:#f0f0f0">PREVISIONS ENGAGEES</th>'
            + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px; background:#f0f0f0">POURCENTAGE<br>REALISATION</th>'
            + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px; background:#f0f0f0">DEPENSES MANDATEES</th>'
            + '<th colspan="4" style="border:1px solid #000; padding:3px; text-align:center; font-size:9px; background:#f0f0f0">ENGAGEMENTS NON MANDATES</th>'
            + '</tr>'
            // Depenses header row 2
            + '<tr>'
            + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:8px; background:#f0f0f0">COMMANDES<br>NON LIVREES</th>'
            + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:8px; background:#f0f0f0">COMMANDES<br>LIVREES NON<br>FACTUREES</th>'
            + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:8px; background:#f0f0f0">COMMANDES FACTUREES</th>'
            + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:8px; background:#f0f0f0">TOTAL (6 + 7 + 8)</th>'
            + '</tr>'
            // Blank spacer row
            + '<tr><td colspan="8" style="border-left:1px solid #000; border-right:1px solid #000; padding:4px; border-top:none; border-bottom:none">&nbsp;</td></tr>'
            // Depenses data
            + depRows
            // Total depenses
            + '<tr style="font-weight:bold">'
            + '<td style="text-align:center; padding:4px; border:1px solid #000; font-size:10px">TOTAL DES DEPENSES AU TITRE I</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(tDP) + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + (tDP > 0 ? ((tDM / tDP) * 100).toFixed(2) : '0.00') + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(tDM) + '</td>'
            + '<td class="text-center" style="padding:4px; border:1px solid #000; font-size:10px">-</td>'
            + '<td class="text-center" style="padding:4px; border:1px solid #000; font-size:10px">-</td>'
            + '<td class="text-center" style="padding:4px; border:1px solid #000; font-size:10px">-</td>'
            + '<td class="text-center" style="padding:4px; border:1px solid #000; font-size:10px">-</td>'
            + '</tr>'
            + '</table>';

          document.getElementById('content').innerHTML = contentHtml;
        } catch (e) {
          console.error('[RecapFonct] Erreur:', e);
          document.getElementById('content').innerHTML =
            '<div style="color:red;padding:20px">Erreur: ' + e.message + '</div>';
        }
      }
    </script>
  </body>
</html>
