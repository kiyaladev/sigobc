<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Administratif - Modifications du Patrimoine</title>
    <script src="../dexie.min.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        margin: 0;
        padding: 10px;
      }
      .container {
        width: 100%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 15px;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 4px 6px;
      }
      th {
        background-color: #e8e8e8;
        text-align: center;
        vertical-align: middle;
        font-size: 10px;
      }
      .col-num {
        text-align: right;
        white-space: nowrap;
      }
      .col-center {
        text-align: center;
      }
      .total-row {
        background-color: #e0e0e0;
        font-weight: bold;
      }
      .grand-total {
        background-color: #bbb;
        font-weight: bold;
      }
      .section-title {
        background-color: #f5f5f5;
        font-weight: bold;
        text-align: center;
      }
      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 20px;
        background: #009688;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 14px;
        z-index: 1000;
      }
      .print-button:hover {
        background: #00796b;
      }
      .loading {
        text-align: center;
        padding: 50px;
        font-size: 16px;
        color: #666;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          padding: 0;
        }
      }
    </style>
  </head>
  <body>
    <button class="print-button no-print" onclick="window.print()">Imprimer</button>
    <div class="container">
      <div id="content"><div class="loading">Chargement des donnees...</div></div>
    </div>

    <script>
      function fmt(v) {
        return v ? new Intl.NumberFormat('fr-FR').format(v) : '';
      }

      async function loadAndRender() {
        try {
          var db;
          try {
            db = new Dexie('TresorOfflineDB');
            await db.open();
          } catch (_e) {
            db = new Dexie('TresorDatabase');
            await db.open();
          }

          var exercice = new Date().getFullYear();
          try {
            var pd = await db.table('printData').toArray();
            var latest = pd
              .filter(function (p) {
                return p.type === 'FILL_COMPTE_ADMIN_DATA';
              })
              .sort(function (a, b) {
                return b.createdAt - a.createdAt;
              })[0];
            if (latest && latest.data && latest.data.exercice) exercice = latest.data.exercice;
          } catch (e) {}

          var params = new URLSearchParams(window.location.search);
          if (params.get('exercice')) exercice = parseInt(params.get('exercice'));

          var mairie = (await db.table('mairies').toCollection().first()) || {};
          var sousChapitres = await db.table('sousChapitres').toArray();
          var allProjets = await db.table('projets').toArray();
          var projets = allProjets.filter(function (p) {
            return p.annee === exercice && p.statut !== 'annule';
          });

          // Load mandats payés for the exercice to compute réalisés
          var allMandats = await db.table('mandats').toArray();
          var mandatsPaye = allMandats.filter(function (m) {
            return m.exercice === exercice && m.statut === 'paye';
          });

          // Build map: projetId → sum of mandat montants
          var realiseMap = {};
          mandatsPaye.forEach(function (m) {
            if (m.projetId) {
              realiseMap[m.projetId] = (realiseMap[m.projetId] || 0) + (m.montant || 0);
            }
          });

          // Build sous-chapitre code map
          var scMap = {};
          sousChapitres.forEach(function (sc) {
            if (sc.id) scMap[sc.id] = sc.code || '';
          });

          // Separate by type
          var immobiliers = projets.filter(function (p) {
            return p.typeBien === 'immobilier';
          });
          var mobiliers = projets.filter(function (p) {
            return p.typeBien === 'mobilier' || p.typeBien === 'incorporel';
          });

          var communeNom = (mairie.nom || 'VAVOUA').replace(/^mairie de /i, '').toUpperCase();
          var content = '';

          // Title
          content +=
            '<div style="text-align:center; font-weight:bold; font-size:14px; margin-bottom:5px">';
          content += 'TABLEAU DES MODIFICATIONS PREVUES DANS LA COMPOSITION DU PATRIMOINE</div>';
          content +=
            '<div style="display:flex; justify-content:space-between; margin-bottom:10px; font-size:10px">';
          content += '<div>COMPTE ADMINISTRATIF</div>';
          content += '<div>ANNEE : ' + exercice + '</div>';
          content += '</div>';

          // Table
          content += '<table>';
          content += '<thead>';
          content += '<tr>';
          content += '<th rowspan="3" style="width:40px">N°<br>D\'ORD<br>RE</th>';
          content += '<th rowspan="3" style="width:45px">Ref.P<br>T 24-<br>26</th>';
          content += '<th rowspan="3" style="text-align:left; min-width:200px">DESCRIPTION</th>';
          content += '<th colspan="2" rowspan="2">COMPTES</th>';
          content += '<th colspan="2">ACQUISITIONS PREVUES</th>';
          content += '<th colspan="3">ALIENATION PREVUES</th>';
          content += '</tr>';
          content += '<tr>';
          content += '<th rowspan="2">MONTANT</th>';
          content += '<th rowspan="2">REALISES</th>';
          content += '<th colspan="2">comptes</th>';
          content += '<th rowspan="2">MONTANT</th>';
          content += '</tr>';
          content += '<tr>';
          content += '<th>Fonct</th>';
          content += '<th>Patrim</th>';
          content += '<th>Fonctionnel</th>';
          content += '<th>Patrimoniaux</th>';
          content += '</tr>';
          content += '</thead>';
          content += '<tbody>';

          var num = 0;
          var totalImmoMontant = 0,
            totalImmoRealise = 0,
            totalImmoAlienation = 0;
          var totalMobMontant = 0,
            totalMobRealise = 0,
            totalMobAlienation = 0;

          // IMMOBILIERS
          content += '<tr><td colspan="10" class="section-title">IMMOBILIERS</td></tr>';
          immobiliers.forEach(function (p) {
            num++;
            var realise = realiseMap[p.id] || 0;
            totalImmoMontant += p.montant || 0;
            totalImmoRealise += realise;
            totalImmoAlienation += p.alienationMontant || 0;
            content += '<tr>';
            content +=
              '<td class="col-center">' + (p.numeroOrdre != null ? p.numeroOrdre : '') + '</td>';
            content += '<td class="col-center">' + (p.refPT || '') + '</td>';
            content += '<td>' + (p.libelle || '') + '</td>';
            content += '<td class="col-center">' + (scMap[p.sousChapitreId] || '') + '</td>';
            content += '<td class="col-center">' + (p.patrimoine || '') + '</td>';
            content += '<td class="col-num">' + fmt(p.montant) + '</td>';
            content += '<td class="col-num">' + fmt(realise) + '</td>';
            content += '<td class="col-center">' + (p.alienationCompteFonctionnel || '') + '</td>';
            content += '<td class="col-center">' + (p.alienationComptePatrimonial || '') + '</td>';
            content += '<td class="col-num">' + fmt(p.alienationMontant) + '</td>';
            content += '</tr>';
          });
          content += '<tr class="total-row">';
          content += '<td colspan="5" class="col-center">Sous-total Immobiliers</td>';
          content += '<td class="col-num">' + fmt(totalImmoMontant) + '</td>';
          content += '<td class="col-num">' + fmt(totalImmoRealise) + '</td>';
          content += '<td></td><td></td>';
          content += '<td class="col-num">' + fmt(totalImmoAlienation) + '</td>';
          content += '</tr>';

          // MOBILIER
          content += '<tr><td colspan="10" class="section-title">MOBILIER</td></tr>';
          mobiliers.forEach(function (p) {
            num++;
            var realise = realiseMap[p.id] || 0;
            totalMobMontant += p.montant || 0;
            totalMobRealise += realise;
            totalMobAlienation += p.alienationMontant || 0;
            content += '<tr>';
            content +=
              '<td class="col-center">' + (p.numeroOrdre != null ? p.numeroOrdre : '') + '</td>';
            content += '<td class="col-center">' + (p.refPT || '') + '</td>';
            content += '<td>' + (p.libelle || '') + '</td>';
            content += '<td class="col-center">' + (scMap[p.sousChapitreId] || '') + '</td>';
            content += '<td class="col-center">' + (p.patrimoine || '') + '</td>';
            content += '<td class="col-num">' + fmt(p.montant) + '</td>';
            content += '<td class="col-num">' + fmt(realise) + '</td>';
            content += '<td class="col-center">' + (p.alienationCompteFonctionnel || '') + '</td>';
            content += '<td class="col-center">' + (p.alienationComptePatrimonial || '') + '</td>';
            content += '<td class="col-num">' + fmt(p.alienationMontant) + '</td>';
            content += '</tr>';
          });
          content += '<tr class="total-row">';
          content += '<td colspan="5" class="col-center">Sous-total mobiliers</td>';
          content += '<td class="col-num">' + fmt(totalMobMontant) + '</td>';
          content += '<td class="col-num">' + fmt(totalMobRealise) + '</td>';
          content += '<td></td><td></td>';
          content += '<td class="col-num">' + fmt(totalMobAlienation) + '</td>';
          content += '</tr>';

          // TOTAL GENERAL
          content += '<tr class="grand-total">';
          content += '<td colspan="5" class="col-center">TOTAL GENERAL</td>';
          content += '<td class="col-num">' + fmt(totalImmoMontant + totalMobMontant) + '</td>';
          content += '<td class="col-num">' + fmt(totalImmoRealise + totalMobRealise) + '</td>';
          content += '<td></td><td></td>';
          content +=
            '<td class="col-num">' + fmt(totalImmoAlienation + totalMobAlienation) + '</td>';
          content += '</tr>';

          content += '</tbody></table>';

          // Signatures
          var today = new Date();
          var dateStr = today.toLocaleDateString('fr-FR', {
            day: 'numeric',
            month: 'long',
            year: 'numeric',
          });
          content +=
            '<div style="display:flex; justify-content:space-between; padding:30px 50px 0; font-size:10px">';
          content += '<div style="text-align:center"><strong>LE TRESORIER PRINCIPAL</strong></div>';
          content +=
            '<div style="text-align:center">Fait a ' +
            (mairie.ville || 'VAVOUA').toUpperCase() +
            ' le, ' +
            dateStr +
            '<br><strong>LE MAIRE</strong></div>';
          content += '</div>';

          document.getElementById('content').innerHTML = content;
        } catch (e) {
          console.error('Erreur:', e);
          document.getElementById('content').innerHTML =
            '<div style="color:red;padding:20px">Erreur: ' + e.message + '</div>';
        }
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'FILL_COMPTE_ADMIN_DATA') loadAndRender();
      });
      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(loadAndRender, 500);
      });
    </script>
  </body>
</html>
