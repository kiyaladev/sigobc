<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Administratif - Depenses Investissement Engagees</title>
    <script src="../dexie.min.js"></script>
    <script src="../constanteInfo.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        margin: 0;
        padding: 10px;
      }
      .container { width: 100%; }
      .main-title {
        text-decoration: underline;
        font-size: 14px;
        margin: 5px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0;
      }
      th, td {
        border: 1px solid #000;
        padding: 3px 4px;
      }
      th {
        background-color: #f0f0f0;
        text-align: center;
        vertical-align: middle;
        font-size: 9px;
      }
      .col-code { width: 8%; text-align: center; }
      .col-libelle { width: 28%; text-align: left; }
      .col-num { width: 16%; text-align: right; white-space: nowrap; }
      .col-percent { width: 8%; text-align: center; }
      .col-center { text-align: center; }
      .section-header { background-color: #e0e0e0; font-weight: bold; }
      .total-section { background-color: #d0d0d0; font-weight: bold; border-top: 2px solid #000; }
      .grand-total { background-color: #bbb; font-weight: bold; border-top: 3px double #000; }
      .print-button {
        position: fixed; top: 20px; right: 20px; padding: 10px 20px;
        background: #009688; color: white; border: none; border-radius: 5px;
        cursor: pointer; font-size: 14px; z-index: 1000;
      }
      .print-button:hover { background: #00796B; }
      .loading { text-align: center; padding: 50px; font-size: 16px; color: #666; }
      @media print {
        .no-print { display: none !important; }
        body { padding: 0; }
      }
    </style>
  </head>
  <body>
    <button class="print-button no-print" onclick="window.print()">Imprimer</button>
    <div class="container">
      <div id="content">
        <div class="loading" id="loading">Chargement des donnees...</div>
      </div>
    </div>

    <script>
      function fmt(v) { return (v && v !== 0) ? new Intl.NumberFormat('fr-FR').format(v) : '-'; }
      function pct(real, prev) { return prev && prev > 0 ? ((real / prev) * 100).toFixed(2).replace('.', ',') : '-'; }

      const sectionLabels = {
        '90': 'SECTION 90 - EQUIPEMENT DES SERVICES GENERAUX',
        '91': 'SECTION 91 - EQUIPEMENT DES SERVICES DE COLLECTIVITE',
        '92': 'SECTION 92 - URBANISME ET ASSAINISSEMENT',
        '93': 'SECTION 93 - INVESTISSEMENTS FINANCIERS',
        '94': 'SECTION 94 - REMBOURSEMENT EMPRUNTS',
        '95': 'SECTION 95 - DEPENSES DIVERSES'
      };

      async function loadAndRender() {
        try {
        let db;
        try {
          db = new Dexie('TresorOfflineDB');
          await db.open();
        } catch (_e) {
          db = new Dexie('TresorDatabase');
          await db.open();
        }

        let exercice = new Date().getFullYear();
        try {
          var pd = await db.table('printData').toArray();
          var latest = pd.filter(p => p.type === 'FILL_COMPTE_ADMIN_DATA').sort((a,b) => b.createdAt - a.createdAt)[0];
          if (latest && latest.data && latest.data.exercice) exercice = latest.data.exercice;
        } catch(e) {}

        var params = new URLSearchParams(window.location.search);
        if (params.get('exercice')) exercice = parseInt(params.get('exercice'));

        const [sousChapitres, allPrevisions, allMandats] = await Promise.all([
          db.table('sousChapitres').toArray(),
          db.table('previsions').toArray(),
          db.table('mandats').toArray(),
        ]);
        const mairie = MAIRIE_INFO;
        const previsions = allPrevisions.filter(p => p.exercice === exercice);
        const mandats = allMandats.filter(m => m.exercice === exercice);

        const investSC = sousChapitres.filter(sc => sc.code && sc.code.startsWith('9'));

        const prevMap = {};
        previsions.forEach(p => {
          if (p.sousChapitreId) prevMap[p.sousChapitreId] = (prevMap[p.sousChapitreId] || 0) + (p.montantPrevu || 0);
        });

        const engMap = {};
        const mandatMap = {};
        mandats.forEach(m => {
          if (m.statut === 'annule') return;
          if (m.sousChapitreId) {
            engMap[m.sousChapitreId] = (engMap[m.sousChapitreId] || 0) + (m.montant || 0);
            if (m.statut === 'mandate' || m.statut === 'paye') {
              mandatMap[m.sousChapitreId] = (mandatMap[m.sousChapitreId] || 0) + (m.montant || 0);
            }
          }
        });

        var tbodyHtml = '';
        var tGeneralP = 0, tGeneralE = 0, tGeneralM = 0;

        var sections = {};
        investSC.forEach(sc => {
          var sec = sc.code.substring(0, 2);
          if (!sections[sec]) sections[sec] = [];
          sections[sec].push(sc);
        });

        Object.keys(sections).sort().forEach(sec => {
          tbodyHtml += `<tr><td colspan="9" style="font-weight: bold; font-size: 11px; text-decoration: underline; background-color: #e0e0e0;">${sectionLabels[sec] || 'SECTION ' + sec}</td></tr>`;

          var scs = sections[sec].sort((a,b) => a.code.localeCompare(b.code));
          var chapitres = {};
          scs.forEach(sc => {
            var chap = sc.code.substring(0, 3);
            if (!chapitres[chap]) chapitres[chap] = [];
            chapitres[chap].push(sc);
          });

          var secPrev = 0, secEng = 0, secMand = 0;

          Object.keys(chapitres).sort().forEach(chap => {
            tbodyHtml += `<tr><td colspan="9" style="font-weight: bold; font-size: 10px; text-decoration: underline;">CHAPITRE ${chap}</td></tr>`;

            var chapPrev = 0, chapEng = 0, chapMand = 0;

            chapitres[chap].forEach(sc => {
              var p = prevMap[sc.id] || 0;
              var e = engMap[sc.id] || 0;
              var m = mandatMap[sc.id] || 0;
              chapPrev += p; chapEng += e; chapMand += m;

              tbodyHtml += `<tr>
                <td style="padding-left: 10px;">${sc.code} - ${sc.libelle || ''}</td>
                <td class="col-num">${fmt(p)}</td>
                <td class="col-num">${fmt(e)}</td>
                <td class="col-center">${pct(e, p)}</td>
                <td class="col-num">${fmt(m)}</td>
                <td class="col-center">-</td>
                <td class="col-center">-</td>
                <td class="col-center">-</td>
                <td class="col-center">-</td>
              </tr>`;
            });

            tbodyHtml += `<tr style="font-weight: bold; background-color: #f1f1f1;">
              <td style="text-align: center;">SOUS TOTAL CHAPITRE ${chap}</td>
              <td class="col-num">${fmt(chapPrev)}</td>
              <td class="col-num">${fmt(chapEng)}</td>
              <td class="col-center">${pct(chapEng, chapPrev)}</td>
              <td class="col-num">${fmt(chapMand)}</td>
              <td class="col-center">-</td>
              <td class="col-center">-</td>
              <td class="col-center">-</td>
              <td class="col-center">-</td>
            </tr>`;

            secPrev += chapPrev; secEng += chapEng; secMand += chapMand;
          });

          tbodyHtml += `<tr style="font-weight: bold; background-color: #e8e8e8;">
            <td style="text-align: center;">TOTAL SECTION ${sec}</td>
            <td class="col-num">${fmt(secPrev)}</td>
            <td class="col-num">${fmt(secEng)}</td>
            <td class="col-center">${pct(secEng, secPrev)}</td>
            <td class="col-num">${fmt(secMand)}</td>
            <td class="col-center">-</td>
            <td class="col-center">-</td>
            <td class="col-center">-</td>
            <td class="col-center">-</td>
          </tr>`;

          tGeneralP += secPrev;
          tGeneralE += secEng;
          tGeneralM += secMand;
        });

        tbodyHtml += `<tr style="font-weight: bold; background-color: #d8d8d8; border-top: 2px solid #000;">
          <td style="text-align: center;">TOTAL GENERAL DES DEPENSES AU TITRE II</td>
          <td class="col-num">${fmt(tGeneralP)}</td>
          <td class="col-num">${fmt(tGeneralE)}</td>
          <td class="col-center">${pct(tGeneralE, tGeneralP)}</td>
          <td class="col-num">${fmt(tGeneralM)}</td>
          <td class="col-center">-</td>
          <td class="col-center">-</td>
          <td class="col-center">-</td>
          <td class="col-center">-</td>
        </tr>`;

        const nomMairie = (mairie.nom || MAIRIE_INFO.nom).replace(/^mairie de /i, '').toUpperCase();

        const contentHtml = `
          <table style="table-layout:fixed">
            <colgroup>
              <col style="width:26%"><col style="width:9%"><col style="width:9%"><col style="width:8%"><col style="width:9%">
              <col style="width:8%"><col style="width:9%"><col style="width:11%"><col style="width:11%">
            </colgroup>
            <thead>
              <tr>
                <th rowspan="4" style="text-align:center; vertical-align:middle; font-size:10px;">COMPTES ET RUBRIQUES<br>BUDGETAIRES</th>
                <th rowspan="4" style="text-align:center; vertical-align:middle; font-size:9px;">PREVISIONS</th>
                <th colspan="5" style="text-align:center; padding:8px; font-size:12px; font-weight:bold;">COMPTE ADMINISTRATIF DEPENSES D'INVESTISSEMENT</th>
                <th style="text-align:center; padding:4px; font-size:9px;">ANNEE<br><b>${exercice}</b></th>
                <th style="text-align:center; padding:4px; font-size:9px;">N&deg;<br><b>&nbsp;</b></th>
              </tr>
              <tr>
                <th rowspan="3" style="text-align:center; font-size:8px; vertical-align:middle;">DEPENSES<br>ENGAGEES</th>
                <th rowspan="3" style="text-align:center; font-size:8px; vertical-align:middle;">% E/P</th>
                <th rowspan="3" style="text-align:center; font-size:8px; vertical-align:middle;">DEPENSES<br>MANDATEES</th>
                <th colspan="4" style="text-align:center; font-size:9px;">ENGAGEMENTS NON MANDATES</th>
              </tr>
              <tr>
                <th rowspan="2" style="text-align:center; font-size:7px; vertical-align:middle;">COMMANDES<br>NON<br>LIVREES</th>
                <th rowspan="2" style="text-align:center; font-size:7px; vertical-align:middle;">COMMANDES<br>LIVREES NON<br>FACTUREES</th>
                <th rowspan="2" style="text-align:center; font-size:7px; vertical-align:middle;">COMMANDES<br>FACTUREES</th>
                <th rowspan="2" style="text-align:center; font-size:8px; vertical-align:middle;">T O T A L<br>(6+7+8)</th>
              </tr>
              <tr></tr>
              <tr style="font-size:9px;">
                <th style="background-color:#fff; border-bottom:2px solid #000;">1</th>
                <th style="background-color:#fff; border-bottom:2px solid #000;">2</th>
                <th style="background-color:#fff; border-bottom:2px solid #000;">3</th>
                <th style="background-color:#fff; border-bottom:2px solid #000;">4</th>
                <th style="background-color:#fff; border-bottom:2px solid #000;">5</th>
                <th style="background-color:#fff; border-bottom:2px solid #000;">6</th>
                <th style="background-color:#fff; border-bottom:2px solid #000;">7</th>
                <th style="background-color:#fff; border-bottom:2px solid #000;">8</th>
                <th style="background-color:#fff; border-bottom:2px solid #000;">9</th>
              </tr>
            </thead>
            <tbody>
              ${tbodyHtml}
            </tbody>
          </table>
        `;
        document.getElementById('content').innerHTML = contentHtml;
        } catch (e) {
          console.error('Erreur chargement:', e);
          document.getElementById('content').innerHTML =
            '<div style="color:red;padding:20px;font-size:14px">Erreur: ' + e.message + '<br><pre>' + e.stack + '</pre></div>';
        }
      }

      window.addEventListener('message', function(event) {
        if (event.data && event.data.type === 'FILL_COMPTE_ADMIN_DATA') {
          loadAndRender();
        }
      });

      window.addEventListener('DOMContentLoaded', function() {
        setTimeout(loadAndRender, 500);
      });
    </script>
  </body>
</html>
