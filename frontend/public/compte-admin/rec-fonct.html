<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Administratif - Recettes Fonctionnement</title>
    <script src="../dexie.min.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        margin: 0;
        padding: 10px;
      }
      .container {
        width: 100%;
      }
      .doc-header {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        border: 1px solid #000;
        margin-bottom: 10px;
      }
      .doc-header-block {
        padding: 6px 8px;
        min-height: 60px;
      }
      .doc-header-block + .doc-header-block {
        border-left: 1px solid #000;
      }
      .doc-header-left {
        text-align: left;
        font-weight: bold;
      }
      .doc-header-center {
        text-align: center;
        font-weight: bold;
      }
      .doc-header-right {
        text-align: right;
        font-weight: bold;
      }
      .main-title {
        text-decoration: underline;
        font-size: 14px;
        margin: 4px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 3px 5px;
      }
      th {
        background-color: #f0f0f0;
        text-align: center;
        vertical-align: middle;
        font-size: 9px;
      }
      .col-code {
        width: 8%;
        text-align: center;
      }
      .col-libelle {
        width: 28%;
        text-align: left;
      }
      .col-num {
        text-align: right;
        white-space: nowrap;
        width: 13%;
      }
      .col-percent {
        text-align: center;
        width: 8%;
      }
      .section-header {
        background-color: #d4edda;
        font-weight: bold;
      }
      .sous-total {
        background-color: #e8f5e9;
        font-weight: bold;
        font-style: italic;
      }
      .total-row {
        background-color: #c8e6c9;
        font-weight: bold;
        border-top: 2px solid #000;
      }
      .signatures {
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
        padding: 0 50px;
      }
      .signature-box {
        text-align: center;
        width: 200px;
      }
      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 24px;
        background-color: #1976d2;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }
      .print-button:hover {
        background-color: #1565c0;
      }
      .loading {
        text-align: center;
        padding: 50px;
        font-size: 16px;
        color: #666;
      }
      .print-footer {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      @media print {
        body {
          padding: 0;
        }
        .no-print {
          display: none;
        }
        .print-footer {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <button class="print-button no-print" onclick="window.print()">Imprimer</button>
    <div class="container">
      <div id="content">
        <div class="loading">Chargement des données...</div>
      </div>
    </div>

    <script>
      function fmt(v) {
        return v ? new Intl.NumberFormat('fr-FR').format(Math.round(v)) : '0';
      }

      function renderPage(data) {
        var exercice = data.exercice || new Date().getFullYear();
        var mairie = data.mairie || {};
        var lignes = data.lignesRecettes || [];

        var content = document.getElementById('content');
        content.innerHTML = '';

        var communeNom = (mairie.nom || 'VAVOUA').replace(/^mairie de /i, '').toUpperCase();

        content.innerHTML = '<table style="border: none; margin-bottom: 5px;">'
          + '<tr><td style="width: 30%; font-weight: bold; text-align: center; border: 1px solid #000;">COMMUNE DE ' + communeNom + '</td>'
          + '<td style="width: 50%; font-weight: bold; text-align: center; border: 1px solid #000;">COMPTE ADMINISTRATIF - RECETTES DE FONCTIONNEMENT</td>'
          + '<td style="width: 15%; font-weight: bold; text-align: center; border: 1px solid #000;">ANNEE<br>' + exercice + '</td>'
          + '<td style="width: 5%; font-weight: bold; text-align: center; border: 1px solid #000;">N&deg;<br>4</td></tr></table>'
          + '<table><thead>'
          + '<tr><th rowspan="2" style="width: 30%; text-align: center;">COMPTES ET RUBRIQUES BUDGETAIRES</th>'
          + '<th rowspan="2" style="width: 10%;">PREVISIONS</th><th colspan="4">EXECUTION DU BUDGET</th>'
          + '<th rowspan="2" style="width: 10%;">ECART<br>PREVISIONS<br>EMISSIONS</th>'
          + '<th rowspan="2" style="width: 5%;">E/P %</th></tr>'
          + '<tr><th style="width: 10%;">EMISSIONS</th><th style="width: 10%;">RECOUVREMENT</th>'
          + '<th style="width: 10%;">NON VALEUR</th><th style="width: 10%;">RESTE A<br>RECOUVRER</th></tr>'
          + '</thead><tbody id="table-body"></tbody></table>';

        var tbody = document.getElementById('table-body');

        // Organize hierarchy
        var sections = {};
        var chapitresMap = {};

        lignes.forEach(function (l) {
          var c = l.code || '';
          var secCode = c.substring(0, 2);
          var chapCode = c.substring(0, 3);

          if (!sections[secCode]) {
            sections[secCode] = { label: 'SECTION ' + secCode, prev: 0, emis: 0, rec: 0, chapitres: {} };
          }
          if (c.length >= 3 && !sections[secCode].chapitres[chapCode]) {
            sections[secCode].chapitres[chapCode] = {
              label: chapitresMap[chapCode] || 'Chap ' + chapCode,
              prev: 0, emis: 0, rec: 0, articles: [],
            };
          }
          if (c.length >= 4) {
            sections[secCode].chapitres[chapCode].articles.push(l);
            var prev = l.previsions || 0;
            var emis = l.emissions || 0;
            var rec = l.recouvrements || 0;
            sections[secCode].chapitres[chapCode].prev += prev;
            sections[secCode].chapitres[chapCode].emis += emis;
            sections[secCode].chapitres[chapCode].rec += rec;
            sections[secCode].prev += prev;
            sections[secCode].emis += emis;
            sections[secCode].rec += rec;
          }
        });

        function dashFormat(v) { return v && v !== 0 ? fmt(v) : '-'; }

        var grandPrev = 0, grandEmis = 0, grandRec = 0;
        var htmlRows = '';

        Object.keys(sections).sort().forEach(function (secCode) {
          var sec = sections[secCode];
          if (sec.prev === 0 && sec.emis === 0 && sec.rec === 0) return;

          htmlRows += '<tr class="section-header"><td colspan="8" style="text-align: left; text-decoration: underline;"><strong>' + sec.label + '</strong></td></tr>';

          Object.keys(sec.chapitres).sort().forEach(function (chapCode) {
            var chap = sec.chapitres[chapCode];
            if (chap.articles.length === 0) return;

            htmlRows += '<tr><td colspan="8" style="text-align: left; text-decoration: underline;"><strong>' + chap.label + '</strong></td></tr>';

            chap.articles.sort(function (a, b) { return (a.code || '').localeCompare(b.code || ''); }).forEach(function (art) {
              var p = art.previsions || 0, e = art.emissions || 0, r = art.recouvrements || 0;
              var reste = Math.max(0, e - r);
              var ecart = p - e;
              var pctVal = p > 0 ? Math.round((r / p) * 100) + '%' : r > 0 ? '-' : '';
              htmlRows += '<tr><td style="text-align: left;">' + art.code + ' - ' + (art.libelle || '') + '</td>'
                + '<td class="col-num">' + dashFormat(p) + '</td><td class="col-num">' + dashFormat(e) + '</td>'
                + '<td class="col-num">' + dashFormat(r) + '</td><td class="col-num">-</td>'
                + '<td class="col-num">' + dashFormat(reste) + '</td><td class="col-num">' + dashFormat(ecart) + '</td>'
                + '<td style="text-align: center;">' + pctVal + '</td></tr>';
            });

            var chapReste = Math.max(0, chap.emis - chap.rec);
            var chapEcart = chap.prev - chap.emis;
            var chapPct = chap.prev > 0 ? Math.round((chap.rec / chap.prev) * 100) + '%' : '';
            htmlRows += '<tr style="font-weight: bold; background-color: #f9f9f9;">'
              + '<td style="text-align: center;">TOTAL CHAPITRE ' + chapCode + '</td>'
              + '<td class="col-num">' + dashFormat(chap.prev) + '</td><td class="col-num">' + dashFormat(chap.emis) + '</td>'
              + '<td class="col-num">' + dashFormat(chap.rec) + '</td><td class="col-num">-</td>'
              + '<td class="col-num">' + dashFormat(chapReste) + '</td><td class="col-num">' + dashFormat(chapEcart) + '</td>'
              + '<td style="text-align: center;">' + chapPct + '</td></tr>';
          });

          var secReste = Math.max(0, sec.emis - sec.rec);
          var secEcart = sec.prev - sec.emis;
          var secPct = sec.prev > 0 ? Math.round((sec.rec / sec.prev) * 100) + '%' : '';
          htmlRows += '<tr style="font-weight: bold; background-color: #ededed;">'
            + '<td style="text-align: center;">TOTAL SECTION ' + secCode + '</td>'
            + '<td class="col-num">' + dashFormat(sec.prev) + '</td><td class="col-num">' + dashFormat(sec.emis) + '</td>'
            + '<td class="col-num">' + dashFormat(sec.rec) + '</td><td class="col-num">-</td>'
            + '<td class="col-num">' + dashFormat(secReste) + '</td><td class="col-num">' + dashFormat(secEcart) + '</td>'
            + '<td style="text-align: center;">' + secPct + '</td></tr>';

          grandPrev += sec.prev;
          grandEmis += sec.emis;
          grandRec += sec.rec;
        });

        var grandReste = Math.max(0, grandEmis - grandRec);
        var grandEcart = grandPrev - grandEmis;
        var grandPct = grandPrev > 0 ? (Math.round((grandRec / grandPrev) * 10000) / 100).toFixed(2) : '0.00';
        htmlRows += '<tr style="font-weight: bold; background-color: #e0e0e0;">'
          + '<td style="text-align: center;">TOTAL GENERAL DES RECETTES AU TITRE I</td>'
          + '<td class="col-num">' + dashFormat(grandPrev) + '</td><td class="col-num">' + dashFormat(grandEmis) + '</td>'
          + '<td class="col-num">' + dashFormat(grandRec) + '</td><td class="col-num">0</td>'
          + '<td class="col-num">' + dashFormat(grandReste) + '</td><td class="col-num">' + dashFormat(grandEcart) + '</td>'
          + '<td style="text-align: center;">' + grandPct + '</td></tr>';

        tbody.innerHTML = htmlRows;
        content.insertAdjacentHTML('beforeend', '<div style="margin-top: 40px; margin-right: 50px; text-align: right; font-weight: bold;">Le Maire</div>');
        document.title = 'Compte Administratif - Recettes Fonctionnement - ' + exercice;
      }

      // Load data directly from IndexedDB
      async function loadAndRender() {
        try {
          let db;
          try {
            db = new Dexie('TresorOfflineDB');
            await db.open();
          } catch (_e) {
            db = new Dexie('TresorDatabase');
            await db.open();
          }

          var exercice = new Date().getFullYear();

          // Check printData
          try {
            var pd = await db.table('printData').toArray();
            var latest = pd.filter(function (p) { return p.type === 'FILL_COMPTE_ADMIN_DATA'; })
              .sort(function (a, b) { return b.createdAt - a.createdAt; })[0];
            if (latest && latest.data && latest.data.exercice) exercice = latest.data.exercice;
          } catch (e) {}

          var params = new URLSearchParams(window.location.search);
          if (params.get('exercice')) exercice = parseInt(params.get('exercice'));

          var mairie = (await db.table('mairies').toCollection().first()) || {};
          var allTaxes = await db.table('taxes').toArray();
          var allPrevRec = await db.table('previsionsRecettes').toArray();
          var previsionsRecettes = allPrevRec.filter(function (p) { return p.exercice === exercice; });
          var allDecl = await db.table('declarations').toArray();
          var declarations = allDecl.filter(function (d) { return d.exercice === exercice && d.statut === 'validee'; });

          // Build per-tax aggregation for codes starting with 7
          var taxAggregation = {};
          allTaxes.forEach(function (t) {
            if (!(t.code || '').startsWith('7')) return;
            taxAggregation[t.id] = { code: t.code, libelle: t.libelle, previsions: 0, emissions: 0, recouvrements: 0 };
          });

          previsionsRecettes.forEach(function (pr) {
            if (taxAggregation[pr.taxeId]) taxAggregation[pr.taxeId].previsions += pr.montantPrevu || 0;
          });

          declarations.forEach(function (d) {
            if (!taxAggregation[d.taxeId]) return;
            var montant = d.montant || d.montantRecette || 0;
            taxAggregation[d.taxeId].emissions += montant;
            if (d.dateEncaissement) taxAggregation[d.taxeId].recouvrements += montant;
          });

          renderPage({
            exercice: exercice,
            mairie: mairie,
            lignesRecettes: Object.values(taxAggregation),
          });
        } catch (e) {
          console.error('[RecFonct] Erreur:', e);
          document.getElementById('content').innerHTML = '<div style="color:red;padding:20px">Erreur: ' + e.message + '</div>';
        }
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'FILL_COMPTE_ADMIN_DATA') {
          loadAndRender();
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(loadAndRender, 500);
      });
    </script>
  </body>
</html>
