<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Administratif - Récapitulatif Investissement</title>
    <script src="../dexie.min.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        margin: 0;
        padding: 10px;
      }
      .text-right {
        text-align: right;
      }
      .text-center {
        text-align: center;
      }
      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 20px;
        background-color: #009688;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        z-index: 1000;
      }
      .print-button:hover {
        background-color: #00796b;
      }
      .loading {
        text-align: center;
        padding: 50px;
        font-size: 16px;
        color: #666;
      }
      @media print {
        body {
          padding: 0;
        }
        .no-print {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <button class="print-button no-print" onclick="window.print()">Imprimer</button>
    <div id="content">
      <div class="loading">Chargement des données...</div>
    </div>

    <script>
      function fmt(v) {
        return v ? new Intl.NumberFormat('fr-FR').format(Math.round(v)) : '-';
      }
      function pct(real, prev) {
        if (!prev || prev === 0) return '-';
        return ((real / prev) * 100).toFixed(2);
      }

      const sectionsRecettesInv = {
        '01': "01 - PRODUITS DE L'ALIENATION DES BIENS DU PATRIMOINE",
        '02': "02 - PRELEVEMENTS SUR FONDS D'INVESTISSEMENT",
        '03': "03 - RECETTES D'EMPRUNTS",
        '04': "04 - AIDE DE L'ETAT, FONDS DE CONCOURS, AIDES EXTERIEURES",
        '05': '05 - TRANSFERTS ET OPERATIONS FINANCIERES',
        '06': '06 - RECETTES DIVERS AU TITRE II',
      };

      const sectionsDepensesInv = {
        90: '90 - EQUIPEMENT DES SERVICES GENERAUX',
        91: '91 - EQUIPEMENT DES SERVICES DE COLLECTIVITE',
        92: '92 - EQUIPEMENT DES SERVICES SOCIOCULTURELS ET DE PROMOTION HUMAINE',
        93: '93 - EQUIPEMENT DES SERVICES ECONOMIQUES',
        94: '94 - TRANSFERTS ET OPERATIONS FINANCIERES',
        95: "95 - VERSEMENT AUX FONDS D'INVESTISSEMENT",
      };

      function renderPage(data) {
        const exercice = data.exercice || new Date().getFullYear();
        const mairie = data.mairie || {};
        const mairieNom = mairie.nom ? mairie.nom.replace(/^mairie de /i, '').toUpperCase() : 'VAVOUA';

        // Build recettes rows
        let totalRecPrev = 0, totalRecReal = 0;
        const recettesInvData = data.recettesInv || {};
        var recRows = '';
        for (const code of Object.keys(sectionsRecettesInv)) {
          const sec = recettesInvData[code] || { previsions: 0, realisations: 0 };
          totalRecPrev += sec.previsions || 0;
          totalRecReal += sec.realisations || 0;
          const ecart = (sec.previsions || 0) - (sec.realisations || 0);
          recRows += '<tr>'
            + '<td colspan="2" style="padding:4px; border:1px solid #000">' + sectionsRecettesInv[code] + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(sec.previsions) + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(sec.realisations) + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(sec.realisations) + '</td>'
            + '<td class="text-center" style="padding:4px; border:1px solid #000">-</td>'
            + '<td class="text-center" style="padding:4px; border:1px solid #000">-</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(ecart > 0 ? ecart : 0) + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000">' + pct(sec.realisations, sec.previsions) + '</td>'
            + '</tr>';
        }
        const totalRecEcart = totalRecPrev - totalRecReal;

        // Build depenses rows
        let totalDepPrev = 0, totalDepReal = 0;
        const depensesInvData = data.depensesInv || {};
        var depRows = '';
        for (const code of Object.keys(sectionsDepensesInv)) {
          const sec = depensesInvData[code] || { previsions: 0, realisations: 0 };
          totalDepPrev += sec.previsions || 0;
          totalDepReal += sec.realisations || 0;
          depRows += '<tr>'
            + '<td style="padding:4px; border:1px solid #000">' + sectionsDepensesInv[code] + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(sec.previsions) + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(sec.realisations) + '</td>'
            + '<td class="text-center" style="padding:4px; border:1px solid #000">' + pct(sec.realisations, sec.previsions) + '</td>'
            + '<td class="text-right" style="padding:4px; border:1px solid #000">' + fmt(sec.realisations) + '</td>'
            + '<td class="text-center" style="padding:4px; border:1px solid #000">-</td>'
            + '<td class="text-center" style="padding:4px; border:1px solid #000">-</td>'
            + '<td class="text-center" style="padding:4px; border:1px solid #000">-</td>'
            + '<td class="text-center" style="padding:4px; border:1px solid #000">-</td>'
            + '</tr>';
        }

        var html = '<table style="width:100%; border-collapse:collapse; table-layout:fixed">'
          + '<colgroup>'
          + '<col style="width:25%"><col style="width:9%"><col style="width:9%"><col style="width:9%"><col style="width:10%">'
          + '<col style="width:7%"><col style="width:8%"><col style="width:12%"><col style="width:11%">'
          + '</colgroup>'
          // Document header
          + '<tr>'
          + '<td style="text-align:center; font-weight:bold; padding:6px; border:1px solid #000">COMMUNE DE ' + mairieNom + '</td>'
          + '<td colspan="6" style="text-align:center; font-weight:bold; font-size:14px; padding:6px; border:1px solid #000">COMPTE ADMINISTRATIF &nbsp;-&nbsp; RECAPITULATION</td>'
          + '<td style="text-align:center; padding:4px; border:1px solid #000; font-size:9px">ANNEE<br><b>' + exercice + '</b></td>'
          + '<td style="text-align:center; padding:4px; border:1px solid #000; font-size:9px">N&deg;<br><b>26</b></td>'
          + '</tr>'
          // Titre
          + '<tr><td colspan="9" style="text-align:center; font-weight:bold; font-size:16px; padding:12px 0; border:1px solid #000; letter-spacing:2px">TITRE &nbsp;II &nbsp;- &nbsp;BUDGET D\'INVESTISSEMENT</td></tr>'
          // RECETTES D'INVESTISSEMENT title
          + '<tr><td colspan="9" style="text-align:center; font-weight:bold; font-size:11px; padding:6px; border:1px solid #000; letter-spacing:4px">RECETTES &nbsp;&nbsp;D\'INVESTISSEMENT</td></tr>'
          // Recettes header row 1
          + '<tr>'
          + '<th colspan="2" rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px">SECTIONS BUDGETAIRES</th>'
          + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px">PREVISIONS</th>'
          + '<th colspan="4" style="border:1px solid #000; padding:3px; text-align:center; font-size:9px">EXECUTION DU BUDGET</th>'
          + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px">ECART<br>PREVISION<br>EMISSION</th>'
          + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px">E / P &nbsp;&nbsp;%</th>'
          + '</tr>'
          // Recettes header row 2
          + '<tr>'
          + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:9px">EMISSIONS</th>'
          + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:9px">RECOUVREMENT</th>'
          + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:9px">NON VALEUR</th>'
          + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:9px">RESTE A<br>RECOUVRER</th>'
          + '</tr>'
          // Blank spacer + RECETTES label
          + '<tr>'
          + '<td colspan="2" style="padding:6px 4px; border:1px solid #000; font-weight:bold; text-align:center; text-decoration:underline">RECETTES</td>'
          + '<td style="border:1px solid #000"></td><td style="border:1px solid #000"></td><td style="border:1px solid #000"></td>'
          + '<td style="border:1px solid #000"></td><td style="border:1px solid #000"></td><td style="border:1px solid #000"></td><td style="border:1px solid #000"></td>'
          + '</tr>'
          // Recettes data
          + recRows
          // Total recettes
          + '<tr style="font-weight:bold">'
          + '<td colspan="2" style="text-align:center; padding:4px; border:1px solid #000; font-size:10px">TOTAL GENERAL DES RECETTES</td>'
          + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(totalRecPrev) + '</td>'
          + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(totalRecReal) + '</td>'
          + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(totalRecReal) + '</td>'
          + '<td class="text-center" style="padding:4px; border:1px solid #000; font-size:10px">-</td>'
          + '<td class="text-center" style="padding:4px; border:1px solid #000; font-size:10px">-</td>'
          + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(totalRecEcart > 0 ? totalRecEcart : 0) + '</td>'
          + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + pct(totalRecReal, totalRecPrev) + '</td>'
          + '</tr>'
          // DEPENSES D'INVESTISSEMENT title
          + '<tr><td colspan="9" style="text-align:center; font-weight:bold; font-size:11px; padding:6px; border:1px solid #000; letter-spacing:4px">DEPENSES &nbsp;&nbsp;D\'INVESTISSEMENT</td></tr>'
          // Depenses header row 1
          + '<tr>'
          + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px">COMPTES ET RUBRIQUES BUDGETAIRES</th>'
          + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px">PREVISION</th>'
          + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px">DEPENSES ENGAGEES</th>'
          + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px">POURCENTAGE<br>REALISATION</th>'
          + '<th rowspan="2" style="border:1px solid #000; padding:3px; text-align:center; vertical-align:middle; font-size:9px">DEPENSES<br>MANDATEES</th>'
          + '<th colspan="4" style="border:1px solid #000; padding:3px; text-align:center; font-size:9px">ENGAGEMENTS NON MANDATES</th>'
          + '</tr>'
          // Depenses header row 2
          + '<tr>'
          + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:8px">COMMANDES NON<br>LIVREES</th>'
          + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:8px">COMMANDES<br>LIVREES NON<br>FACTUREES</th>'
          + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:8px">COMMANDES FACTUREES</th>'
          + '<th style="border:1px solid #000; padding:3px; text-align:center; font-size:8px">TOTAL<br>(6 + 7 + 8)</th>'
          + '</tr>'
          // Column numbers row
          + '<tr>'
          + '<td style="text-align:center; font-size:8px; font-weight:bold; border:1px solid #000; padding:2px">1</td>'
          + '<td style="text-align:center; font-size:8px; font-weight:bold; border:1px solid #000; padding:2px">2</td>'
          + '<td style="text-align:center; font-size:8px; font-weight:bold; border:1px solid #000; padding:2px">3</td>'
          + '<td style="text-align:center; font-size:8px; font-weight:bold; border:1px solid #000; padding:2px">4</td>'
          + '<td style="text-align:center; font-size:8px; font-weight:bold; border:1px solid #000; padding:2px">5</td>'
          + '<td style="text-align:center; font-size:8px; font-weight:bold; border:1px solid #000; padding:2px">6</td>'
          + '<td style="text-align:center; font-size:8px; font-weight:bold; border:1px solid #000; padding:2px">7</td>'
          + '<td style="text-align:center; font-size:8px; font-weight:bold; border:1px solid #000; padding:2px">8</td>'
          + '<td style="text-align:center; font-size:8px; font-weight:bold; border:1px solid #000; padding:2px">9</td>'
          + '</tr>'
          // Blank spacer + DEPENSES label
          + '<tr>'
          + '<td style="padding:6px 4px; border:1px solid #000; font-weight:bold; text-align:center; text-decoration:underline">DEPENSES</td>'
          + '<td style="border:1px solid #000"></td><td style="border:1px solid #000"></td><td style="border:1px solid #000"></td>'
          + '<td style="border:1px solid #000"></td><td style="border:1px solid #000"></td><td style="border:1px solid #000"></td>'
          + '<td style="border:1px solid #000"></td><td style="border:1px solid #000"></td>'
          + '</tr>'
          // Depenses data
          + depRows
          // Total depenses
          + '<tr style="font-weight:bold">'
          + '<td style="text-align:center; padding:4px; border:1px solid #000; font-size:10px">TOTAL GENERAL DES DEPENSES</td>'
          + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(totalDepPrev) + '</td>'
          + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(totalDepReal) + '</td>'
          + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + pct(totalDepReal, totalDepPrev) + '</td>'
          + '<td class="text-right" style="padding:4px; border:1px solid #000; font-size:10px">' + fmt(totalDepReal) + '</td>'
          + '<td class="text-center" style="padding:4px; border:1px solid #000; font-size:10px">-</td>'
          + '<td class="text-center" style="padding:4px; border:1px solid #000; font-size:10px">-</td>'
          + '<td class="text-center" style="padding:4px; border:1px solid #000; font-size:10px">-</td>'
          + '<td class="text-center" style="padding:4px; border:1px solid #000; font-size:10px">-</td>'
          + '</tr>'
          + '</table>';

        document.getElementById('content').innerHTML = html;
        document.title = 'Compte Administratif - Récapitulatif Investissement - ' + exercice;
      }

      async function loadAndRender() {
        try {
          let db;
          try {
            db = new Dexie('TresorOfflineDB');
            await db.open();
          } catch (_e) {
            db = new Dexie('TresorDatabase');
            await db.open();
          }

          var params = new URLSearchParams(window.location.search);
          var exercice = parseInt(params.get('exercice')) || new Date().getFullYear();
          var mairieId = parseInt(params.get('mairieId')) || 1;

          var mairie = await db.table('mairies').get(mairieId);
          mairie = mairie || {};
          var allTaxes = await db.table('taxes').toArray();
          var allPrevisionsRecettes = await db.table('previsionsRecettes').toArray();
          allPrevisionsRecettes = allPrevisionsRecettes.filter(function(r) { return r.exercice === exercice; });
          var allDeclarations = await db.table('declarations').toArray();
          allDeclarations = allDeclarations.filter(function(d) { return d.exercice === exercice; });
          var allSousChapitres = await db.table('sousChapitres').toArray();
          var allPrevisions = await db.table('previsions').toArray();
          allPrevisions = allPrevisions.filter(function(p) { return p.exercice === exercice; });
          var allMandats = await db.table('mandats').toArray();
          allMandats = allMandats.filter(function(m) { return m.exercice === exercice; });

          var taxMap = {};
          allTaxes.forEach(function (t) {
            taxMap[t.id] = t;
          });

          var scMap = {};
          allSousChapitres.forEach(function (sc) {
            scMap[sc.id] = sc;
          });

          // Recettes investissement: group taxes by code prefix 01-06
          var recettesInv = {};
          ['01', '02', '03', '04', '05', '06'].forEach(function (c) {
            recettesInv[c] = { previsions: 0, realisations: 0 };
          });

          allPrevisionsRecettes.forEach(function (pr) {
            var tax = taxMap[pr.taxeId];
            if (!tax) return;
            var prefix = (tax.code || '').substring(0, 2);
            if (recettesInv[prefix]) {
              recettesInv[prefix].previsions += pr.montantPrevu || 0;
            }
          });

          allDeclarations.forEach(function (d) {
            if (d.statut !== 'validee') return;
            var tax = taxMap[d.taxeId];
            if (!tax) return;
            var prefix = (tax.code || '').substring(0, 2);
            if (recettesInv[prefix]) {
              recettesInv[prefix].realisations += d.montant || d.montantRecette || 0;
            }
          });

          // Depenses investissement: group sous-chapitres by code prefix 90-95
          var depensesInv = {};
          ['90', '91', '92', '93', '94', '95'].forEach(function (c) {
            depensesInv[c] = { previsions: 0, realisations: 0 };
          });

          allPrevisions.forEach(function (p) {
            var sc = scMap[p.sousChapitreId];
            if (!sc) return;
            var prefix = (sc.code || '').substring(0, 2);
            if (depensesInv[prefix]) {
              depensesInv[prefix].previsions += p.montantPrevu || 0;
            }
          });

          allMandats.forEach(function (m) {
            if (m.statut !== 'paye') return;
            var sc = scMap[m.sousChapitreId];
            if (!sc) return;
            var prefix = (sc.code || '').substring(0, 2);
            if (depensesInv[prefix]) {
              depensesInv[prefix].realisations += m.montant || 0;
            }
          });

          renderPage({
            exercice: exercice,
            mairie: mairie,
            recettesInv: recettesInv,
            depensesInv: depensesInv,
          });
        } catch (e) {
          console.error('Erreur chargement:', e);
          document.getElementById('content').innerHTML =
            '<div style="color:red;padding:20px;font-size:14px">Erreur: ' + e.message + '<br><pre>' + e.stack + '</pre></div>';
        }
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'FILL_COMPTE_ADMIN_DATA') {
          loadAndRender();
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(loadAndRender, 500);
      });
    </script>
  </body>
</html>
