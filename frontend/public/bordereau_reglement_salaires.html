<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bordereau de Règlement des Salaires</title>
    <style>
      @page {
        size: A4 landscape;
        margin: 0;
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #f0f0f0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        padding: 20px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .print-btn {
        position: fixed;
        top: 10px;
        right: 10px;
        background: #0d7343;
        color: white;
        border: none;
        padding: 10px 20px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        z-index: 999;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      }
      .print-btn:hover {
        background: #0a5c36;
      }

      .print-page {
        background: white;
        width: 297mm;
        margin: 20px auto;
        padding: 8mm;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        position: relative;
        min-height: 210mm;
        page-break-after: always;
      }
      .print-page:last-child {
        page-break-after: auto;
      }

      .page-number {
        position: absolute;
        bottom: 5mm;
        right: 8mm;
        font-size: 8px;
        color: #999;
      }

      .editable-date {
        cursor: pointer;
        border-bottom: 1px dashed #999;
        padding: 0 2px;
        min-width: 80px;
        display: inline-block;
      }
      .editable-date:hover {
        background: #e8f0fe;
      }
      .editable-date:focus {
        outline: 2px solid #1976d2;
        background: #fff;
        border-bottom: none;
      }
      @media print {
        body {
          background: none;
          padding: 0;
        }
        .print-page {
          box-shadow: none;
          width: 100%;
          padding: 5mm;
          margin: 0;
          min-height: 100vh;
        }
        .print-btn {
          display: none !important;
        }
        .editable-date {
          border-bottom: none;
        }
      }

      /* EN-TÊTE */
      .header {
        border: 2px solid #000;
        margin-bottom: 8px;
      }
      .header-top {
        display: flex;
        align-items: stretch;
        border-bottom: 2px solid #000;
      }
      .header-col {
        padding: 6px 10px;
        flex: 1;
      }
      .header-col:not(:last-child) {
        border-right: 1px solid #000;
      }
      .header-col.center {
        text-align: center;
      }
      .header-col.right {
        text-align: right;
      }
      .republique {
        font-weight: bold;
        font-size: 10px;
        text-transform: uppercase;
      }
      .devise {
        font-style: italic;
        font-size: 8px;
        color: #555;
      }
      .mairie {
        font-weight: 900;
        font-size: 13px;
        text-transform: uppercase;
        margin-top: 3px;
      }
      .titre-doc {
        font-size: 13px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 1px;
      }
      .sous-titre-doc {
        font-size: 10px;
        margin-top: 3px;
        color: #333;
      }
      .annee-badge {
        font-size: 22px;
        font-weight: 900;
        letter-spacing: 3px;
        color: #1e3a5f;
      }
      .header-meta {
        display: flex;
        font-size: 9px;
        border-top: 1px solid #000;
      }
      .meta-item {
        flex: 1;
        padding: 3px 8px;
        border-right: 1px solid #ccc;
      }
      .meta-item:last-child {
        border-right: none;
      }
      .meta-label {
        color: #555;
        font-size: 8px;
        text-transform: uppercase;
      }
      .meta-value {
        font-weight: bold;
      }

      /* TABLEAU */
      table.main-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        table-layout: fixed;
      }
      table.main-table th {
        background: #1e3a5f;
        color: white;
        border: 1px solid #000;
        padding: 4px 3px;
        text-align: center;
        font-size: 9px;
        line-height: 1.3;
      }
      table.main-table th.left {
        text-align: left;
      }
      table.main-table td {
        border: 1px solid #888;
        padding: 3px 4px;
        vertical-align: middle;
      }
      table.main-table td.right {
        text-align: right;
        font-family: 'Courier New', monospace;
        font-size: 9px;
      }
      table.main-table td.center {
        text-align: center;
      }
      table.main-table td.sig-cell {
        height: 20px;
      }
      table.main-table tr:nth-child(even) td {
        background: #f9fafb;
      }
      table.main-table tfoot td {
        background: #1e3a5f;
        color: white;
        font-weight: bold;
        border: 1px solid #000;
        padding: 4px;
        font-size: 10px;
      }
      table.main-table tfoot td.right {
        text-align: right;
        font-family: 'Courier New', monospace;
      }
      tr.report-row td {
        background: #fef3c7 !important;
        font-weight: bold;
        font-style: italic;
      }
      tr.total-row td {
        background: #dbeafe !important;
        font-weight: bold;
        border: 1px solid #000;
      }

      .no-data {
        text-align: center;
        padding: 30px;
        color: #888;
        font-style: italic;
      }
      .total-box {
        border: 2px solid #000;
        padding: 6px 12px;
        margin-top: 8px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      .total-box .tb-label {
        font-weight: bold;
        font-size: 11px;
        text-transform: uppercase;
        color: #1e3a5f;
      }
      .total-box .tb-value {
        font-size: 16px;
        font-weight: 900;
        font-family: 'Courier New', monospace;
        color: #15803d;
      }
      .total-box .tb-lettres {
        font-size: 9px;
        font-style: italic;
        color: #555;
        flex: 1;
      }

      .signatures {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        font-size: 9px;
      }
      .sig-block {
        text-align: center;
        width: 30%;
        border: 1px solid #000;
        padding: 6px;
      }
      .sig-block .sig-title {
        font-weight: bold;
        text-transform: uppercase;
        font-size: 9px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 3px;
        margin-bottom: 30px;
      }
      .sig-line {
        border-top: 1px solid #000;
        padding-top: 2px;
        font-size: 8px;
        color: #555;
      }
      .footer-doc {
        text-align: right;
        font-size: 7px;
        color: #999;
        margin-top: 6px;
        border-top: 1px dashed #ccc;
        padding-top: 3px;
      }
    </style>
  </head>
  <body>
    <button class="print-btn" onclick="window.print()">Imprimer</button>
    <div id="content">
      <div
        class="print-page"
        style="display: flex; align-items: center; justify-content: center; color: #888"
      >
        Chargement...
      </div>
    </div>

    <script src="dexie.min.js"></script>
    <script src="constanteInfo.js"></script>
    <script>
      const MOIS_LABELS = [
        'Janvier',
        'Février',
        'Mars',
        'Avril',
        'Mai',
        'Juin',
        'Juillet',
        'Août',
        'Septembre',
        'Octobre',
        'Novembre',
        'Décembre',
      ];
      const ROWS_PER_PAGE = 10;

      function fmt(n) {
        return Number(n || 0).toLocaleString('fr-FR');
      }

      function numberToWords(num) {
        // Conversion en toutes lettres (français). Implémentation unique et vérifiée.
        var __n = Math.floor(Math.abs(Number(num) || 0));
        var __neg = (Number(num) || 0) < 0;
        var U = ['', 'un', 'deux', 'trois', 'quatre', 'cinq', 'six', 'sept', 'huit', 'neuf'];
        var T = ['dix','onze','douze','treize','quatorze','quinze','seize','dix-sept','dix-huit','dix-neuf'];
        var D = ['','','vingt','trente','quarante','cinquante','soixante','soixante','quatre-vingt','quatre-vingt'];
        var SEP = " ";
        function sub100(n) {
          if (n < 10) return U[n];
          if (n < 20) return T[n - 10];
          var d = Math.floor(n / 10), u = n % 10;
          if (d === 7 || d === 9) {
            var r = n - (d === 7 ? 60 : 80); // 10..19
            // 71 = "soixante et onze" ; 91 = "quatre-vingt-onze" (sans "et")
            return D[d] + (d === 7 && r === 11 ? '-et-' : '-') + T[r - 10];
          }
          if (u === 0) return D[d] + (d === 8 ? 's' : ''); // quatre-vingts
          if (u === 1 && d < 8) return D[d] + '-et-un';    // vingt-et-un ... soixante-et-un
          return D[d] + '-' + U[u];
        }
        function sub1000(n) {
          if (n < 100) return sub100(n);
          var c = Math.floor(n / 100), r = n % 100;
          var s = (c === 1 ? 'cent' : U[c] + '-cent');
          if (r === 0) { if (c > 1) s += 's'; } else { s += '-' + sub100(r); }
          return s;
        }
        // "vingt" et "cent" sont invariables devant "mille"
        function invariable(s) { return s.replace(/(vingt|cent)s$/, '$1'); }
        function convert(n) {
          if (n === 0) return '';
          if (n >= 1e9) {
            var qb = Math.floor(n / 1e9), rb = n % 1e9;
            var sb = (qb === 1 ? 'un' + SEP + 'milliard' : convert(qb) + SEP + 'milliards');
            return rb ? sb + SEP + convert(rb) : sb;
          }
          if (n >= 1e6) {
            var qm = Math.floor(n / 1e6), rm = n % 1e6;
            var sm = (qm === 1 ? 'un' + SEP + 'million' : convert(qm) + SEP + 'millions');
            return rm ? sm + SEP + convert(rm) : sm;
          }
          if (n >= 1000) {
            var qk = Math.floor(n / 1000), rk = n % 1000;
            var sk = (qk === 1 ? 'mille' : invariable(sub1000(qk)) + SEP + 'mille');
            return rk ? sk + SEP + sub1000(rk) : sk;
          }
          return sub1000(n);
        }
        var __r = (__n === 0 ? 'zéro' : convert(__n));
        if (__neg) __r = 'moins ' + __r;
        __r = __r + "";
        return __r;
      }

      function buildHeader(
        maisVille,
        maisCode,
        moisLabel,
        annee,
        nbAgents,
        totalNet,
        dateAujourdhui,
      ) {
        return `<div class="header">
          <div class="header-top">
            <div class="header-col">
              <div class="republique">REPUBLIQUE DE CÔTE D'IVOIRE</div>
              <div class="devise">Union – Discipline – Travail</div>
              <div class="mairie">COMMUNE DE ${maisVille}</div>
              ${maisCode ? `<div style="font-size:9px;margin-top:2px">Code : <strong>${maisCode}</strong></div>` : ''}
            </div>
            <div class="header-col center">
              <div class="titre-doc">BORDEREAU DE RÈGLEMENT DES SALAIRES</div>
              <div class="sous-titre-doc">Paiement des salaires et accessoires — ${moisLabel} ${annee}</div>
            </div>
            <div class="header-col right">
              <div style="font-size:9px;color:#555;text-transform:uppercase">Exercice</div>
              <div class="annee-badge">${annee}</div>
            </div>
          </div>
          <div class="header-meta">
            <div class="meta-item"><div class="meta-label">Mois</div><div class="meta-value">${moisLabel} ${annee}</div></div>
            <div class="meta-item"><div class="meta-label">Nombre d'agents</div><div class="meta-value">${nbAgents}</div></div>
            <div class="meta-item"><div class="meta-label">Masse salariale nette</div><div class="meta-value">${fmt(totalNet)} FCFA</div></div>
            <div class="meta-item"><div class="meta-label">Établi le</div><div class="meta-value"><span class="editable-date" contenteditable="true">${dateAujourdhui}</span></div></div>
          </div>
        </div>`;
      }

      function buildTableHead() {
        return `<thead><tr>
          <th style="width:3%">N°</th>
          <th class="left" style="width:8%">Matricule</th>
          <th class="left" style="width:20%">Nom & Prénom</th>
          <th class="left" style="width:12%">Grade / Poste</th>
          <th class="left" style="width:10%">Service</th>
          <th class="left" style="width:14%">RIB / N° Compte</th>
          <th style="width:11%">Net à Payer (FCFA)</th>
          <th style="width:13%">Signature de l'Agent</th>
          <th style="width:9%">Observations</th>
        </tr></thead>`;
      }

      document.addEventListener('DOMContentLoaded', async () => {
        let db;
        try {
          db = new Dexie('TresorOfflineDB');
          await db.open();
        } catch (_e) {
          db = new Dexie('TresorDatabase');
          await db.open();
        }

        const params = new URLSearchParams(window.location.search);
        const mois = parseInt(params.get('mois'), 10) || new Date().getMonth() + 1;
        const annee = parseInt(params.get('annee'), 10) || new Date().getFullYear();
        const shouldPrint = params.get('print') === 'true';

        try {
          const mairie = MAIRIE_INFO;
          const [employes, toutesLesFiches] = await Promise.all([
            db.table('employes').toArray(),
            db.table('fichesPaie').toArray(),
          ]);

          const fiches = toutesLesFiches.filter((f) => f.mois === mois && f.annee === annee);
          const empMap = new Map(employes.map((e) => [e.id, e]));
          const maisVille = mairie.ville.toUpperCase();
          const maisCode = mairie ? mairie.code : '';
          const moisLabel = MOIS_LABELS[mois - 1] || '';
          const dateAujourdhui = new Date().toLocaleDateString('fr-FR', {
            day: 'numeric',
            month: 'long',
            year: 'numeric',
          });

          let totalNet = 0;
          fiches.forEach((f) => {
            totalNet += f.montantNet || 0;
          });

          if (fiches.length === 0) {
            document.getElementById('content').innerHTML =
              `<div class="print-page">${buildHeader(maisVille, maisCode, moisLabel, annee, 0, 0, dateAujourdhui)}<p class="no-data">Aucun bulletin de paie pour ${moisLabel} ${annee}</p></div>`;
            if (shouldPrint) setTimeout(() => window.print(), 600);
            return;
          }

          const allData = fiches.map((f, i) => {
            const emp = empMap.get(f.employeId);
            return {
              idx: i + 1,
              matricule: emp ? emp.matricule : '-',
              nom: emp ? `${emp.nom} ${emp.prenom}` : '-',
              grade: emp ? emp.grade || emp.poste || '-' : '-',
              service: emp ? emp.service || '-' : '-',
              rib: emp ? emp.rib || '-' : '-',
              net: f.montantNet || 0,
            };
          });

          const pages = [];
          for (let i = 0; i < allData.length; i += ROWS_PER_PAGE)
            pages.push(allData.slice(i, i + ROWS_PER_PAGE));
          const totalPages = pages.length;
          let cumulNet = 0;
          let html = '';

          pages.forEach((pageData, idx) => {
            const isLast = idx === totalPages - 1;
            const reportNet = cumulNet;
            pageData.forEach((d) => {
              cumulNet += d.net;
            });

            const reportRow =
              idx > 0
                ? `<tr class="report-row"><td colspan="6" style="text-align:left;padding-left:8px">REPORT</td><td class="right">${fmt(reportNet)}</td><td colspan="2"></td></tr>`
                : '';
            const dataRows = pageData
              .map(
                (d) => `<tr>
              <td class="center">${d.idx}</td>
              <td><strong>${d.matricule}</strong></td>
              <td>${d.nom}</td>
              <td>${d.grade}</td>
              <td>${d.service}</td>
              <td>${d.rib}</td>
              <td class="right" style="font-weight:bold;color:#15803d">${fmt(d.net)}</td>
              <td class="sig-cell"></td>
              <td class="sig-cell"></td>
            </tr>`,
              )
              .join('');
            const totalRow = `<tr class="total-row"><td colspan="6" style="text-align:right;padding-right:8px"><strong>${isLast ? 'TOTAL GÉNÉRAL' : 'TOTAL'}</strong></td><td class="right"><strong>${fmt(cumulNet)}</strong></td><td colspan="2"></td></tr>`;

            html += `<div class="print-page">
              ${buildHeader(maisVille, maisCode, moisLabel, annee, fiches.length, totalNet, dateAujourdhui)}
              <table class="main-table">
                <colgroup>
                  <col style="width:3%"/><col style="width:8%"/><col style="width:20%"/><col style="width:12%"/>
                  <col style="width:10%"/><col style="width:14%"/><col style="width:11%"/><col style="width:13%"/><col style="width:9%"/>
                </colgroup>
                ${buildTableHead()}
                <tbody>${reportRow}${dataRows}${totalRow}</tbody>
              </table>
              ${
                isLast
                  ? `
                <div class="total-box">
                  <div>
                    <div class="tb-label">Arrêté le présent bordereau à la somme de :</div>
                    <div class="tb-value">${fmt(cumulNet)} FCFA</div>
                  </div>
                  <div class="tb-lettres" contenteditable="true">(${numberToWords(cumulNet || 0)} francs CFA)</div>
                </div>
                <div class="signatures">
                  <div class="sig-block"><div class="sig-title">Établi par</div><div class="sig-line">Nom, signature & date</div></div>
                  <div class="sig-block"><div class="sig-title">Visé par le Comptable Municipal</div><div class="sig-line">Nom, signature & cachet</div></div>
                  <div class="sig-block"><div class="sig-title">Approuvé par le Maire</div><div class="sig-line">Nom, signature & cachet officiel</div></div>
                </div>
                <div class="footer-doc">Édité le <span class="editable-date" contenteditable="true">${dateAujourdhui}</span> — SIGOBC Mairie de ${mairie.ville} — Document officiel / confidentiel</div>
              `
                  : ''
              }
              <div class="page-number">Page ${idx + 1}/${totalPages}</div>
            </div>`;
          });

          document.getElementById('content').innerHTML = html;
          if (shouldPrint) setTimeout(() => window.print(), 600);
        } catch (err) {
          document.getElementById('content').innerHTML =
            `<div class="print-page"><p style="color:red;padding:20px">Erreur: ${err.message}</p></div>`;
        }
      });
    </script>
  </body>
</html>
