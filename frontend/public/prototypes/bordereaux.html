<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prototype – Bordereaux</title>
  <style>
    :root { --orange:#E67E22; --green:#2E7D32; --bg:#F5F7FA; --text:#111827; --muted:#6B7280; }
    body { margin:0; font-family: Arial, sans-serif; background: var(--bg); color: var(--text); }
    header { background:#fff; border-bottom:1px solid #E5E7EB; padding:16px 24px; }
    .container { max-width:1100px; margin:24px auto; padding:0 16px; }
    .card { background:#fff; border:1px solid #E5E7EB; border-radius:8px; padding:16px; }
    table { width:100%; border-collapse:collapse; }
    thead th { text-align:left; padding:10px; border-bottom:2px solid var(--orange); color:var(--muted); }
    tbody td { padding:10px; border-bottom:1px solid #E5E7EB; }
    .actions { display:flex; justify-content:flex-end; gap:8px; margin-top:12px; }
    .btn { background: var(--orange); color:#fff; border:none; border-radius:6px; padding:10px 14px; cursor:pointer; }
  </style>
</head>
<body>
  <header><div class="container"><strong>Bordereaux d'émission des mandats</strong></div></header>
  <div class="container">
    <div class="card">
      <table>
        <thead>
          <tr><th>N°</th><th>Exercice</th><th>Date émission</th><th>Montant total</th><th>Statut</th></tr>
        </thead>
        <tbody>
          <tr><td>1</td><td>2025</td><td>02/01/2025</td><td>1 250 000</td><td style="color:var(--green)">ouvert</td></tr>
          <tr><td>2</td><td>2025</td><td>07/02/2025</td><td>980 000</td><td>ferme</td></tr>
        </tbody>
      </table>
      <div class="actions"><button class="btn">Imprimer</button></div>
    </div>
  </div>
</body>
</html>
