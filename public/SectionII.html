<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Section II</title>
    <style>
      @page {
        size: A4;
        margin: 15mm;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        font-size: 9pt;
        line-height: 1.2;
      }

      .header {
        display: flex;
        align-items: center;
        margin-bottom: 10px;
      }

      .header-icon {
        width: 30px;
        height: 30px;
        background-color: #70ad47;
        margin-right: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        border: 2px solid #548235;
      }

      .header-icon::before {
        content: '≡';
        color: white;
        font-size: 16px;
        font-weight: bold;
      }

      h1 {
        font-size: 18pt;
        color: #333;
        font-weight: normal;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin-bottom: 20px;
      }

      th,
      td {
        border: 1px solid #000;
        padding: 4px 6px;
        text-align: center;
      }

      th {
        background-color: #f0f0f0;
        font-weight: bold;
      }

      td.date {
        text-align: left;
        white-space: nowrap;
      }

      td.type {
        text-align: left;
      }

      td.amount {
        text-align: right;
      }

      tr.monthly-total {
        background-color: #e7e6e6;
        font-weight: bold;
      }

      tr.monthly-total td {
        background-color: #e7e6e6;
      }

      .page-break {
        page-break-after: always;
      }

      .page-number {
        text-align: right;
        font-size: 8pt;
        color: #666;
        margin-top: 10px;
      }

      @media print {
        body {
          margin: 0;
        }

        .page-break {
          page-break-after: always;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <div class="header">
        <div class="header-icon"></div>
        <h1>Section II</h1>
      </div>

      <table>
        <thead>
          <tr id="head-row"></tr>
        </thead>
        <tbody id="table-body">
          <!-- Les données seront insérées ici par JavaScript -->
        </tbody>
      </table>

      <div class="page-number" id="page-number"></div>
    </div>

    <script>
      function formatNumber(num) {
        if (!num && num !== 0) return '';
        return new Intl.NumberFormat('fr-FR').format(num);
      }

      function formatMontant(montant) {
        if (!montant && montant !== 0) return '';
        return new Intl.NumberFormat('fr-FR').format(montant);
      }

      function formatDate(dateStr) {
        if (!dateStr) return '';
        const date = new Date(dateStr);
        return date.toLocaleDateString('fr-FR');
      }

      function renderHead(columns, labels) {
        const head = document.getElementById('head-row');
        const base = ['Date', 'Type'];
        const tail = ['Remise', 'Versement', 'Solde'];
        const cols = base
          .concat(columns.map((c) => labels && labels[c] ? labels[c] : String(c)))
          .concat(tail);
        head.innerHTML = cols.map((txt) => `<th>${txt}</th>`).join('');
      }

      function renderTable(data, columns) {
        const tbody = document.getElementById('table-body');
        tbody.innerHTML = '';

        data.forEach((row) => {
          const tr = document.createElement('tr');

          if (row.isMonthlyTotal) {
            tr.className = 'monthly-total';
          }

          // Date
          const tdDate = document.createElement('td');
          tdDate.className = 'date';
          tdDate.textContent = row.isMonthlyTotal ? row.date : formatDate(row.date);
          tr.appendChild(tdDate);

          // Type
          const tdType = document.createElement('td');
          tdType.className = 'type';
          tdType.textContent = row.type || '';
          tr.appendChild(tdType);

          // Dénominations
          const denoms = columns || [];
          denoms.forEach((d) => {
            const td = document.createElement('td');
            let val = 0;
            if (row.detailsQuotites && row.detailsQuotites[d] != null) {
              val = row.detailsQuotites[d];
            } else if (row.denominations) {
              const price = parseInt(String(d).split('-')[0], 10);
              val = row.denominations[price] || 0;
            }
            td.textContent = formatNumber(val);
            tr.appendChild(td);
          });

          // Remise
          const tdRemise = document.createElement('td');
          tdRemise.className = 'amount';
          tdRemise.textContent = formatMontant(row.remise);
          tr.appendChild(tdRemise);

          // Versement
          const tdVersement = document.createElement('td');
          tdVersement.className = 'amount';
          tdVersement.textContent = formatMontant(row.versement);
          tr.appendChild(tdVersement);

          // Solde
          const tdSolde = document.createElement('td');
          tdSolde.className = 'amount';
          tdSolde.textContent = formatMontant(row.solde);
          tr.appendChild(tdSolde);

          tbody.appendChild(tr);
        });
      }

      window.addEventListener('message', (event) => {
        if (event.data.type === 'FILL_DATA') {
          renderHead(event.data.columns, event.data.labels);
          renderTable(event.data.data, event.data.columns);

          setTimeout(() => {
            window.print();
          }, 500);
        }
      });
    </script>
  </body>
</html>
