<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bordereau de Règlement des Salaires</title>
    <style>
      @page {
        size: A3 landscape;
        margin: 8mm;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #f0f0f0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        padding: 20px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page-container {
        background: white;
        width: 410mm;
        margin: 0 auto;
        padding: 8mm;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .print-btn {
        position: fixed;
        top: 10px;
        right: 10px;
        background: #0d7343;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        z-index: 999;
      }

      @media print {
        body {
          background: none;
          padding: 0;
        }
        .page-container {
          box-shadow: none;
          width: 100%;
          padding: 3mm;
        }
        .print-btn {
          display: none !important;
        }
        .no-print {
          display: none !important;
        }
      }

      /* EN-TÊTE */
      .header {
        border: 2px solid #000;
        margin-bottom: 10px;
      }
      .header-top {
        display: flex;
        align-items: stretch;
        border-bottom: 2px solid #000;
      }
      .header-col {
        padding: 8px 12px;
        flex: 1;
      }
      .header-col:not(:last-child) {
        border-right: 1px solid #000;
      }
      .header-col.center {
        text-align: center;
      }
      .header-col.right {
        text-align: right;
      }
      .republique {
        font-weight: bold;
        font-size: 11px;
        text-transform: uppercase;
      }
      .devise {
        font-style: italic;
        font-size: 9px;
        color: #555;
      }
      .mairie {
        font-weight: 900;
        font-size: 15px;
        text-transform: uppercase;
        margin-top: 4px;
      }
      .titre-doc {
        font-size: 17px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
      }
      .sous-titre-doc {
        font-size: 12px;
        margin-top: 4px;
        color: #333;
      }
      .annee-badge {
        font-size: 28px;
        font-weight: 900;
        letter-spacing: 4px;
        color: #1e3a5f;
      }
      .header-meta {
        display: flex;
        gap: 0;
        font-size: 10px;
        border-top: 1px solid #000;
      }
      .meta-item {
        flex: 1;
        padding: 4px 10px;
        border-right: 1px solid #ccc;
      }
      .meta-item:last-child {
        border-right: none;
      }
      .meta-label {
        color: #555;
        font-size: 9px;
        text-transform: uppercase;
      }
      .meta-value {
        font-weight: bold;
      }

      /* TABLEAU PRINCIPAL */
      table.main-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        margin-bottom: 8px;
        table-layout: fixed;
      }
      table.main-table th {
        background: #1e3a5f;
        color: white;
        border: 1px solid #000;
        padding: 5px 4px;
        text-align: center;
        font-size: 9px;
        line-height: 1.3;
      }
      table.main-table th.left {
        text-align: left;
      }
      table.main-table td {
        border: 1px solid #888;
        padding: 4px 5px;
        vertical-align: middle;
      }
      table.main-table td.right {
        text-align: right;
        font-family: 'Courier New', monospace;
        font-size: 9px;
      }
      table.main-table td.center {
        text-align: center;
      }
      table.main-table td.sig-cell {
        /* cellule pour les signatures */
        height: 22px;
        border: 1px solid #888;
      }
      table.main-table tr:nth-child(even) td {
        background: #f9fafb;
      }
      table.main-table tr:nth-child(even) td.sig-cell {
        background: #f9fafb;
      }

      table.main-table tfoot td {
        background: #1e3a5f;
        color: white;
        font-weight: bold;
        border: 1px solid #000;
        padding: 5px;
        font-size: 11px;
      }
      table.main-table tfoot td.right {
        text-align: right;
        font-family: 'Courier New', monospace;
      }

      .no-data {
        text-align: center;
        padding: 30px;
        color: #888;
        font-style: italic;
      }

      /* RÉSUMÉ MONTANT */
      .total-box {
        border: 2px solid #000;
        padding: 8px 14px;
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 24px;
      }
      .total-box .tb-label {
        font-weight: bold;
        font-size: 12px;
        text-transform: uppercase;
        color: #1e3a5f;
      }
      .total-box .tb-value {
        font-size: 18px;
        font-weight: 900;
        font-family: 'Courier New', monospace;
        color: #15803d;
      }
      .total-box .tb-lettres {
        font-size: 10px;
        font-style: italic;
        color: #555;
        flex: 1;
      }

      /* VISA COMPTABLE */
      .visa-section {
        border: 1px solid #000;
        padding: 8px;
        margin-bottom: 10px;
        font-size: 10px;
      }
      .visa-section .visa-title {
        font-weight: bold;
        document-transform: uppercase;
        border-bottom: 1px solid #ccc;
        padding-bottom: 3px;
        margin-bottom: 6px;
        font-size: 11px;
      }
      .visa-row {
        display: flex;
        gap: 16px;
      }
      .visa-item {
        flex: 1;
      }
      .visa-item .vi-label {
        color: #555;
        font-size: 9px;
      }
      .visa-item .vi-value {
        font-weight: bold;
      }

      /* SIGNATURES */
      .signatures {
        display: flex;
        justify-content: space-between;
        margin-top: 16px;
        font-size: 10px;
      }
      .sig-block {
        text-align: center;
        width: 30%;
        border: 1px solid #000;
        padding: 8px;
      }
      .sig-block .sig-title {
        font-weight: bold;
        text-transform: uppercase;
        font-size: 10px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 4px;
        margin-bottom: 35px;
      }
      .sig-line {
        border-top: 1px solid #000;
        padding-top: 3px;
        font-size: 9px;
        color: #555;
      }

      .footer-doc {
        text-align: right;
        font-size: 8px;
        color: #999;
        margin-top: 8px;
        border-top: 1px dashed #ccc;
        padding-top: 4px;
      }
    </style>
  </head>
  <body>
    <button class="print-btn" onclick="window.print()">🖨️ Imprimer</button>

    <div class="page-container" id="content">
      <div style="text-align: center; padding: 40px; color: #888">Chargement...</div>
    </div>

    <script src="dexie.min.js"></script>
    <script>
      const MOIS_LABELS = [
        'Janvier',
        'Février',
        'Mars',
        'Avril',
        'Mai',
        'Juin',
        'Juillet',
        'Août',
        'Septembre',
        'Octobre',
        'Novembre',
        'Décembre',
      ];

      function fmt(n) {
        return Number(n || 0).toLocaleString('fr-FR');
      }

      function numberToWords(num) {
        if (num === 0) return 'zéro';
        const units = [
          '',
          'un',
          'deux',
          'trois',
          'quatre',
          'cinq',
          'six',
          'sept',
          'huit',
          'neuf',
          'dix',
          'onze',
          'douze',
          'treize',
          'quatorze',
          'quinze',
          'seize',
          'dix-sept',
          'dix-huit',
          'dix-neuf',
        ];
        const tens = [
          '',
          '',
          'vingt',
          'trente',
          'quarante',
          'cinquante',
          'soixante',
          'soixante',
          'quatre-vingt',
          'quatre-vingt',
        ];
        function c100(n) {
          if (n < 20) return units[n];
          const t = Math.floor(n / 10),
            u = n % 10;
          if (t === 7) return 'soixante-' + units[10 + u];
          if (t === 9) return 'quatre-vingt-' + (u === 0 ? 's' : units[u]);
          return (
            tens[t] + (u === 1 && t !== 8 ? '-et-un' : u > 0 ? '-' + units[u] : t === 8 ? 's' : '')
          );
        }
        function c1000(n) {
          if (n < 100) return c100(n);
          const h = Math.floor(n / 100),
            r = n % 100;
          return (
            (h === 1 ? 'cent' : units[h] + '-cent') +
            (r === 0 && h > 1 ? 's' : '') +
            (r > 0 ? '-' + c100(r) : '')
          );
        }
        function cn(n) {
          if (n === 0) return '';
          if (n >= 1000000) {
            const m = Math.floor(n / 1000000),
              r = n % 1000000;
            return (m === 1 ? 'un million' : c1000(m) + ' millions') + (r > 0 ? ' ' + cn(r) : '');
          }
          if (n >= 1000) {
            const k = Math.floor(n / 1000),
              r = n % 1000;
            return (k === 1 ? 'mille' : c1000(k) + ' mille') + (r > 0 ? ' ' + c1000(r) : '');
          }
          return c1000(n);
        }
        return cn(num);
      }

      const db = new Dexie('TresorDatabase');
      db.version(25).stores({
        mairies: '++id, nom, code, ville',
        employes: '++id, matricule, nom, prenom, service, mairieId, actif',
        fichesPaie:
          '++id, employeId, mois, annee, exercice, mairieId, statut, [annee+mois+employeId]',
      });

      document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        const mois = parseInt(params.get('mois'), 10) || new Date().getMonth() + 1;
        const annee = parseInt(params.get('annee'), 10) || new Date().getFullYear();
        const shouldPrint = params.get('print') === 'true';
        const content = document.getElementById('content');

        try {
          const [mairie, employes, toutesLesFiches] = await Promise.all([
            db.mairies.toCollection().first(),
            db.employes.toArray(),
            db.fichesPaie.toArray(),
          ]);

          const fiches = toutesLesFiches.filter((f) => f.mois === mois && f.annee === annee);
          const empMap = new Map(employes.map((e) => [e.id, e]));

          const maisVille = mairie ? mairie.ville.toUpperCase() : 'VAVOUA';
          const maisCode = mairie ? mairie.code : '';
          const moisLabel = MOIS_LABELS[mois - 1] || '';
          const dateAujourdhui = new Date().toLocaleDateString('fr-FR', {
            day: 'numeric',
            month: 'long',
            year: 'numeric',
          });

          let totalNet = 0;
          fiches.forEach((f) => {
            totalNet += f.montantNet || 0;
          });

          const rows =
            fiches.length === 0
              ? `<tr><td colspan="9" class="no-data">Aucun bulletin de paie pour ${moisLabel} ${annee}</td></tr>`
              : fiches
                  .map((f, i) => {
                    const emp = empMap.get(f.employeId);
                    return `<tr>
                  <td class="center">${i + 1}</td>
                  <td><strong>${emp ? emp.matricule : '-'}</strong></td>
                  <td>${emp ? `${emp.nom} ${emp.prenom}` : '-'}</td>
                  <td>${emp ? emp.grade || emp.poste || '-' : '-'}</td>
                  <td>${emp ? emp.service || '-' : '-'}</td>
                  <td>${emp ? emp.rib || '-' : '-'}</td>
                  <td class="right" style="font-weight:bold;color:#15803d">${fmt(f.montantNet)}</td>
                  <td class="sig-cell"><!-- signature agent --></td>
                  <td class="sig-cell"><!-- observations --></td>
                </tr>`;
                  })
                  .join('');

          content.innerHTML = `
            <div class="header">
              <div class="header-top">
                <div class="header-col">
                  <div class="republique">REPUBLIQUE DE CÔTE D'IVOIRE</div>
                  <div class="devise">Union – Discipline – Travail</div>
                  <div class="mairie">COMMUNE DE ${maisVille}</div>
                  ${maisCode ? `<div style="font-size:10px;margin-top:2px">Code : <strong>${maisCode}</strong></div>` : ''}
                </div>
                <div class="header-col center">
                  <div class="titre-doc">BORDEREAU DE RÈGLEMENT DES SALAIRES</div>
                  <div class="sous-titre-doc">Paiement des salaires et accessoires — ${moisLabel} ${annee}</div>
                </div>
                <div class="header-col right">
                  <div style="font-size:10px;color:#555;text-transform:uppercase">Exercice</div>
                  <div class="annee-badge">${annee}</div>
                </div>
              </div>
              <div class="header-meta">
                <div class="meta-item"><div class="meta-label">Mois</div><div class="meta-value">${moisLabel} ${annee}</div></div>
                <div class="meta-item"><div class="meta-label">Nombre d'agents</div><div class="meta-value">${fiches.length}</div></div>
                <div class="meta-item"><div class="meta-label">Masse salariale nette</div><div class="meta-value">${fmt(totalNet)} FCFA</div></div>
                <div class="meta-item"><div class="meta-label">Établi le</div><div class="meta-value">${dateAujourdhui}</div></div>
              </div>
            </div>

            <table class="main-table">
              <colgroup>
                <col style="width:3%"/>   <!-- N° -->
                <col style="width:8%"/>   <!-- Matricule -->
                <col style="width:20%"/>  <!-- Nom & Prénom -->
                <col style="width:12%"/>  <!-- Grade/Poste -->
                <col style="width:10%"/>  <!-- Service -->
                <col style="width:14%"/>  <!-- RIB -->
                <col style="width:11%"/>  <!-- Net à Payer -->
                <col style="width:13%"/>  <!-- Signature Agent -->
                <col style="width:9%"/>   <!-- Observations -->
              </colgroup>
              <thead>
                <tr>
                  <th>N°</th>
                  <th class="left">Matricule</th>
                  <th class="left">Nom & Prénom</th>
                  <th class="left">Grade / Poste</th>
                  <th class="left">Service</th>
                  <th class="left">RIB / N° Compte</th>
                  <th>Net à Payer (FCFA)</th>
                  <th>Signature de l'Agent</th>
                  <th>Observations</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
              ${
                fiches.length > 0
                  ? `
              <tfoot>
                <tr>
                  <td colspan="6" style="text-align:right">TOTAL MASSE SALARIALE NETTE</td>
                  <td class="right">${fmt(totalNet)}</td>
                  <td colspan="2"></td>
                </tr>
              </tfoot>`
                  : ''
              }
            </table>

            <div class="total-box">
              <div>
                <div class="tb-label">Arrêté le présent bordereau à la somme de :</div>
                <div class="tb-value">${fmt(totalNet)} FCFA</div>
              </div>
              <div class="tb-lettres">
                (${numberToWords(totalNet || 0)} francs CFA)
              </div>
            </div>

            <div class="signatures">
              <div class="sig-block">
                <div class="sig-title">Établi par</div>
                <div class="sig-line">Nom, signature & date</div>
              </div>
              <div class="sig-block">
                <div class="sig-title">Visé par le Comptable Municipal</div>
                <div class="sig-line">Nom, signature & cachet</div>
              </div>
              <div class="sig-block">
                <div class="sig-title">Approuvé par le Maire</div>
                <div class="sig-line">Nom, signature & cachet officiel</div>
              </div>
            </div>

            <div class="footer-doc">
              Édité le ${dateAujourdhui} — SIGOBC Mairie de ${mairie ? mairie.ville : 'Vavoua'} — Document officiel / confidentiel
            </div>
          `;

          if (shouldPrint) {
            setTimeout(() => window.print(), 600);
          }
        } catch (err) {
          document.getElementById('content').innerHTML =
            `<p style="color:red;padding:20px">Erreur: ${err.message}</p>`;
        }
      });
    </script>
  </body>
</html>
