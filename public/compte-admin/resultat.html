<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Administratif - Resultat</title>
    <script src="../dexie.min.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        margin: 0;
        padding: 10px;
      }
      .container {
        width: 100%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
        margin-bottom: 25px;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 4px 5px;
        color: #000;
      }
      th {
        font-weight: bold;
        text-align: center;
        vertical-align: middle;
      }
      .col-num {
        text-align: right;
        white-space: nowrap;
        font-size: 9px;
      }
      .col-center {
        text-align: center;
        white-space: nowrap;
        font-size: 9px;
      }
      .bold {
        font-weight: bold;
      }
      .underline {
        text-decoration: underline;
      }
      .align-center {
        text-align: center;
      }
      .align-right {
        text-align: right;
      }
      .align-left {
        text-align: left;
      }
      .uppercase {
        text-transform: uppercase;
      }
      .padding-left-md {
        padding-left: 20px;
      }
      .padding-left-sm {
        padding-left: 10px;
      }
      .total-row {
        font-weight: bold;
      }
      .signatures {
        margin-top: 10px;
        display: flex;
        justify-content: space-between;
        padding: 0 50px;
        font-size: 10px;
      }
      .signature-box {
        text-align: center;
        width: 250px;
      }
      .arrete-text {
        font-size: 9px;
        margin-top: 5px;
        margin-bottom: 15px;
      }
      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 10px 20px;
        background: #1976d2;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        z-index: 1000;
      }
      .print-button:hover {
        background: #1565c0;
      }
      .loading {
        text-align: center;
        padding: 50px;
        font-size: 16px;
        color: #666;
      }
      .print-footer {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      @media print {
        .no-print {
          display: none !important;
        }
        body {
          padding: 0;
        }
        .print-footer {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <button class="print-button no-print" onclick="window.print()">Imprimer</button>
    <div class="container">
      <div id="content">
        <div class="loading" id="loading">Chargement des donnees...</div>
      </div>
    </div>

    <script>
      function fmt(v) {
        return v ? new Intl.NumberFormat('fr-FR').format(v) : '0';
      }
      function resClass(v) {
        return v >= 0 ? 'positive' : 'negative';
      }

      async function loadData() {
        const db = new Dexie('TresorDatabase');
        await db.open();

        const exercice = new Date().getFullYear();
        const exercicePrev = exercice - 1;

        const [
          sousChapitres,
          taxes,
          allMandats,
          allDeclarations,
          allPrevisions,
          mairieRaw,
        ] = await Promise.all([
          db.table('sousChapitres').toArray(),
          db.table('taxes').toArray(),
          db.table('mandats').toArray(),
          db.table('declarations').toArray(),
          db.table('previsions').toArray(),
          db.table('mairies').toCollection().first(),
        ]);
        const mairie = mairieRaw || {};
        const mandatsN = allMandats.filter(m => m.exercice === exercice);
        const mandatsN1 = allMandats.filter(m => m.exercice === exercicePrev);
        const declarationsN = allDeclarations.filter(d => d.exercice === exercice);
        const declarationsN1 = allDeclarations.filter(d => d.exercice === exercicePrev);
        const previsionsN = allPrevisions.filter(p => p.exercice === exercice);

        // Build sous-chapitre map (id -> code)
        const scMap = {};
        sousChapitres.forEach((sc) => {
          scMap[sc.id] = sc.code;
        });

        // Build taxe map (id -> code)
        const taxeMap = {};
        taxes.forEach((t) => {
          taxeMap[t.id] = t.code;
        });

        function computeResults(mandats, declarations) {
          // Depenses fonctionnement: sousChapitres starting with '6'
          let depFonc = 0;
          // Depenses investissement: sousChapitres starting with '9'
          let depInv = 0;

          mandats.forEach((m) => {
            if (m.statut === 'annule') return;
            const scCode = scMap[m.sousChapitreId] || '';
            if (scCode.startsWith('6')) {
              depFonc += m.montant || 0;
            } else if (scCode.startsWith('9')) {
              depInv += m.montant || 0;
            }
          });

          // Recettes fonctionnement: taxes starting with '7'
          let recFonc = 0;
          // Recettes investissement: taxes starting with '0'
          let recInv = 0;

          declarations.forEach((d) => {
            if (d.statut === 'annulee') return;
            const taxeCode = taxeMap[d.taxeId] || '';
            const montant = d.montantRecette || d.montant || 0;
            if (taxeCode.startsWith('7')) {
              recFonc += montant;
            } else if (taxeCode.startsWith('0')) {
              recInv += montant;
            }
          });

          return { depFonc, depInv, recFonc, recInv };
        }

        const resultsN = computeResults(mandatsN, declarationsN);
        const resultsN1 = computeResults(mandatsN1, declarationsN1);

        let prevFonc = 0;
        let prevInv = 0;
        previsionsN.forEach((p) => {
          const scCode = scMap[p.sousChapitreId] || '';
          if (scCode.startsWith('6')) {
            prevFonc += p.montantPrevu || 0;
          } else if (scCode.startsWith('9')) {
            prevInv += p.montantPrevu || 0;
          }
        });
        resultsN.prevFonc = prevFonc;
        resultsN.prevInv = prevInv;

        return { resultsN, resultsN1, exercice, exercicePrev, mairie };
      }

      function render(data) {
        const { resultsN, resultsN1, exercice, exercicePrev, mairie } = data;
        const mairieNom = mairie ? mairie.nom || 'Mairie de Vavoua' : 'Mairie de Vavoua';

        const resFoncN = resultsN.recFonc - resultsN.depFonc;
        const resInvN = resultsN.recInv - resultsN.depInv;
        const totalRecN = resultsN.recFonc + resultsN.recInv;
        const totalDepN = resultsN.depFonc + resultsN.depInv;
        const totalResN = totalRecN - totalDepN;
        const totalPrev = resultsN.prevFonc + resultsN.prevInv;

        const resFoncN1 = resultsN1.recFonc - resultsN1.depFonc;
        const resInvN1 = resultsN1.recInv - resultsN1.depInv;
        const totalRecN1 = resultsN1.recFonc + resultsN1.recInv;
        const totalDepN1 = resultsN1.depFonc + resultsN1.depInv;
        const totalResN1 = totalRecN1 - totalDepN1;

        const cumulFonc = resFoncN + resFoncN1;
        const cumulInv = resInvN + resInvN1;
        const cumulRes = totalResN + totalResN1;

        let content = '';

        // FIRST TABLE: RESULTAT AVANT CORRECTION
        content += '<table>';
        content += '<thead>';
        content += '<tr>';
        content +=
          '<th rowspan="2" class="align-center bold uppercase" style="font-size: 11px; width: 20%;">COMPTE ADMINISTRATIF</th>';
        content +=
          '<th rowspan="2" colspan="7" class="align-center bold uppercase" style="font-size: 11px;">RESULTAT AVANT CORRECTION</th>';
        content +=
          '<th class="align-center bold uppercase" style="font-size: 10px; width: 60px;">ANNEE</th>';
        content +=
          '<th class="align-center bold uppercase" style="font-size: 10px; width: 40px;">N°</th>';
        content += '</tr>';
        content += '<tr>';
        content += '<th class="align-center" style="font-size: 10px;">' + exercice + '</th>';
        content += '<th class="align-center" style="font-size: 10px;">34</th>';
        content += '</tr>';
        content += '<tr>';
        content +=
          '<th rowspan="2" class="align-center bold uppercase" style="font-size: 8px;">BUDGET</th>';
        content +=
          '<th rowspan="2" class="align-center uppercase" style="font-size: 6px;">PREVISIONS<br>BUDGETAIRES</th>';
        content +=
          '<th rowspan="2" class="align-center uppercase" style="font-size: 6px;">RECETTES RECOUVREES</th>';
        content +=
          '<th rowspan="2" class="align-center uppercase" style="font-size: 6px;">DEPENSES<br>ORDONNANCEES</th>';
        content +=
          '<th colspan="6" class="align-center bold uppercase" style="font-size: 9px; letter-spacing: 2px;">R E S U L T A T</th>';
        content += '</tr>';
        content += '<tr>';
        content +=
          '<th colspan="2" class="align-center bold uppercase" style="font-size: 7px;">EXERCICE EN COURS</th>';
        content +=
          '<th colspan="2" class="align-center bold uppercase" style="font-size: 7px;">EXERCICE PRECEDENT</th>';
        content +=
          '<th colspan="2" class="align-center bold uppercase" style="font-size: 7px;">RESULTAT CUMULE</th>';
        content += '</tr>';
        content += '<tr>';
        content += '<th></th><th></th><th></th><th></th>';
        content += '<th class="align-center bold uppercase" style="font-size: 7px;">EXCEDENT</th>';
        content += '<th class="align-center bold uppercase" style="font-size: 7px;">DEFICIT</th>';
        content += '<th class="align-center bold uppercase" style="font-size: 7px;">EXCEDENT</th>';
        content += '<th class="align-center bold uppercase" style="font-size: 7px;">DEFICIT</th>';
        content += '<th class="align-center bold uppercase" style="font-size: 7px;">EXCEDENT</th>';
        content += '<th class="align-center bold uppercase" style="font-size: 7px;">DEFICIT</th>';
        content += '</tr>';
        content += '</thead>';
        content += '<tbody>';

        // FONCTIONNEMENT
        content += '<tr>';
        content +=
          '<td class="align-center bold uppercase" style="font-size: 8px;">FONCTIONNEMENT</td>';
        content += '<td class="col-center">' + fmt(resultsN.prevFonc) + '</td>';
        content += '<td class="col-center">' + fmt(resultsN.recFonc) + '</td>';
        content += '<td class="col-center">' + fmt(resultsN.depFonc) + '</td>';
        content += '<td class="col-center">' + (resFoncN >= 0 ? fmt(resFoncN) : '-') + '</td>';
        content += '<td class="col-center">' + (resFoncN < 0 ? fmt(-resFoncN) : '-') + '</td>';
        content += '<td class="col-center">' + (resFoncN1 >= 0 ? fmt(resFoncN1) : '-') + '</td>';
        content += '<td class="col-center">' + (resFoncN1 < 0 ? fmt(-resFoncN1) : '-') + '</td>';
        content += '<td class="col-center">' + (cumulFonc >= 0 ? fmt(cumulFonc) : '-') + '</td>';
        content += '<td class="col-center">' + (cumulFonc < 0 ? fmt(-cumulFonc) : '-') + '</td>';
        content += '</tr>';

        // INVESTISSEMENT
        content += '<tr>';
        content +=
          '<td class="align-center bold uppercase" style="font-size: 8px;">INVESTISSEMENT</td>';
        content += '<td class="col-center">' + fmt(resultsN.prevInv) + '</td>';
        content += '<td class="col-center">' + fmt(resultsN.recInv) + '</td>';
        content += '<td class="col-center">' + fmt(resultsN.depInv) + '</td>';
        content += '<td class="col-center">' + (resInvN >= 0 ? fmt(resInvN) : '-') + '</td>';
        content += '<td class="col-center">' + (resInvN < 0 ? fmt(-resInvN) : '-') + '</td>';
        content += '<td class="col-center">' + (resInvN1 >= 0 ? fmt(resInvN1) : '-') + '</td>';
        content += '<td class="col-center">' + (resInvN1 < 0 ? fmt(-resInvN1) : '-') + '</td>';
        content += '<td class="col-center">' + (cumulInv >= 0 ? fmt(cumulInv) : '-') + '</td>';
        content += '<td class="col-center">' + (cumulInv < 0 ? fmt(-cumulInv) : '-') + '</td>';
        content += '</tr>';

        // TOTAL
        content += '<tr>';
        content += '<td class="align-center bold uppercase" style="font-size: 8px;">TOTAL</td>';
        content += '<td class="col-center">' + fmt(totalPrev) + '</td>';
        content += '<td class="col-center">' + fmt(totalRecN) + '</td>';
        content += '<td class="col-center">' + fmt(totalDepN) + '</td>';
        content += '<td class="col-center">' + (totalResN >= 0 ? fmt(totalResN) : '-') + '</td>';
        content += '<td class="col-center">' + (totalResN < 0 ? fmt(-totalResN) : '-') + '</td>';
        content += '<td class="col-center">' + (totalResN1 >= 0 ? fmt(totalResN1) : '-') + '</td>';
        content += '<td class="col-center">' + (totalResN1 < 0 ? fmt(-totalResN1) : '-') + '</td>';
        content +=
          '<td class="col-center bold" style="font-size: 10px;">' +
          (cumulRes >= 0 ? fmt(cumulRes) : '-') +
          '</td>';
        content +=
          '<td class="col-center bold" style="font-size: 10px;">' +
          (cumulRes < 0 ? fmt(-cumulRes) : '-') +
          '</td>';
        content += '</tr>';

        content += '</tbody></table>';

        const today = new Date();
        const dateStr = today.toLocaleDateString('fr-FR', {
          day: 'numeric',
          month: 'long',
          year: 'numeric',
        });

        content +=
          '<div class="arrete-text">Arrêté le résultat avant correction du présent compte administratif à la somme de: <strong>( ' +
          fmt(Math.abs(cumulRes)) +
          ' ) francs CFA</strong></div>';

        content += '<div class="signatures">';
        content +=
          '<div class="signature-box"><br><strong>LE TRESORIER PRINCIPAL</strong><br><br><br><br><br><br><strong>MOBIE BOKA WILFREED</strong></div>';
        content +=
          '<div class="signature-box">Fait à ' +
          (mairie.ville || 'VAVOUA').toUpperCase() +
          ' le, ' +
          dateStr +
          '<br><strong>LE MAIRE</strong><br><br><br><br><br><br><strong>KALOU BONAVENTURE</strong></div>';
        content += '</div>';

        // SECOND TABLE: RESULTAT APRES CORRECTION
        content += '<table style="margin-top: 50px; page-break-before: always;">'; // Start on a new page or push down
        content += '<thead>';
        content += '<tr>';
        content +=
          '<th rowspan="2" class="align-center bold uppercase" style="font-size: 11px; width: 25%;">COMPTE ADMINISTRATIF</th>';
        content +=
          '<th rowspan="2" colspan="4" class="align-center bold uppercase" style="font-size: 11px;">RESULTAT APRES CORRECTION<br><br>n° 47</th>';
        content +=
          '<th class="align-center bold uppercase" style="font-size: 10px; width: 60px;">ANNEE</th>';
        content +=
          '<th class="align-center bold uppercase" style="font-size: 10px; width: 40px;">N°</th>';
        content += '</tr>';
        content += '<tr>';
        content += '<th class="align-center" style="font-size: 10px;">' + exercice + '</th>';
        content += '<th class="align-center" style="font-size: 10px;">35</th>';
        content += '</tr>';
        content += '<tr>';
        content +=
          '<th rowspan="2" class="align-center bold uppercase" style="font-size: 8px;">BUDGET</th>';
        content +=
          '<th colspan="2" class="align-center bold uppercase" style="font-size: 7px;">RESULTAT AVANT CORRECTION</th>';
        content +=
          '<th rowspan="2" class="align-center bold uppercase" style="font-size: 7px;">RESTE A RECOUVRER</th>';
        content +=
          '<th rowspan="2" class="align-center bold uppercase" style="font-size: 7px;">ENGAGEMENTS NON<br>MANDATES</th>';
        content +=
          '<th colspan="2" class="align-center bold uppercase" style="font-size: 7px;">RESULTAT APRES CORRECTION</th>';
        content += '</tr>';
        content += '<tr>';
        content += '<th class="align-center bold uppercase" style="font-size: 7px;">EXCEDENT</th>';
        content += '<th class="align-center bold uppercase" style="font-size: 7px;">DEFICIT</th>';
        content += '<th class="align-center bold uppercase" style="font-size: 7px;">EXCEDENT</th>';
        content += '<th class="align-center bold uppercase" style="font-size: 7px;">DEFICIT</th>';
        content += '</tr>';
        content += '</thead>';
        content += '<tbody>';

        // TITRE I FONCTIONNEMENT
        content += '<tr>';
        content +=
          '<td class="align-center bold uppercase" style="font-size: 9px; padding: 15px 5px;">TITRE I FONCTIONNEMENT</td>';
        content += '<td class="col-center">' + (cumulFonc >= 0 ? fmt(cumulFonc) : '') + '</td>';
        content += '<td class="col-center">' + (cumulFonc < 0 ? fmt(-cumulFonc) : '') + '</td>';
        content += '<td class="col-center"></td>';
        content += '<td class="col-center"></td>';
        content += '<td class="col-center">' + (cumulFonc >= 0 ? fmt(cumulFonc) : '') + '</td>';
        content += '<td class="col-center">' + (cumulFonc < 0 ? fmt(-cumulFonc) : '') + '</td>';
        content += '</tr>';

        // TITRE II INVESTISSEMENT
        content += '<tr>';
        content +=
          '<td class="align-center bold uppercase" style="font-size: 9px; padding: 15px 5px;">TITRE II INVESTISSEMENT</td>';
        content += '<td class="col-center">' + (cumulInv >= 0 ? fmt(cumulInv) : '') + '</td>';
        content += '<td class="col-center">' + (cumulInv < 0 ? fmt(-cumulInv) : '') + '</td>';
        content += '<td class="col-center"></td>';
        content += '<td class="col-center"></td>';
        content += '<td class="col-center">' + (cumulInv >= 0 ? fmt(cumulInv) : '') + '</td>';
        content += '<td class="col-center">' + (cumulInv < 0 ? fmt(-cumulInv) : '') + '</td>';
        content += '</tr>';

        // TOTAL
        content += '<tr>';
        content +=
          '<td class="align-center bold uppercase" style="font-size: 9px; padding: 15px 5px;">TOTAL</td>';
        content += '<td class="col-center">' + (cumulRes >= 0 ? fmt(cumulRes) : '') + '</td>';
        content += '<td class="col-center">' + (cumulRes < 0 ? fmt(-cumulRes) : '') + '</td>';
        content += '<td class="col-center"></td>';
        content += '<td class="col-center"></td>';
        content += '<td class="col-center">' + (cumulRes >= 0 ? fmt(cumulRes) : '') + '</td>';
        content += '<td class="col-center">' + (cumulRes < 0 ? fmt(-cumulRes) : '') + '</td>';
        content += '</tr>';

        content += '</tbody></table>';

        content +=
          '<div class="arrete-text">Arrêté le résultat apres correction du présent compte administratif à la somme de: <strong>( ' +
          fmt(Math.abs(cumulRes)) +
          ' ) francs CFA</strong></div>';

        content += '<div class="signatures">';
        content +=
          '<div class="signature-box"><br><strong>LE TRESORIER PRINCIPAL</strong><br><br><br><br><br><br><strong>MOBIE BOKA WILFREED</strong></div>';
        content +=
          '<div class="signature-box">Fait à ' +
          (mairie.ville || 'VAVOUA').toUpperCase() +
          ' le, ' +
          dateStr +
          '<br><strong>LE MAIRE</strong><br><br><br><br><br><br><strong>KALOU BONAVENTURE</strong></div>';
        content += '</div>';

        document.getElementById('content').innerHTML = content;
      }

      async function loadAndRender() {
        try {
          const result = await loadData();
          render(result);
        } catch (e) {
          console.error('Erreur chargement:', e);
          document.getElementById('content').innerHTML =
            '<div style="color:red;padding:20px;font-size:14px">Erreur: ' + e.message + '<br><pre>' + e.stack + '</pre></div>';
        }
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'FILL_COMPTE_ADMIN_DATA') {
          loadAndRender();
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(loadAndRender, 500);
      });
    </script>
  </body>
</html>
