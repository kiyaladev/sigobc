<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Administratif - Resultat</title>
    <script src="../dexie.min.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        margin: 0;
        padding: 10px;
      }
      .container { width: 100%; }
      .main-title {
        text-decoration: underline;
        font-size: 14px;
        margin: 5px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 0;
        margin-bottom: 15px;
      }
      th, td {
        border: 1px solid #000;
        padding: 3px 4px;
      }
      th {
        background-color: #f0f0f0;
        text-align: center;
        vertical-align: middle;
        font-size: 9px;
      }
      .col-rubrique { width: 40%; text-align: left; }
      .col-num { width: 20%; text-align: right; white-space: nowrap; }
      .section-header { background-color: #e0e0e0; font-weight: bold; }
      .total-section { background-color: #d0d0d0; font-weight: bold; border-top: 2px solid #000; }
      .grand-total { background-color: #bbb; font-weight: bold; border-top: 3px double #000; }
      .positive { color: #2e7d32; }
      .negative { color: #c62828; }
      .section-title {
        font-size: 12px;
        font-weight: bold;
        margin: 15px 0 5px 0;
        padding: 4px 8px;
        background: #e8e8e8;
        border: 1px solid #000;
      }
      .doc-header-cell { padding: 0 !important; background: #fff !important; }
      .doc-header-grid { width: 100%; display: grid; grid-template-columns: 1fr 2fr 1fr; }
      .doc-header-block { padding: 4px 6px; min-height: 70px; }
      .doc-header-block + .doc-header-block { border-left: 1px solid #000; }
      .doc-header-left { text-align: left; font-weight: bold; }
      .doc-header-center { text-align: center; font-weight: bold; }
      .doc-header-right { text-align: right; font-weight: bold; }
      .doc-header-center .main-title { margin: 0 0 4px 0; }
      .print-button {
        position: fixed; top: 20px; right: 20px; padding: 10px 20px;
        background: #009688; color: white; border: none; border-radius: 5px;
        cursor: pointer; font-size: 14px; z-index: 1000;
      }
      .print-button:hover { background: #00796B; }
      .loading { text-align: center; padding: 50px; font-size: 16px; color: #666; }
      @media print {
        .no-print { display: none !important; }
        body { padding: 0; }
      }
    </style>
  </head>
  <body>
    <button class="print-button no-print" onclick="window.print()">Imprimer</button>
    <div class="container">
      <div id="content">
        <div class="loading" id="loading">Chargement des donnees...</div>
      </div>
    </div>

    <script>
      function fmt(v) { return v ? new Intl.NumberFormat('fr-FR').format(v) : '0'; }
      function resClass(v) { return v >= 0 ? 'positive' : 'negative'; }

      async function loadData() {
        const db = new Dexie('TresorDatabase');
        db.version(28).stores({
          mandats: '++id, numeroMandat, dateMandat, exercice, chapitreId, sousChapitreId, previsionId, bordereauMandatId, mairieId, statut, personnelId',
          previsions: '++id, exercice, chapitreId, mairieId, statut, personnelId',
          sousChapitres: '++id, code, libelle, parentId, mairieId, actif',
          chapitres: '++id, code, libelle, mairieId, actif',
          taxes: '++id, code, libelle, mairieId, type, actif',
          declarations: '++id, numeroPiece, dateEncaissement, mairieId, taxeId, statut, bordereauId, personnelId, exercice',
          previsionsRecettes: '++id, exercice, taxeId, mairieId, statut, personnelId',
          mairies: '++id, nom, code, ville',
          printData: '++id, type, createdAt'
        });

        const exercice = new Date().getFullYear();
        const exercicePrev = exercice - 1;

        const [sousChapitres, taxes, mandatsN, mandatsN1, declarationsN, declarationsN1, mairie] = await Promise.all([
          db.sousChapitres.toArray(),
          db.taxes.toArray(),
          db.mandats.where('exercice').equals(exercice).toArray(),
          db.mandats.where('exercice').equals(exercicePrev).toArray(),
          db.declarations.where('exercice').equals(exercice).toArray(),
          db.declarations.where('exercice').equals(exercicePrev).toArray(),
          db.mairies.toCollection().first()
        ]);

        // Build sous-chapitre map (id -> code)
        const scMap = {};
        sousChapitres.forEach(sc => { scMap[sc.id] = sc.code; });

        // Build taxe map (id -> code)
        const taxeMap = {};
        taxes.forEach(t => { taxeMap[t.id] = t.code; });

        function computeResults(mandats, declarations) {
          // Depenses fonctionnement: sousChapitres starting with '6'
          let depFonc = 0;
          // Depenses investissement: sousChapitres starting with '9'
          let depInv = 0;

          mandats.forEach(m => {
            if (m.statut === 'annule') return;
            const scCode = scMap[m.sousChapitreId] || '';
            if (scCode.startsWith('6')) {
              depFonc += (m.montant || 0);
            } else if (scCode.startsWith('9')) {
              depInv += (m.montant || 0);
            }
          });

          // Recettes fonctionnement: taxes starting with '7'
          let recFonc = 0;
          // Recettes investissement: taxes starting with '0'
          let recInv = 0;

          declarations.forEach(d => {
            if (d.statut === 'annulee') return;
            const taxeCode = taxeMap[d.taxeId] || '';
            const montant = d.montantRecette || d.montant || 0;
            if (taxeCode.startsWith('7')) {
              recFonc += montant;
            } else if (taxeCode.startsWith('0')) {
              recInv += montant;
            }
          });

          return { depFonc, depInv, recFonc, recInv };
        }

        const resultsN = computeResults(mandatsN, declarationsN);
        const resultsN1 = computeResults(mandatsN1, declarationsN1);

        return { resultsN, resultsN1, exercice, exercicePrev, mairie };
      }

      function buildResultTable(title, results, colspan) {
        const { depFonc, depInv, recFonc, recInv } = results;
        const resFonc = recFonc - depFonc;
        const resInv = recInv - depInv;
        const totalRec = recFonc + recInv;
        const totalDep = depFonc + depInv;
        const totalRes = totalRec - totalDep;

        let html = '<div class="section-title">' + title + '</div>';
        html += '<table>';
        html += '<thead><tr>'
          + '<th class="col-rubrique">Rubrique</th>'
          + '<th class="col-num">Recettes</th>'
          + '<th class="col-num">Depenses</th>'
          + '<th class="col-num">Resultat</th>'
          + '</tr></thead>';
        html += '<tbody>';

        // Fonctionnement
        html += '<tr>'
          + '<td class="col-rubrique">Section Fonctionnement</td>'
          + '<td class="col-num">' + fmt(recFonc) + '</td>'
          + '<td class="col-num">' + fmt(depFonc) + '</td>'
          + '<td class="col-num ' + resClass(resFonc) + '">' + fmt(resFonc) + '</td>'
          + '</tr>';

        // Investissement
        html += '<tr>'
          + '<td class="col-rubrique">Section Investissement</td>'
          + '<td class="col-num">' + fmt(recInv) + '</td>'
          + '<td class="col-num">' + fmt(depInv) + '</td>'
          + '<td class="col-num ' + resClass(resInv) + '">' + fmt(resInv) + '</td>'
          + '</tr>';

        // Total
        html += '<tr class="grand-total">'
          + '<td class="col-rubrique">TOTAL</td>'
          + '<td class="col-num">' + fmt(totalRec) + '</td>'
          + '<td class="col-num">' + fmt(totalDep) + '</td>'
          + '<td class="col-num ' + resClass(totalRes) + '">' + fmt(totalRes) + '</td>'
          + '</tr>';

        html += '</tbody></table>';
        return { html, totalRec, totalDep, totalRes };
      }

      function render(data) {
        const { resultsN, resultsN1, exercice, exercicePrev, mairie } = data;
        const mairieNom = mairie ? mairie.nom || 'Mairie de Vavoua' : 'Mairie de Vavoua';

        let content = '';

        // Document header
        content += '<table><thead><tr><td colspan="4" class="doc-header-cell">'
          + '<div class="doc-header-grid">'
          + '<div class="doc-header-block doc-header-left">REPUBLIQUE DE COTE D\'IVOIRE<br>' + mairieNom + '</div>'
          + '<div class="doc-header-block doc-header-center"><div class="main-title">COMPTE ADMINISTRATIF - RESULTAT</div><div>Exercice ' + exercice + '</div></div>'
          + '<div class="doc-header-block doc-header-right">Page <span class="page-num">1</span></div>'
          + '</div></td></tr></thead></table>';

        // A. RESULTAT DE L'EXERCICE N
        const sectionA = buildResultTable('A. RESULTAT DE L\'EXERCICE ' + exercice, resultsN);
        content += sectionA.html;

        // B. RESULTAT EXERCICE PRECEDENT (N-1)
        const sectionB = buildResultTable('B. RESULTAT EXERCICE PRECEDENT ' + exercicePrev, resultsN1);
        content += sectionB.html;

        // C. RESULTAT CUMULE (N + N-1)
        const cumulRec = sectionA.totalRec + sectionB.totalRec;
        const cumulDep = sectionA.totalDep + sectionB.totalDep;
        const cumulRes = cumulRec - cumulDep;

        content += '<div class="section-title">C. RESULTAT CUMULE (N + N-1)</div>';
        content += '<table>';
        content += '<thead><tr>'
          + '<th class="col-rubrique">Rubrique</th>'
          + '<th class="col-num">Recettes</th>'
          + '<th class="col-num">Depenses</th>'
          + '<th class="col-num">Resultat</th>'
          + '</tr></thead>';
        content += '<tbody>';

        content += '<tr>'
          + '<td class="col-rubrique">Resultat Exercice ' + exercice + '</td>'
          + '<td class="col-num">' + fmt(sectionA.totalRec) + '</td>'
          + '<td class="col-num">' + fmt(sectionA.totalDep) + '</td>'
          + '<td class="col-num ' + resClass(sectionA.totalRes) + '">' + fmt(sectionA.totalRes) + '</td>'
          + '</tr>';

        content += '<tr>'
          + '<td class="col-rubrique">Resultat Exercice ' + exercicePrev + '</td>'
          + '<td class="col-num">' + fmt(sectionB.totalRec) + '</td>'
          + '<td class="col-num">' + fmt(sectionB.totalDep) + '</td>'
          + '<td class="col-num ' + resClass(sectionB.totalRes) + '">' + fmt(sectionB.totalRes) + '</td>'
          + '</tr>';

        content += '<tr class="grand-total">'
          + '<td class="col-rubrique">RESULTAT CUMULE</td>'
          + '<td class="col-num">' + fmt(cumulRec) + '</td>'
          + '<td class="col-num">' + fmt(cumulDep) + '</td>'
          + '<td class="col-num ' + resClass(cumulRes) + '">' + fmt(cumulRes) + '</td>'
          + '</tr>';

        content += '</tbody></table>';

        document.getElementById('content').innerHTML = content;
      }

      function processMessage(msgData) {
        if (msgData && msgData.type === 'FILL_COMPTE_ADMIN_DATA') {
          if (msgData.data) {
            render(msgData.data);
          }
        }
      }

      let pendingData = null;
      let dataProcessed = false;

      window.addEventListener('message', function(event) {
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          processMessage(event.data);
          dataProcessed = true;
        } else {
          pendingData = event.data;
        }
      });

      window.addEventListener('DOMContentLoaded', async function() {
        if (pendingData && !dataProcessed) {
          processMessage(pendingData);
          dataProcessed = true;
          return;
        }

        await new Promise(r => setTimeout(r, 500));

        if (!dataProcessed) {
          try {
            const result = await loadData();
            render(result);
            dataProcessed = true;
          } catch(e) {
            console.warn('Erreur chargement IndexedDB:', e);
          }
        }

        if (!dataProcessed) {
          try {
            const db = new Dexie('TresorDatabase');
            db.version(28).stores({ printData: '++id, type, createdAt' });
            const records = await db.table('printData').where('type').equals('FILL_COMPTE_ADMIN_DATA').toArray();
            if (records.length > 0) {
              const latest = records.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt))[0];
              processMessage(latest.data);
              await db.table('printData').delete(latest.id);
            }
          } catch(e) {
            console.warn('Erreur printData:', e);
          }
        }
      });
    </script>
  </body>
</html>
