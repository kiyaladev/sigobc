<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Administratif - Recettes Fonctionnement</title>
    <script src="../dexie.min.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        margin: 0;
        padding: 10px;
      }
      .container {
        width: 100%;
      }
      .doc-header {
        width: 100%;
        display: grid;
        grid-template-columns: 1fr 2fr 1fr;
        border: 1px solid #000;
        margin-bottom: 10px;
      }
      .doc-header-block {
        padding: 6px 8px;
        min-height: 60px;
      }
      .doc-header-block + .doc-header-block {
        border-left: 1px solid #000;
      }
      .doc-header-left {
        text-align: left;
        font-weight: bold;
      }
      .doc-header-center {
        text-align: center;
        font-weight: bold;
      }
      .doc-header-right {
        text-align: right;
        font-weight: bold;
      }
      .main-title {
        text-decoration: underline;
        font-size: 14px;
        margin: 4px 0;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 3px 5px;
      }
      th {
        background-color: #f0f0f0;
        text-align: center;
        vertical-align: middle;
        font-size: 9px;
      }
      .col-code {
        width: 8%;
        text-align: center;
      }
      .col-libelle {
        width: 28%;
        text-align: left;
      }
      .col-num {
        text-align: right;
        white-space: nowrap;
        width: 13%;
      }
      .col-percent {
        text-align: center;
        width: 8%;
      }
      .section-header {
        background-color: #d4edda;
        font-weight: bold;
      }
      .sous-total {
        background-color: #e8f5e9;
        font-weight: bold;
        font-style: italic;
      }
      .total-row {
        background-color: #c8e6c9;
        font-weight: bold;
        border-top: 2px solid #000;
      }
      .signatures {
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
        padding: 0 50px;
      }
      .signature-box {
        text-align: center;
        width: 200px;
      }
      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 24px;
        background-color: #1976d2;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }
      .print-button:hover {
        background-color: #1565c0;
      }
      .loading {
        text-align: center;
        padding: 50px;
        font-size: 16px;
        color: #666;
      }
      .print-footer {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      @media print {
        body {
          padding: 0;
        }
        .no-print {
          display: none;
        }
        .print-footer {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <button class="print-button no-print" onclick="window.print()">Imprimer</button>
    <div class="container">
      <div id="content">
        <div class="loading">Chargement des données...</div>
      </div>
    </div>

    <script>
      function fmt(v) {
        return v ? new Intl.NumberFormat('fr-FR').format(Math.round(v)) : '0';
      }
      function pct(real, prev) {
        if (!prev || prev === 0) return '0,00';
        return ((real / prev) * 100).toFixed(2).replace('.', ',');
      }

      const sectionLabels = {
        70: 'SECTION 70 - RECETTES FISCALES',
        71: 'SECTION 71 - PRESTATIONS ET SERVICES',
        72: 'SECTION 72 - REVENUS DU PATRIMOINE',
        73: 'SECTION 73 - SUBVENTIONS ET CONTRIBUTIONS',
        74: 'SECTION 74 - RECETTES DIVERSES',
      };

      var dataProcessed = false;
      let pendingData = null;

      function processData(messageData) {
        if (dataProcessed) return;
        if (messageData && messageData.type === 'FILL_COMPTE_ADMIN_DATA') {
          dataProcessed = true;
          renderPage(messageData.data);
        }
      }

      function renderPage(data) {
        const exercice = data.exercice || new Date().getFullYear();
        const mairie = data.mairie || {};
        const lignes = data.lignesRecettes || [];

        const content = document.getElementById('content');
        content.innerHTML = '';

        // Header table like in screenshot
        const headerHtml = `
          <table style="border: none; margin-bottom: 5px;">
            <tr>
              <td style="width: 30%; font-weight: bold; text-align: center; border: 1px solid #000;">
                COMMUNE DE ${(mairie.nom || 'VAVOUA').replace(/^mairie de /i, '').toUpperCase()}
              </td>
              <td style="width: 50%; font-weight: bold; text-align: center; border: 1px solid #000;">
                COMPTE ADMINISTRATIF - RECETTES DE FONCTIONNEMENT
              </td>
              <td style="width: 15%; font-weight: bold; text-align: center; border: 1px solid #000;">
                ANNEE<br>${exercice}
              </td>
              <td style="width: 5%; font-weight: bold; text-align: center; border: 1px solid #000;">
                N°<br>4
              </td>
            </tr>
          </table>
        `;

        // Main Table Header
        const tableHtml = `
          <table>
            <thead>
              <tr>
                <th rowspan="2" style="width: 30%; text-align: center;">COMPTES ET RUBRIQUES BUDGETAIRES</th>
                <th rowspan="2" style="width: 10%;">PREVISIONS</th>
                <th colspan="4">EXECUTION DU BUDGET</th>
                <th rowspan="2" style="width: 10%;">ECART<br>PREVISIONS<br>EMISSIONS</th>
                <th rowspan="2" style="width: 5%;">P</th>
                <th rowspan="2" style="width: 5%;">R /<br>%</th>
              </tr>
              <tr>
                <th style="width: 10%;">EMISSIONS</th>
                <th style="width: 10%;">RECOUVREMENT</th>
                <th style="width: 10%;">NON VALEUR</th>
                <th style="width: 10%;">RESTE A<br>RECOUVRER</th>
              </tr>
              <tr>
                <th>1</th>
                <th>2</th>
                <th>3</th>
                <th>4</th>
                <th>5</th>
                <th>9</th>
                <th>10</th>
                <th></th>
                <th>1100%</th>
              </tr>
            </thead>
            <tbody id="table-body">
            </tbody>
          </table>
        `;
        content.innerHTML = headerHtml + tableHtml;
        const tbody = document.getElementById('table-body');

        // Organize hierarchy
        const sections = {}; // code -> { label, prev, emis, rec, chapitres: {} }
        const chapitres = {}; // code -> { label, prev, emis, rec, articles: [] }
        const articles = [];

        lignes.forEach((l) => {
          const c = l.code || '';
          if (c.length === 2 && !sections[c]) {
            sections[c] = { label: l.libelle, prev: 0, emis: 0, rec: 0, chapitres: {} };
          } else if (c.length === 3 && !chapitres[c]) {
            chapitres[c] = { label: l.libelle, prev: 0, emis: 0, rec: 0, articles: [] };
          } else if (c.length >= 4) {
            articles.push(l);
          }
        });

        // Map articles to chapitres and sections
        articles.forEach((art) => {
          const c = art.code;
          const secCode = c.substring(0, 2);
          const chapCode = c.substring(0, 3);

          if (!sections[secCode]) {
            sections[secCode] = {
              label: 'SECTION ' + secCode,
              prev: 0,
              emis: 0,
              rec: 0,
              chapitres: {},
            };
          }
          if (!sections[secCode].chapitres[chapCode]) {
            if (!chapitres[chapCode]) {
              chapitres[chapCode] = {
                label: 'CHAP. ' + chapCode,
                prev: 0,
                emis: 0,
                rec: 0,
                articles: [],
              };
            }
            sections[secCode].chapitres[chapCode] = chapitres[chapCode];
          }
          sections[secCode].chapitres[chapCode].articles.push(art);

          // Bubble up totals
          const prev = art.previsions || 0;
          const emis = art.emissions || 0;
          const rec = art.recouvrements || 0;

          sections[secCode].chapitres[chapCode].prev += prev;
          sections[secCode].chapitres[chapCode].emis += emis;
          sections[secCode].chapitres[chapCode].rec += rec;

          sections[secCode].prev += prev;
          sections[secCode].emis += emis;
          sections[secCode].rec += rec;
        });

        function dashFormat(v) {
          return v && v !== 0 ? fmt(v) : '-';
        }

        let grandPrev = 0,
          grandEmis = 0,
          grandRec = 0;
        let htmlRows = '';

        Object.keys(sections)
          .sort()
          .forEach((secCode) => {
            const sec = sections[secCode];
            if (sec.prev === 0 && sec.emis === 0 && sec.rec === 0) return; // Skip empty sections

            htmlRows += '<tr class="section-header">';
            htmlRows +=
              '<td colspan="9" style="text-align: left; text-decoration: underline;"><strong>SECTION ' +
              secCode +
              ' - ' +
              (sec.label || '').replace(/^SECTION \d+( - )?/i, '').toUpperCase() +
              '</strong></td>';
            htmlRows += '</tr>';

            Object.keys(sec.chapitres)
              .sort()
              .forEach((chapCode) => {
                const chap = sec.chapitres[chapCode];
                if (chap.articles.length === 0) return;

                htmlRows += '<tr>';
                htmlRows +=
                  '<td colspan="9" style="text-align: left; text-decoration: underline;"><strong>' +
                  (chap.label || 'Chap ' + chapCode) +
                  '</strong></td>';
                htmlRows += '</tr>';

                chap.articles
                  .sort((a, b) => (a.code || '').localeCompare(b.code || ''))
                  .forEach((art) => {
                    const p = art.previsions || 0;
                    const e = art.emissions || 0;
                    const r = art.recouvrements || 0;
                    const reste = Math.max(0, e - r);
                    const ecart = p - e;
                    const pctVal = p > 0 ? Math.round((r / p) * 100) + '%' : r > 0 ? '-' : '';

                    htmlRows += '<tr>';
                    htmlRows +=
                      '<td style="text-align: left;">' +
                      art.code +
                      ' - ' +
                      (art.libelle || '') +
                      '</td>';
                    htmlRows += '<td class="col-num">' + dashFormat(p) + '</td>';
                    htmlRows += '<td class="col-num">' + dashFormat(e) + '</td>';
                    htmlRows += '<td class="col-num">' + dashFormat(r) + '</td>';
                    htmlRows += '<td class="col-num">-</td>'; // Non valeur
                    htmlRows += '<td class="col-num">' + dashFormat(reste) + '</td>';
                    htmlRows += '<td class="col-num">' + dashFormat(ecart) + '</td>';
                    htmlRows += '<td style="text-align: center;"></td>';
                    htmlRows += '<td style="text-align: center;">' + pctVal + '</td>';
                    htmlRows += '</tr>';
                  });

                // Chapitre Total
                const chapReste = Math.max(0, chap.emis - chap.rec);
                const chapEcart = chap.prev - chap.emis;
                const chapPct = chap.prev > 0 ? Math.round((chap.rec / chap.prev) * 100) + '%' : '';

                htmlRows += '<tr style="font-weight: bold; background-color: #f9f9f9;">';
                htmlRows += '<td style="text-align: center;">TOTAL CHAPITRE ' + chapCode + '</td>';
                htmlRows += '<td class="col-num">' + dashFormat(chap.prev) + '</td>';
                htmlRows += '<td class="col-num">' + dashFormat(chap.emis) + '</td>';
                htmlRows += '<td class="col-num">' + dashFormat(chap.rec) + '</td>';
                htmlRows += '<td class="col-num">-</td>';
                htmlRows += '<td class="col-num">' + dashFormat(chapReste) + '</td>';
                htmlRows += '<td class="col-num">' + dashFormat(chapEcart) + '</td>';
                htmlRows += '<td style="text-align: center;"></td>';
                htmlRows += '<td style="text-align: center;">' + chapPct + '</td>';
                htmlRows += '</tr>';
              });

            // Section Total
            const secReste = Math.max(0, sec.emis - sec.rec);
            const secEcart = sec.prev - sec.emis;
            const secPct = sec.prev > 0 ? Math.round((sec.rec / sec.prev) * 100) + '%' : '';

            htmlRows += '<tr style="font-weight: bold; background-color: #ededed;">';
            htmlRows += '<td style="text-align: center;">TOTAL SECTION ' + secCode + '</td>';
            htmlRows += '<td class="col-num">' + dashFormat(sec.prev) + '</td>';
            htmlRows += '<td class="col-num">' + dashFormat(sec.emis) + '</td>';
            htmlRows += '<td class="col-num">' + dashFormat(sec.rec) + '</td>';
            htmlRows += '<td class="col-num">-</td>';
            htmlRows += '<td class="col-num">' + dashFormat(secReste) + '</td>';
            htmlRows += '<td class="col-num">' + dashFormat(secEcart) + '</td>';
            htmlRows += '<td style="text-align: center;"></td>';
            htmlRows += '<td style="text-align: center;">' + secPct + '</td>';
            htmlRows += '</tr>';

            grandPrev += sec.prev;
            grandEmis += sec.emis;
            grandRec += sec.rec;
          });

        // Grand Total
        const grandReste = Math.max(0, grandEmis - grandRec);
        const grandEcart = grandPrev - grandEmis;
        const grandPct =
          grandPrev > 0 ? (Math.round((grandRec / grandPrev) * 10000) / 100).toFixed(2) : '0.00';

        htmlRows += '<tr style="font-weight: bold; background-color: #e0e0e0;">';
        htmlRows += '<td style="text-align: center;">TOTAL GENERAL DES RECETTES AU TITRE I</td>';
        htmlRows += '<td class="col-num">' + dashFormat(grandPrev) + '</td>';
        htmlRows += '<td class="col-num">' + dashFormat(grandEmis) + '</td>';
        htmlRows += '<td class="col-num">' + dashFormat(grandRec) + '</td>';
        htmlRows += '<td class="col-num">0</td>';
        htmlRows += '<td class="col-num">' + dashFormat(grandReste) + '</td>';
        htmlRows += '<td class="col-num">' + dashFormat(grandEcart) + '</td>';
        htmlRows += '<td style="text-align: center;"></td>';
        htmlRows += '<td style="text-align: center;">' + grandPct + '</td>';
        htmlRows += '</tr>';

        tbody.innerHTML = htmlRows;

        // Signatures (Not explicitly visible in this cropped screenshot, but standard to add)
        content.insertAdjacentHTML(
          'beforeend',
          '<div style="margin-top: 40px; margin-right: 50px; text-align: right; font-weight: bold;">Le Maire</div>',
        );

        document.title = 'Compte Administratif - Recettes Fonctionnement - ' + exercice;
      }

      // Listen for postMessage
      window.addEventListener('message', function (event) {
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
          processData(event.data);
        } else {
          pendingData = event.data;
        }
      });

      // Fallback: IndexedDB
      window.addEventListener('DOMContentLoaded', async function () {
        console.log('[RecFonct] DOMContentLoaded fired');

        if (pendingData && !dataProcessed) {
          processData(pendingData);
          return;
        }

        await new Promise((resolve) => setTimeout(resolve, 500));

        if (!dataProcessed) {
          try {
            var db = new Dexie('TresorDatabase');
            db.version(28).stores({
              mandats:
                '++id, numeroMandat, dateMandat, exercice, chapitreId, sousChapitreId, previsionId, bordereauMandatId, mairieId, statut, personnelId',
              previsions: '++id, exercice, chapitreId, mairieId, statut, personnelId',
              sousChapitres: '++id, code, libelle, parentId, mairieId, actif',
              chapitres: '++id, code, libelle, mairieId, actif',
              taxes: '++id, code, libelle, mairieId, type, actif',
              declarations:
                '++id, numeroPiece, dateEncaissement, mairieId, taxeId, statut, bordereauId, personnelId, exercice',
              previsionsRecettes: '++id, exercice, taxeId, mairieId, statut, personnelId',
              mairies: '++id, nom, code, ville',
              printData: '++id, type, createdAt',
            });

            // Check printData first
            var printDataRecords = await db
              .table('printData')
              .where('type')
              .equals('FILL_COMPTE_ADMIN_DATA')
              .toArray();

            if (printDataRecords.length > 0) {
              var latestRecord = printDataRecords.sort(function (a, b) {
                return new Date(b.createdAt) - new Date(a.createdAt);
              })[0];
              processData(latestRecord.data);
              await db.table('printData').delete(latestRecord.id);
              return;
            }

            // Fallback: aggregate from DB
            var params = new URLSearchParams(window.location.search);
            var exercice = parseInt(params.get('exercice')) || new Date().getFullYear();
            var mairieId = parseInt(params.get('mairieId')) || 1;

            var mairie = await db.table('mairies').get(mairieId);
            var allTaxes = await db.table('taxes').where('mairieId').equals(mairieId).toArray();
            var allPrevisionsRecettes = await db
              .table('previsionsRecettes')
              .where('exercice')
              .equals(exercice)
              .toArray();
            var allDeclarations = await db
              .table('declarations')
              .where('exercice')
              .equals(exercice)
              .toArray();

            var taxMap = {};
            allTaxes.forEach(function (t) {
              taxMap[t.id] = t;
            });

            // Build per-tax aggregation for codes starting with 7
            var taxAggregation = {};
            allTaxes.forEach(function (t) {
              if (!(t.code || '').startsWith('7')) return;
              taxAggregation[t.id] = {
                code: t.code,
                libelle: t.libelle,
                previsions: 0,
                emissions: 0,
                recouvrements: 0,
              };
            });

            allPrevisionsRecettes.forEach(function (pr) {
              if (taxAggregation[pr.taxeId]) {
                taxAggregation[pr.taxeId].previsions += pr.montantPrevu || 0;
              }
            });

            allDeclarations.forEach(function (d) {
              if (d.statut !== 'validee') return;
              if (!taxAggregation[d.taxeId]) return;
              var montant = d.montant || d.montantRecette || 0;
              taxAggregation[d.taxeId].emissions += montant;
              if (d.dateEncaissement) {
                taxAggregation[d.taxeId].recouvrements += montant;
              }
            });

            var lignesRecettes = Object.values(taxAggregation);

            processData({
              type: 'FILL_COMPTE_ADMIN_DATA',
              data: {
                exercice: exercice,
                mairie: mairie || {},
                lignesRecettes: lignesRecettes,
              },
            });
          } catch (e) {
            console.warn('Erreur lors de la lecture de IndexedDB:', e);
          }
        }
      });
    </script>
  </body>
</html>
