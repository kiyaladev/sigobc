<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Compte Administratif - Dépenses Engagées</title>
    <script src="../dexie.min.js"></script>
    <style>
      @page {
        size: A4 landscape;
        margin: 10mm;
      }
      body {
        font-family: Arial, Helvetica, sans-serif;
        font-size: 10px;
        margin: 0;
        padding: 10px;
      }
      .container {
        width: 100%;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 5px;
      }
      th,
      td {
        border: 1px solid #000;
        padding: 3px 5px;
        color: #000;
      }
      th {
        font-weight: bold;
        text-align: center;
        vertical-align: middle;
      }
      .col-num {
        text-align: right;
        white-space: nowrap;
        font-size: 9px;
      }
      .col-center {
        text-align: center;
        white-space: nowrap;
        font-size: 9px;
      }
      .bold {
        font-weight: bold;
      }
      .underline {
        text-decoration: underline;
      }
      .align-center {
        text-align: center;
      }
      .align-right {
        text-align: right;
      }
      .align-left {
        text-align: left;
      }
      .uppercase {
        text-transform: uppercase;
      }
      .padding-left-md {
        padding-left: 20px;
      }
      .padding-left-sm {
        padding-left: 10px;
      }
      .total-row {
        font-weight: bold;
      }
      .signatures {
        margin-top: 30px;
        display: flex;
        justify-content: space-between;
        padding: 0 50px;
      }
      .signature-box {
        text-align: center;
        width: 200px;
      }
      .print-button {
        position: fixed;
        top: 20px;
        right: 20px;
        padding: 12px 24px;
        background-color: #1976d2;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 14px;
        font-weight: bold;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        z-index: 1000;
      }
      .print-button:hover {
        background-color: #1565c0;
      }
      .loading {
        text-align: center;
        padding: 50px;
        font-size: 16px;
        color: #666;
      }
      .print-footer {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      @media print {
        body {
          padding: 0;
        }
        .no-print {
          display: none;
        }
        .print-footer {
          break-inside: avoid;
          page-break-inside: avoid;
        }
      }
    </style>
  </head>
  <body>
    <button class="print-button no-print" onclick="window.print()">Imprimer</button>
    <div class="container">
      <div id="content">
        <div class="loading">Chargement des données...</div>
      </div>
    </div>

    <script>
      function fmt(v) {
        return v ? new Intl.NumberFormat('fr-FR').format(Math.round(v)) : '0';
      }
      function pct(real, prev) {
        if (!prev || prev === 0) return '0,00';
        return ((real / prev) * 100).toFixed(2).replace('.', ',');
      }

      const sectionLabels = {
        60: 'SECTION 60 - SALAIRES ET ACCESSOIRES',
        61: 'SECTION 61 - MATÉRIEL ET FONCTIONNEMENT',
        62: "SECTION 62 - CHARGES SOCIALES DE L'ÉTAT",
        63: 'SECTION 63 - SUBVENTIONS ET TRANSFERTS',
        64: 'SECTION 64 - INTERVENTIONS ET CHARGES DIVERSES',
      };

      function renderPage(data) {
        const exercice = data.exercice || new Date().getFullYear();
        const mairie = data.mairie || {};
        const lignes = data.lignesDepenses || [];

        const content = document.getElementById('content');
        content.innerHTML = '';

        // Table
        const table = document.createElement('table');
        table.innerHTML = `
          <thead>
            <tr>
              <th rowspan="2" class="align-center bold uppercase" style="font-size: 11px;">COMMUNE DE <span id="mairie-nom-header"></span></th>
              <th rowspan="2" colspan="6" class="align-center bold uppercase" style="font-size: 11px;">COMPTE ADMINISTRATIF - DEPENSES DE FONCTIONNEMENT</th>
              <th class="align-center bold uppercase" style="font-size: 10px; width: 60px;">ANNEE</th>
              <th class="align-center bold uppercase" style="font-size: 10px; width: 40px;">N°</th>
            </tr>
            <tr>
              <th class="align-center" style="font-size: 10px;">${exercice}</th>
              <th class="align-center" style="font-size: 10px;">1</th>
            </tr>
            <tr>
              <th rowspan="2" class="align-center bold" style="font-size: 10px; width: 35%;">RUBRIQUES BUDGETAIRES</th>
              <th rowspan="2" class="align-center" style="font-size: 7px; width: 8.5%;">PREVISIONS</th>
              <th rowspan="2" class="align-center" style="font-size: 7px; width: 9%;">DEPENSES ENGAGEES</th>
              <th rowspan="2" class="align-center" style="font-size: 7px; width: 5%;">% E/P</th>
              <th rowspan="2" class="align-center" style="font-size: 7px; width: 8.5%;">MANDATS</th>
              <th colspan="3" class="align-center bold" style="font-size: 9px;">ENGAGEMENTS NON MANDATES</th>
              <th rowspan="2" class="align-center" style="font-size: 8px; width: 7%;">T O T A L</th>
            </tr>
            <tr>
              <th class="align-center" style="font-size: 6px; width: 7.5%;">COMMANDES NON<br>LIVREES</th>
              <th class="align-center" style="font-size: 6px; width: 7.5%;">COMMANDES<br>LIVREES NON<br>FACTUREES</th>
              <th class="align-center" style="font-size: 6px; width: 7.5%;">COMMANDES FACTUREES</th>
            </tr>
          </thead>
          <tbody></tbody>
        `;
        const tbody = table.querySelector('tbody');

        // Update mairie info
        const nomMairie = (mairie.nom || '').replace(/^mairie de /i, '');
        table.querySelector('#mairie-nom-header').textContent = nomMairie.toUpperCase();

        // Group lines by section
        const sections = {};
        const sectionOrder = ['60', '61', '62', '63', '64'];
        sectionOrder.forEach(function (s) {
          sections[s] = [];
        });

        lignes.forEach(function (l) {
          var prefix = (l.code || '').substring(0, 2);
          if (sections[prefix]) {
            sections[prefix].push(l);
          }
        });

        let grandPrev = 0,
          grandEng = 0;

        sectionOrder.forEach(function (secCode) {
          var items = sections[secCode];
          if (items.length === 0) return;

          items.sort(function (a, b) {
            return (a.code || '').localeCompare(b.code || '', undefined, { numeric: true });
          });

          // Section header
          var secRow = document.createElement('tr');
          secRow.innerHTML = `
            <td class="bold underline padding-left-md uppercase" style="font-size: 9px;">${sectionLabels[secCode] || 'SECTION ' + secCode}</td>
            <td></td><td></td><td></td><td></td><td></td><td></td><td></td><td></td>
          `;
          tbody.appendChild(secRow);

          var secPrev = 0,
            secEng = 0;

          items.forEach(function (l) {
            var prev = l.previsions || 0;
            var eng = l.engagements || 0;
            secPrev += prev;
            secEng += eng;

            var codeStr = l.code || '';
            var libStr = l.libelle || '';
            var td1 = codeStr + (codeStr && libStr ? ' ' : '') + libStr;

            var tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="padding-left-sm align-left" style="font-size: 9px;">${td1}</td>
              <td class="col-num">${fmt(prev)}</td>
              <td class="col-num">${fmt(eng)}</td>
              <td class="col-center">${pct(eng, prev)}</td>
              <td class="col-num">${fmt(eng)}</td>
              <td class="col-center">-</td>
              <td class="col-center">-</td>
              <td class="col-center">-</td>
              <td class="col-center">-</td>
            `;
            tbody.appendChild(tr);
          });

          // Section subtotal
          var stRow = document.createElement('tr');
          stRow.className = 'total-row';
          stRow.innerHTML = `
            <td class="bold align-right uppercase" style="font-size: 8px;">SOUS TOTAL SECTION ${secCode}</td>
            <td class="col-num">${fmt(secPrev)}</td>
            <td class="col-num">${fmt(secEng)}</td>
            <td class="col-center">${pct(secEng, secPrev)}</td>
            <td class="col-num">${fmt(secEng)}</td>
            <td class="col-center">-</td>
            <td class="col-center">-</td>
            <td class="col-center">-</td>
            <td class="col-center">-</td>
          `;
          tbody.appendChild(stRow);

          grandPrev += secPrev;
          grandEng += secEng;
        });

        // Grand total
        var totalRow = document.createElement('tr');
        totalRow.className = 'total-row';
        totalRow.innerHTML = `
          <td class="bold align-right uppercase">TOTAL GENERAL DEPENSES ENGAGEES</td>
          <td class="col-num">${fmt(grandPrev)}</td>
          <td class="col-num">${fmt(grandEng)}</td>
          <td class="col-center">${pct(grandEng, grandPrev)}</td>
          <td class="col-num">${fmt(grandEng)}</td>
          <td class="col-center">-</td>
          <td class="col-center">-</td>
          <td class="col-center">-</td>
          <td class="col-center">-</td>
        `;
        tbody.appendChild(totalRow);

        content.appendChild(table);

        // Signatures
        var sigs = document.createElement('div');
        sigs.className = 'signatures print-footer';
        var today = new Date();
        var dateStr = today.toLocaleDateString('fr-FR', {
          day: 'numeric',
          month: 'long',
          year: 'numeric',
        });
        sigs.innerHTML = `
          <div class="signature-box">
            ${mairie.nom || '---'}, le ${dateStr}<br/>
            <strong>Le Trésorier Principal</strong>
          </div>
          <div class="signature-box">
            <br/>
            <strong>Le Maire</strong>
          </div>
        `;
        content.appendChild(sigs);

        document.title = 'Compte Administratif - Dépenses Engagées - ' + exercice;
      }

      // Load data directly from IndexedDB
      async function loadAndRender() {
        try {
          var db = new Dexie('TresorDatabase');
          await db.open();

          var exercice = new Date().getFullYear();

          // Check printData
          try {
            var pd = await db.table('printData').toArray();
            var latest = pd.filter(function (p) { return p.type === 'FILL_COMPTE_ADMIN_DATA'; })
              .sort(function (a, b) { return b.createdAt - a.createdAt; })[0];
            if (latest && latest.data && latest.data.exercice) exercice = latest.data.exercice;
          } catch (e) {}

          var params = new URLSearchParams(window.location.search);
          if (params.get('exercice')) exercice = parseInt(params.get('exercice'));

          var mairie = (await db.table('mairies').toCollection().first()) || {};
          var allSousChapitres = await db.table('sousChapitres').toArray();
          var allPrevisions = await db.table('previsions').toArray();
          var previsions = allPrevisions.filter(function (p) { return p.exercice === exercice; });
          var allMandats = await db.table('mandats').toArray();
          var mandats = allMandats.filter(function (m) { return m.exercice === exercice && m.statut === 'paye'; });

          // Build per-sous-chapitre aggregation for codes starting with 6
          var scAggregation = {};
          allSousChapitres.forEach(function (sc) {
            if (!(sc.code || '').startsWith('6')) return;
            scAggregation[sc.id] = { code: sc.code, libelle: sc.libelle, previsions: 0, engagements: 0 };
          });

          previsions.forEach(function (p) {
            if (scAggregation[p.sousChapitreId]) scAggregation[p.sousChapitreId].previsions += p.montantPrevu || 0;
          });

          mandats.forEach(function (m) {
            if (scAggregation[m.sousChapitreId]) scAggregation[m.sousChapitreId].engagements += m.montant || 0;
          });

          renderPage({
            exercice: exercice,
            mairie: mairie,
            lignesDepenses: Object.values(scAggregation),
          });
        } catch (e) {
          console.error('[DepEng] Erreur:', e);
          document.getElementById('content').innerHTML = '<div style="color:red;padding:20px">Erreur: ' + e.message + '</div>';
        }
      }

      window.addEventListener('message', function (e) {
        if (e.data && e.data.type === 'FILL_COMPTE_ADMIN_DATA') {
          loadAndRender();
        }
      });

      document.addEventListener('DOMContentLoaded', function () {
        setTimeout(loadAndRender, 500);
      });
    </script>
  </body>
</html>
