<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>État de Paie Mensuel</title>
    <style>
      @page {
        size: A3 landscape;
        margin: 8mm;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background-color: #f0f0f0;
        font-family: Arial, Helvetica, sans-serif;
        font-size: 11px;
        padding: 20px;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .page-container {
        background: white;
        width: 410mm;
        margin: 0 auto;
        padding: 8mm;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }

      .print-btn {
        position: fixed;
        top: 10px;
        right: 10px;
        background: #7c3aed;
        color: white;
        border: none;
        padding: 8px 16px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        z-index: 999;
      }

      @media print {
        body {
          background: none;
          padding: 0;
        }
        .page-container {
          box-shadow: none;
          width: 100%;
          padding: 3mm;
        }
        .print-btn {
          display: none !important;
        }
        .no-print {
          display: none !important;
        }
      }

      /* EN-TÊTE */
      .header {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        border-bottom: 3px double #000;
        padding-bottom: 6px;
        margin-bottom: 10px;
      }
      .header-left {
        font-size: 10px;
        line-height: 1.7;
      }
      .header-left .republique {
        font-weight: bold;
        font-size: 11px;
        text-transform: uppercase;
      }
      .header-left .devise {
        font-style: italic;
        font-size: 9px;
        color: #555;
      }
      .header-left .mairie {
        font-weight: 900;
        font-size: 14px;
        text-transform: uppercase;
        margin-top: 3px;
      }
      .header-center {
        text-align: center;
        flex: 1;
        padding: 0 15px;
      }
      .header-center .titre {
        font-size: 18px;
        font-weight: 900;
        text-transform: uppercase;
        letter-spacing: 2px;
        border: 2px solid #000;
        padding: 6px 16px;
        display: inline-block;
      }
      .header-center .sous-titre {
        font-size: 13px;
        font-weight: bold;
        margin-top: 5px;
        color: #333;
      }
      .header-right {
        text-align: right;
        font-size: 10px;
        line-height: 1.7;
      }
      .header-right .periode {
        font-size: 20px;
        font-weight: 900;
        letter-spacing: 3px;
        display: block;
      }

      /* TABLEAU PRINCIPAL */
      table.main-table {
        width: 100%;
        border-collapse: collapse;
        font-size: 10px;
        margin-bottom: 8px;
        table-layout: fixed;
      }
      table.main-table th {
        background: #374151;
        color: white;
        border: 1px solid #000;
        padding: 4px 5px;
        text-align: center;
        font-size: 9px;
        line-height: 1.3;
      }
      table.main-table th.left {
        text-align: left;
      }
      table.main-table td {
        border: 1px solid #aaa;
        padding: 3px 5px;
        vertical-align: middle;
      }
      table.main-table td.right {
        text-align: right;
        font-family: 'Courier New', monospace;
        font-size: 9px;
      }
      table.main-table td.center {
        text-align: center;
      }
      table.main-table tr:nth-child(even) td {
        background: #f9fafb;
      }
      table.main-table tr:hover td {
        background: #eff6ff;
      }
      table.main-table tfoot td {
        background: #1e3a5f;
        color: white;
        font-weight: bold;
        border: 1px solid #000;
        padding: 4px 5px;
        font-size: 10px;
      }
      table.main-table tfoot td.right {
        text-align: right;
        font-family: 'Courier New', monospace;
      }

      .no-data {
        text-align: center;
        padding: 20px;
        color: #888;
        font-style: italic;
      }

      /* RÉSUMÉ GÉNÉRAL */
      .resume-section {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .resume-card {
        flex: 1;
        border: 1px solid #000;
        padding: 6px 10px;
        text-align: center;
      }
      .resume-card .card-label {
        font-size: 9px;
        text-transform: uppercase;
        font-weight: bold;
        color: #555;
      }
      .resume-card .card-value {
        font-size: 14px;
        font-weight: 900;
        margin-top: 2px;
        font-family: 'Courier New', monospace;
      }
      .resume-card.brut .card-value {
        color: #1d4ed8;
      }
      .resume-card.retenues .card-value {
        color: #c00;
      }
      .resume-card.net .card-value {
        color: #15803d;
      }
      .resume-card.agents .card-value {
        color: #7c3aed;
      }

      /* SIGNATURES */
      .signatures {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        font-size: 10px;
      }
      .sig-block {
        text-align: center;
        width: 28%;
        border: 1px solid #ccc;
        padding: 8px;
      }
      .sig-block .sig-title {
        font-weight: bold;
        text-transform: uppercase;
        font-size: 9px;
        border-bottom: 1px solid #ccc;
        padding-bottom: 4px;
        margin-bottom: 30px;
      }
      .sig-line {
        border-top: 1px solid #000;
        padding-top: 3px;
        font-size: 9px;
        color: #555;
      }

      /* Pied de page */
      .footer-doc {
        text-align: right;
        font-size: 8px;
        color: #999;
        margin-top: 8px;
        border-top: 1px dashed #ccc;
        padding-top: 4px;
      }
    </style>
  </head>
  <body>
    <button class="print-btn" onclick="window.print()">🖨️ Imprimer</button>

    <div class="page-container" id="content">
      <div style="text-align: center; padding: 40px; color: #888">Chargement...</div>
    </div>

    <script src="dexie.min.js"></script>
    <script>
      const MOIS_LABELS = [
        'Janvier',
        'Février',
        'Mars',
        'Avril',
        'Mai',
        'Juin',
        'Juillet',
        'Août',
        'Septembre',
        'Octobre',
        'Novembre',
        'Décembre',
      ];

      function fmt(n) {
        return Number(n || 0).toLocaleString('fr-FR');
      }

      const db = new Dexie('TresorDatabase');
      db.version(25).stores({
        mairies: '++id, nom, code, ville',
        employes: '++id, matricule, nom, prenom, service, mairieId, actif',
        fichesPaie:
          '++id, employeId, mois, annee, exercice, mairieId, statut, [annee+mois+employeId]',
      });

      document.addEventListener('DOMContentLoaded', async () => {
        const params = new URLSearchParams(window.location.search);
        const mois = parseInt(params.get('mois'), 10) || new Date().getMonth() + 1;
        const annee = parseInt(params.get('annee'), 10) || new Date().getFullYear();
        const shouldPrint = params.get('print') === 'true';
        const content = document.getElementById('content');

        try {
          const [mairie, employes, toutesLesFiches] = await Promise.all([
            db.mairies.toCollection().first(),
            db.employes.toArray(),
            db.fichesPaie.toArray(),
          ]);

          const fiches = toutesLesFiches.filter((f) => f.mois === mois && f.annee === annee);
          const empMap = new Map(employes.map((e) => [e.id, e]));

          const maisVille = mairie ? mairie.ville.toUpperCase() : 'VAVOUA';
          const maisCode = mairie ? mairie.code : '';
          const moisLabel = MOIS_LABELS[mois - 1] || '';
          const dateAujourdhui = new Date().toLocaleDateString('fr-FR', {
            day: 'numeric',
            month: 'long',
            year: 'numeric',
          });

          let totalBrut = 0,
            totalRetenues = 0,
            totalNet = 0;
          fiches.forEach((f) => {
            totalBrut += f.montantBrut || 0;
            totalRetenues +=
              (f.cotisationCNPS || 0) + (f.impotSurSalaire || 0) + (f.autresRetenues || 0);
            totalNet += f.montantNet || 0;
          });

          const rows =
            fiches.length === 0
              ? `<tr><td colspan="12" class="no-data">Aucun bulletin de paie pour ${moisLabel} ${annee}</td></tr>`
              : fiches
                  .map((f, i) => {
                    const emp = empMap.get(f.employeId);
                    const retenues =
                      (f.cotisationCNPS || 0) + (f.impotSurSalaire || 0) + (f.autresRetenues || 0);
                    const indemnites =
                      (f.indemniteLogement || 0) +
                      (f.indemniteTransport || 0) +
                      (f.autresIndemnites || 0);
                    const statutCls =
                      f.statut === 'paye'
                        ? 'color:#15803d;font-weight:bold'
                        : f.statut === 'valide'
                          ? 'color:#1d4ed8'
                          : 'color:#6b7280';
                    return `<tr>
                  <td class="center">${i + 1}</td>
                  <td><strong>${emp ? emp.matricule : '-'}</strong></td>
                  <td>${emp ? `${emp.nom} ${emp.prenom}` : '-'}</td>
                  <td>${emp ? emp.poste || '-' : '-'}</td>
                  <td>${emp ? emp.grade || '-' : '-'}</td>
                  <td>${emp ? emp.service || '-' : '-'}</td>
                  <td class="right">${fmt(f.salaireBase)}</td>
                  <td class="right">${fmt(indemnites)}</td>
                  <td class="right" style="font-weight:bold;color:#1d4ed8">${fmt(f.montantBrut)}</td>
                  <td class="right" style="color:#c00">${fmt(retenues)}</td>
                  <td class="right" style="font-weight:bold;color:#15803d">${fmt(f.montantNet)}</td>
                  <td class="center" style="${statutCls};font-size:9px">${f.statut === 'paye' ? 'Payé' : f.statut === 'valide' ? 'Validé' : 'Brouillon'}</td>
                </tr>`;
                  })
                  .join('');

          content.innerHTML = `
            <div class="header">
              <div class="header-left">
                <div class="republique">REPUBLIQUE DE CÔTE D'IVOIRE</div>
                <div class="devise">Union – Discipline – Travail</div>
                <div class="mairie">COMMUNE DE ${maisVille}</div>
                ${maisCode ? `<div style="font-size:9px;margin-top:2px">Code : <strong>${maisCode}</strong></div>` : ''}
              </div>
              <div class="header-center">
                <div class="titre">ÉTAT DE PAIE</div>
                <div class="sous-titre">Récapitulatif des rémunérations — ${moisLabel} ${annee}</div>
              </div>
              <div class="header-right">
                <span class="periode">${moisLabel.toUpperCase()}<br>${annee}</span>
              </div>
            </div>

            <div class="resume-section">
              <div class="resume-card agents">
                <div class="card-label">Agents payés</div>
                <div class="card-value">${fiches.length}</div>
              </div>
              <div class="resume-card brut">
                <div class="card-label">Total brut</div>
                <div class="card-value">${fmt(totalBrut)}</div>
              </div>
              <div class="resume-card retenues">
                <div class="card-label">Total retenues</div>
                <div class="card-value">${fmt(totalRetenues)}</div>
              </div>
              <div class="resume-card net">
                <div class="card-label">Total net à payer</div>
                <div class="card-value">${fmt(totalNet)}</div>
              </div>
            </div>

            <table class="main-table">
              <colgroup>
                <col style="width:3%"/>   <!-- N° -->
                <col style="width:7%"/>   <!-- Matricule -->
                <col style="width:18%"/>  <!-- Nom & Prénom -->
                <col style="width:11%"/>  <!-- Poste -->
                <col style="width:8%"/>   <!-- Grade -->
                <col style="width:9%"/>   <!-- Service -->
                <col style="width:9%"/>   <!-- Salaire base -->
                <col style="width:8%"/>   <!-- Indemnités -->
                <col style="width:9%"/>   <!-- Brut -->
                <col style="width:8%"/>   <!-- Retenues -->
                <col style="width:9%"/>   <!-- Net -->
                <col style="width:6%"/>   <!-- Statut -->
              </colgroup>
              <thead>
                <tr>
                  <th>N°</th>
                  <th class="left">Matricule</th>
                  <th class="left">Nom & Prénom</th>
                  <th class="left">Poste</th>
                  <th class="left">Grade</th>
                  <th class="left">Service</th>
                  <th>Salaire Base</th>
                  <th>Indemnités</th>
                  <th>Montant Brut</th>
                  <th>Retenues</th>
                  <th>Net à Payer</th>
                  <th>Statut</th>
                </tr>
              </thead>
              <tbody>${rows}</tbody>
              ${
                fiches.length > 0
                  ? `
              <tfoot>
                <tr>
                  <td colspan="8" style="text-align:right">TOTAUX (${fiches.length} agents)</td>
                  <td class="right">${fmt(totalBrut)}</td>
                  <td class="right">${fmt(totalRetenues)}</td>
                  <td class="right">${fmt(totalNet)}</td>
                  <td></td>
                </tr>
              </tfoot>`
                  : ''
              }
            </table>

            <div class="signatures">
              <div class="sig-block">
                <div class="sig-title">L'Ordonnateur</div>
                <div class="sig-line">Nom, Signature & Date</div>
              </div>
              <div class="sig-block">
                <div class="sig-title">Le Comptable Municipal</div>
                <div class="sig-line">Nom, Signature & Cachet</div>
              </div>
              <div class="sig-block">
                <div class="sig-title">Le Maire</div>
                <div class="sig-line">Nom, Signature & Cachet officiel</div>
              </div>
            </div>

            <div class="footer-doc">
              Édité le ${dateAujourdhui} — SIGOBC Mairie de ${mairie ? mairie.ville : 'Vavoua'} — Document officiel
            </div>
          `;

          if (shouldPrint) {
            setTimeout(() => window.print(), 600);
          }
        } catch (err) {
          document.getElementById('content').innerHTML =
            `<p style="color:red;padding:20px">Erreur: ${err.message}</p>`;
        }
      });
    </script>
  </body>
</html>
